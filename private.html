<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>비공개 문서</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --page:#fbfaf8; --ink:#16171a; --ink2:#34363b; --muted:#6e7076; --line:#e5e2dc; --soft:#f2efe9;
    --acc:#2f5f99; --acc-soft:#edf2f8; --dark:#1f2a37;
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; scroll-padding-top:28px; }
  body { margin:0; background:var(--page); color:var(--ink); font-family:"Pretendard Variable",Pretendard,system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif; font-size:17px; line-height:1.75; -webkit-font-smoothing:antialiased; word-break:keep-all; overflow-wrap:break-word; }
  a { color:var(--acc); text-decoration:none; }
  a:hover { text-decoration:underline; }
  b { font-weight:650; }

  /* 잠금 화면 */
  .gate { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  .gate form { width:100%; max-width:340px; }
  .gate h1 { font-size:20px; font-weight:650; margin:0 0 6px; }
  .gate p { margin:0 0 22px; color:var(--muted); font-size:15px; }
  .gate input { width:100%; height:48px; padding:0 15px; border:1px solid var(--line); border-radius:10px; background:#fff; font:inherit; font-size:16px; color:var(--ink); outline:none; }
  .gate input:focus { border-color:var(--ink2); }
  .gate button { margin-top:10px; width:100%; height:48px; border:0; border-radius:10px; background:var(--ink); color:#fff; font:inherit; font-size:16px; font-weight:600; cursor:pointer; }
  .gate button:disabled { opacity:.5; cursor:default; }
  .gate .err { min-height:22px; margin:10px 0 0; color:#b3261e; font-size:14px; }

  /* 문서 틀 */
  .wrap { display:none; max-width:1240px; margin:0 auto; padding:72px 28px 140px; }
  body.open .gate { display:none; }
  body.open .wrap { display:grid; grid-template-columns:210px minmax(0,1fr); gap:64px; }
  .toc { position:sticky; top:48px; align-self:start; font-size:14.5px; line-height:1.5; }
  .toc p { margin:0 0 12px; color:var(--muted); font-size:13px; }
  .toc a { display:block; padding:8px 0 8px 14px; color:var(--muted); border-left:2px solid var(--line); }
  .toc a:hover { color:var(--ink); text-decoration:none; }
  .toc a.on { color:var(--ink); border-left-color:var(--ink); font-weight:650; }
  main { max-width:880px; min-width:0; }

  .dh { padding-bottom:40px; border-bottom:1px solid var(--line); }
  .eyebrow { margin:0 0 14px; color:var(--muted); font-size:15px; }
  .dh h1 { margin:0 0 18px; font-size:44px; line-height:1.3; font-weight:650; letter-spacing:-.025em; }
  .meta { margin:0; color:var(--muted); font-size:15px; }

  section { padding-top:80px; }
  h2 { margin:0 0 28px; font-size:32px; line-height:1.35; font-weight:650; letter-spacing:-.02em; display:flex; gap:16px; align-items:baseline; }
  h2 .no { color:#b3b1ab; font-weight:500; min-width:20px; }
  h3 { margin:48px 0 16px; font-size:21px; line-height:1.45; font-weight:650; letter-spacing:-.012em; }
  h3.sub { margin-top:64px; padding-top:28px; border-top:1px solid var(--line); font-size:23px; }
  p { margin:0 0 14px; }
  .lead { font-size:18.5px; color:var(--ink2); }
  .note { color:var(--muted); font-size:15px; }

  /* 가설 */
  .hyp { margin:0 0 8px; padding:36px 36px 32px; background:var(--dark); color:#fff; border-radius:16px; }
  .hyp-k { margin:0 0 14px; font-size:14px; color:rgba(255,255,255,.6); }
  .hyp-t { margin:0; font-size:30px; line-height:1.42; font-weight:650; letter-spacing:-.02em; }
  .hyp-s { margin:14px 0 0; font-size:19px; line-height:1.65; color:rgba(255,255,255,.85); }
  .ahyp { margin:0 0 12px; padding:4px 0 4px 22px; border-left:4px solid var(--ink); }
  .ahyp-k { margin:0 0 4px; font-size:14px; color:var(--muted); }
  .ahyp-t { margin:0; font-size:23px; line-height:1.5; font-weight:650; letter-spacing:-.015em; }
  .ns { margin:40px 0 0; padding:24px 26px; background:#fff; border:1px solid var(--line); border-left:4px solid var(--acc); border-radius:12px; }
  .ns-k { margin:0 0 4px; font-size:14px; color:var(--acc); font-weight:600; }
  .ns-t { margin:0 0 8px; font-size:24px; line-height:1.4; font-weight:650; }
  .ns-s { margin:0; font-size:16px; color:var(--ink2); }

  ol.why { margin:0; padding:0; list-style:none; counter-reset:w; border-top:1px solid var(--line); }
  ol.why li { counter-increment:w; position:relative; padding:18px 0 18px 40px; border-bottom:1px solid var(--line); color:var(--ink2); }
  ol.why li::before { content:counter(w); position:absolute; left:0; top:18px; color:#b3b1ab; font-weight:600; font-size:18px; }
  ol.why li b { display:block; margin-bottom:4px; font-size:18.5px; color:var(--ink); }

  .kv { display:grid; grid-template-columns:120px minmax(0,1fr); margin:0; border-top:1px solid var(--line); }
  .kv dt, .kv dd { margin:0; padding:13px 0; border-bottom:1px solid var(--line); }
  .kv dt { color:var(--muted); font-size:15px; padding-right:16px; padding-top:14px; }
  .kv dd { font-size:16.5px; }

  /* 타임라인 */
  .tl { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px; margin:8px 0 36px; }
  .tl-c { padding:16px 14px 18px; background:#fff; border:1px solid var(--line); border-top:3px solid #cfccc5; border-radius:10px; }
  .tl-c.on { border-top-color:var(--acc); }
  .tl-d { margin:0 0 8px; font-size:16px; font-weight:650; }
  .tl-u { margin:0 0 10px; font-size:14.5px; line-height:1.55; color:var(--ink2); }
  .tl-w { margin:0; font-size:14px; line-height:1.5; color:var(--acc); font-weight:600; }

  /* 표 */
  .tw { overflow-x:auto; margin:8px 0 12px; }
  table { width:100%; border-collapse:collapse; font-size:15.5px; line-height:1.6; }
  th, td { text-align:left; vertical-align:top; padding:12px 14px 12px 0; border-bottom:1px solid var(--line); }
  thead th { color:var(--muted); font-weight:500; font-size:13.5px; border-bottom:1.5px solid var(--ink2); }
  tbody th { font-weight:650; color:var(--ink); min-width:110px; }
  table.map tbody th { font-size:17px; }
  table.map td:nth-child(2) { font-weight:600; color:var(--ink); }
  table.script td:nth-child(3) { font-weight:650; }

  /* 액션 카드 */
  .act { margin-top:40px; padding-top:26px; border-top:2px solid var(--ink); }
  .act-n { margin:0 0 6px; font-size:14px; font-weight:700; color:var(--acc); letter-spacing:.02em; }
  .act h3 { margin:0 0 18px; font-size:23px; line-height:1.45; }
  .why1 { margin:16px 0 0; padding:14px 18px; background:var(--soft); border-radius:10px; font-size:15.5px; color:var(--ink2); }
  .cap { margin:-6px 0 12px; color:var(--muted); font-size:14.5px; }

  /* 메시지 */
  .msg { margin:28px 0 20px; padding:28px 30px; background:#fff; border:1px solid var(--line); border-radius:14px; }
  .msg-k { margin:0 0 6px; font-size:14px; color:var(--muted); }
  .msg-t { margin:0 0 16px; font-size:30px; line-height:1.4; font-weight:650; letter-spacing:-.02em; }
  .msg ul { margin:0; padding:0; list-style:none; border-top:1px solid var(--line); }
  .msg li { padding:10px 0; border-bottom:1px solid var(--line); font-size:17px; }
  .msg li b { display:inline-block; min-width:56px; color:var(--muted); font-size:14.5px; font-weight:600; }

  /* 캐러셀 시안 */
  .car { display:grid; grid-auto-flow:column; grid-auto-columns:272px; gap:14px; overflow-x:auto; padding:4px 0 16px; scroll-snap-type:x mandatory; }
  .cd { scroll-snap-align:start; position:relative; margin:0; aspect-ratio:4/5; background:#fff; border:1px solid var(--line); border-radius:8px; padding:26px 22px 44px; display:flex; flex-direction:column; overflow:hidden; }
  .cd.cv { background:var(--dark); border-color:var(--dark); color:#fff; justify-content:center; }
  .cn { position:absolute; top:16px; right:18px; margin:0; font-size:12px; color:var(--muted); }
  .cv .cn, .cv .cb { color:rgba(255,255,255,.55); }
  .cb { position:absolute; left:22px; bottom:16px; margin:0; font-size:12px; font-weight:600; color:var(--muted); }
  .ct { margin:0; font-size:25px; line-height:1.4; font-weight:650; letter-spacing:-.02em; }
  .cv .cx { margin-top:16px; color:rgba(255,255,255,.78); }
  .ch { margin:20px 0 14px; font-size:20px; line-height:1.45; font-weight:650; letter-spacing:-.015em; }
  .cx { margin:0; font-size:14.5px; line-height:1.62; color:var(--ink2); }
  .cl { margin:0; padding:0; list-style:none; font-size:14.5px; line-height:1.5; }
  .cl li { padding:8px 0; border-top:1px solid var(--line); }
  .cc p { margin:0 0 12px; font-size:14px; line-height:1.55; color:var(--ink2); }
  .cc b { display:block; font-size:13.5px; color:var(--ink); margin-bottom:2px; }
  .cp p { display:flex; flex-direction:column; margin:0 0 10px; padding:10px 0; border-top:1px solid var(--line); }
  .cp span { font-size:13px; color:var(--muted); }
  .cp b { font-size:19px; }
  .cp .on b { color:var(--acc); }

  /* 선택 · 목표 · 두 축 */
  .pick { margin:0 0 22px; font-size:30px; line-height:1.35; font-weight:650; letter-spacing:-.02em; }
  .pick span { margin-left:10px; font-size:18px; font-weight:500; color:var(--muted); letter-spacing:0; }
  tr.hl th, tr.hl td { background:var(--acc-soft); }
  tr.hl th { color:var(--acc); padding-left:10px; }
  .goal { margin:0 0 8px; padding:28px 30px; background:var(--dark); color:#fff; border-radius:14px; }
  .goal-k { margin:0 0 8px; font-size:14px; color:rgba(255,255,255,.6); }
  .goal-t { margin:0; font-size:28px; line-height:1.4; font-weight:650; letter-spacing:-.02em; }
  .goal-s { margin:10px 0 0; font-size:17px; color:rgba(255,255,255,.82); }
  .ax2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:4px 0 8px; }
  .ax { padding:24px 24px 18px; background:#fff; border:1px solid var(--line); border-top:3px solid var(--ink); border-radius:12px; }
  .ax-k { margin:0 0 4px; font-size:14px; font-weight:700; color:var(--acc); }
  .ax-t { margin:0 0 12px; font-size:22px; line-height:1.4; font-weight:650; letter-spacing:-.015em; }
  .ax ul, ul.pts { margin:0; padding:0; list-style:none; }
  .ax li, ul.pts li { position:relative; padding:7px 0 7px 16px; font-size:16px; color:var(--ink2); }
  .ax li::before, ul.pts li::before { content:""; position:absolute; left:0; top:17px; width:6px; height:6px; border-radius:50%; background:#b3b1ab; }
  ul.pts { margin:0 0 14px; }
  ul.pts li { font-size:17px; }
  table.kw th small { display:block; margin-top:2px; font-size:12.5px; font-weight:500; color:var(--muted); }
  table.kw td { font-size:15px; }

  /* 탭 문서 (section[data-tab]이 있으면 장마다 탭으로) */
  .tabs { position:sticky; top:0; z-index:5; display:flex; gap:2px; overflow-x:auto; margin:0 -4px; padding:12px 4px 0; background:var(--page); border-bottom:1px solid var(--line); scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tabs button { flex:none; padding:10px 8px 13px; border:0; border-bottom:2px solid transparent; background:none; font:inherit; font-size:14.5px; color:var(--muted); white-space:nowrap; cursor:pointer; }
  .tabs button:hover { color:var(--ink); }
  .tabs button .tn { margin-right:4px; color:#b3b1ab; font-weight:600; }
  .tabs button.on { color:var(--ink); font-weight:650; border-bottom-color:var(--ink); }
  .tabs button.on .tn { color:var(--acc); }
  body.tabbed section[data-tab] { display:none; padding-top:44px; }
  body.tabbed section[data-tab].on { display:block; }
  .pn { display:flex; justify-content:space-between; gap:12px; margin-top:72px; padding-top:22px; border-top:1px solid var(--line); }
  .pn button { padding:0; border:0; background:none; font:inherit; font-size:17px; font-weight:650; color:var(--ink); text-align:left; cursor:pointer; }
  .pn button.nx { text-align:right; margin-left:auto; }
  .pn button small { display:block; margin-bottom:2px; font-size:13px; font-weight:500; color:var(--muted); }
  .pn button:hover { color:var(--acc); }

  /* 단계 · 카드 */
  .tl.n4 { grid-template-columns:repeat(4,minmax(0,1fr)); }
  .tl.n3 { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .tl.n4 .tl-u, .tl.n3 .tl-u { margin:0; font-size:15px; }
  .ax3 { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin:4px 0 12px; }
  .ax-d { margin:0 0 10px; font-size:15.5px; color:var(--ink2); }
  .ax-q { margin:0; padding-top:10px; border-top:1px solid var(--line); font-size:16px; font-weight:650; }
  .ax3 .ax-t { font-size:19px; }
  .callout { margin:16px 0 20px; padding:18px 22px; background:var(--soft); border-radius:12px; font-size:16.5px; color:var(--ink2); }
  .callout.accent { background:var(--acc-soft); }
  .callout .lb { margin-right:10px; color:var(--acc); }

  /* 키워드 */
  .kwg { margin:26px 0 0; }
  .kwg-h { display:flex; gap:10px; align-items:baseline; margin:0 0 8px; }
  .kwg-h b { font-size:18px; }
  .kwg-h span { font-size:14px; color:var(--muted); }
  ul.kwl { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); column-gap:28px; margin:0 0 4px; padding:0; list-style:none; border-top:1px solid var(--line); }
  ul.kwl li { display:flex; justify-content:space-between; gap:8px; padding:10px 0; border-bottom:1px solid var(--line); font-size:15.5px; }
  ul.kwl li em { font-style:normal; font-weight:650; color:var(--acc); font-variant-numeric:tabular-nums; }

  /* 펼쳐 보는 예시 */
  details { margin:18px 0; background:#fff; border:1px solid var(--line); border-radius:12px; }
  summary { display:flex; gap:12px; align-items:center; padding:16px 20px; font-size:16.5px; font-weight:650; list-style:none; cursor:pointer; }
  summary::-webkit-details-marker { display:none; }
  summary::before { content:"+"; flex:none; width:22px; height:22px; display:grid; place-items:center; border:1px solid var(--line); border-radius:6px; color:var(--muted); font-weight:500; }
  details[open] summary::before { content:"−"; }
  .ex { padding:6px 22px 22px; border-top:1px solid var(--line); }
  .exh { margin:20px 0 8px; font-size:13.5px; font-weight:700; color:var(--acc); }
  .q { margin:0 0 10px; padding:12px 16px; background:var(--soft); border-radius:10px; }
  .ans { margin:0 0 10px; padding:4px 0 4px 18px; border-left:3px solid var(--acc); font-size:16px; }
  .ans p { margin:0 0 10px; }
  .post { margin:14px 0; padding:26px 28px; background:var(--page); border:1px solid var(--line); border-radius:12px; font-size:16px; }
  .post h4 { margin:0 0 6px; font-size:22px; line-height:1.4; font-weight:650; }
  .post h5 { margin:24px 0 8px; font-size:17px; font-weight:650; }
  .post ol, .post ul { margin:0 0 12px; padding-left:22px; }
  .post li { margin:5px 0; }
  .kwline { margin:0 0 16px; font-size:14px; color:var(--muted); }
  .cta { margin:16px 0 0; padding:12px 16px; background:var(--acc-soft); border-radius:10px; color:var(--acc); font-weight:650; }
  code { padding:1px 6px; background:var(--soft); border-radius:5px; font-size:14px; }
  .tag { margin-left:6px; font-size:13.5px; color:var(--muted); }

  /* 시안 이미지 */
  .shots { display:grid; grid-auto-flow:column; grid-auto-columns:250px; gap:12px; overflow-x:auto; padding:4px 0 14px; margin:8px 0 6px; scroll-snap-type:x mandatory; }
  .shots img { display:block; width:100%; height:auto; border:1px solid var(--line); border-radius:8px; background:#fff; cursor:zoom-in; scroll-snap-align:start; }
  .shots.grid4 { grid-auto-flow:row; grid-template-columns:repeat(4,minmax(0,1fr)); align-items:start; overflow:visible; }
  .shots figure { margin:0; }
  .shots figcaption { margin-top:8px; font-size:13.5px; color:var(--muted); }
  .lbx { position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center; padding:28px; background:rgba(18,19,22,.86); cursor:zoom-out; }
  .lbx.on { display:flex; }
  .lbx img { max-width:100%; max-height:100%; border-radius:8px; }

  @media (max-width: 1000px) {
    .tl.n4, .tl.n3, .ax3 { grid-template-columns:1fr; }
    ul.kwl { grid-template-columns:1fr 1fr; }
    .shots.grid4 { grid-template-columns:1fr 1fr; }
    .shots { grid-auto-columns:200px; }
    .post { padding:20px 18px; }
    .tabs button { font-size:14.5px; padding:10px 10px 12px; }
  }
  @media (max-width: 560px) {
    ul.kwl { grid-template-columns:1fr; }
  }

  @media (max-width: 1000px) {
    body.open .wrap { display:block; padding:40px 18px 100px; }
    .toc { display:none; }
    .dh h1 { font-size:32px; }
    h2 { font-size:26px; }
    .hyp { padding:28px 24px; }
    .hyp-t { font-size:24px; }
    .hyp-s { font-size:17px; }
    .ahyp-t, .act h3 { font-size:20px; }
    .msg-t { font-size:24px; }
    .kv { grid-template-columns:92px minmax(0,1fr); }
    .tl, .ax2 { grid-template-columns:1fr; }
    .pick, .goal-t { font-size:24px; }
    table { font-size:14.5px; }
    .car { grid-auto-columns:236px; }
  }
  @media print {
    body { background:#fff; }
    .toc { display:none; }
    body.open .wrap { display:block; padding:0; }
    .car { grid-auto-flow:row; grid-template-columns:repeat(3, 1fr); overflow:visible; }
  }
</style>
</head>
<body>
<div class="gate">
  <form id="gf" autocomplete="off">
    <h1>비공개 문서</h1>
    <p>비밀번호를 입력하면 열립니다.</p>
    <input id="pw" type="password" placeholder="비밀번호" aria-label="비밀번호" autocomplete="new-password" required>
    <button id="go" type="submit">열기</button>
    <p class="err" id="er" role="alert"></p>
  </form>
</div>
<div class="wrap">
  <nav class="toc" id="toc" aria-label="목차"></nav>
  <main id="doc"></main>
</div>
<div class="lbx" id="lbx" role="dialog" aria-label="이미지 크게 보기"><img alt=""></div>
<script src="/config.js"></script>
<script>
// 스튜디오 '과제' 탭에서 발행한 페이지 — /a/<slug>. 본문은 비밀번호가 맞을 때만 DB 함수(open_private_page)가 돌려줌
const cfg = window.APP_CONFIG || {};
const slug = (location.pathname.match(/^\/a\/([a-z0-9-]{3,64})\/?$/) || [])[1] || new URLSearchParams(location.search).get("s") || "";
const KEY = "pp:" + slug;

async function open_(pw) {
  const r = await fetch(cfg.SUPABASE_URL + "/rest/v1/rpc/open_private_page", {
    method: "POST",
    headers: { apikey: cfg.SUPABASE_ANON_KEY, Authorization: "Bearer " + cfg.SUPABASE_ANON_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ p_slug: slug, p_pass: pw })
  });
  if (!r.ok) throw new Error("net");
  return r.json();
}

function show(page) {
  const doc = document.getElementById("doc");
  doc.innerHTML = page.html || "";
  document.body.classList.add("open");
  const h1 = doc.querySelector("h1");
  document.title = page.title || (h1 ? h1.innerHTML.replace(/<br\s*\/?>/g, " ").replace(/<[^>]+>/g, "") : "문서");
  bindZoom(doc);
  const tabSecs = [...doc.querySelectorAll("section[data-tab]")];
  if (tabSecs.length) { showTabs(doc, tabSecs); return; }
  const toc = document.getElementById("toc"), hs = [...doc.querySelectorAll("section[id] > h2")];
  if (!hs.length) { toc.style.display = "none"; return; }
  toc.innerHTML = "<p>목차</p>" + hs.map(h => {
    const no = h.querySelector(".no"), t = no ? h.textContent.slice(no.textContent.length) : h.textContent;
    return `<a href="#${h.parentElement.id}">${no ? no.textContent + ". " : ""}${t}</a>`;
  }).join("");
  const links = [...toc.querySelectorAll("a")];
  const io = new IntersectionObserver(es => {
    es.forEach(e => { if (e.isIntersecting) links.forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id)); });
  }, { rootMargin: "-20% 0px -70% 0px" });
  doc.querySelectorAll("section[id]").forEach(s => io.observe(s));
  window.scrollTo(0, 0);
}

// 장(section[data-tab])마다 탭 하나. 왼쪽 목차는 지금 탭의 소제목, 주소 #장id로 탭 유지
function showTabs(doc, secs) {
  document.body.classList.add("tabbed");
  document.documentElement.style.scrollPaddingTop = "84px"; // 위에 붙는 탭 막대만큼
  const bar = document.createElement("nav");
  bar.className = "tabs"; bar.setAttribute("role", "tablist");
  bar.innerHTML = secs.map((s, i) => `<button type="button" role="tab" data-i="${i}"><span class="tn">${i + 1}</span>${s.dataset.tab}</button>`).join("");
  const head = doc.querySelector(".dh");
  head ? head.after(bar) : doc.prepend(bar);
  secs.forEach((s, i) => {
    s.querySelectorAll("h3").forEach((h, j) => { if (!h.id) h.id = s.id + "-" + j; });
    const pn = document.createElement("div");
    pn.className = "pn";
    pn.innerHTML = (i > 0 ? `<button type="button" data-i="${i - 1}"><small>← 이전</small>${secs[i - 1].dataset.tab}</button>` : "")
      + (i < secs.length - 1 ? `<button type="button" class="nx" data-i="${i + 1}"><small>다음 →</small>${secs[i + 1].dataset.tab}</button>` : "");
    s.appendChild(pn);
  });
  const toc = document.getElementById("toc"), btns = [...bar.querySelectorAll("button")];
  function go(i, fromUser) {
    secs.forEach((s, k) => s.classList.toggle("on", k === i));
    btns.forEach((b, k) => { b.classList.toggle("on", k === i); b.setAttribute("aria-selected", k === i); });
    btns[i].scrollIntoView({ block: "nearest", inline: "nearest" });
    toc.innerHTML = `<p>${i + 1}. ${secs[i].dataset.tab}</p>` + [...secs[i].querySelectorAll("h3")].map(h => `<a href="#${h.id}">${h.textContent}</a>`).join("");
    if (fromUser) {
      history.replaceState(null, "", "#" + secs[i].id);
      const top = bar.getBoundingClientRect().top + window.scrollY;
      if (window.scrollY > top) window.scrollTo(0, top);
    }
  }
  doc.addEventListener("click", e => { const b = e.target.closest(".tabs button, .pn button"); if (b) go(+b.dataset.i, true); });
  const h = decodeURIComponent(location.hash.slice(1)), el = h && document.getElementById(h);
  const sec = el && el.closest("section[data-tab]");
  go(sec ? secs.indexOf(sec) : 0, false);
  if ("scrollRestoration" in history) history.scrollRestoration = "manual";
  setTimeout(() => { if (el && el !== sec) el.scrollIntoView(); else window.scrollTo(0, 0); }, 0);
}

// 시안 이미지 누르면 크게
function bindZoom(doc) {
  const box = document.getElementById("lbx"), img = box.querySelector("img");
  doc.addEventListener("click", e => { const t = e.target.closest(".shots img"); if (!t) return; img.src = t.src; img.alt = t.alt; box.classList.add("on"); });
  box.addEventListener("click", () => box.classList.remove("on"));
  document.addEventListener("keydown", e => { if (e.key === "Escape") box.classList.remove("on"); });
}

const f = document.getElementById("gf"), pw = document.getElementById("pw"), go = document.getElementById("go"), er = document.getElementById("er");
// 매번 비밀번호를 물음 — 열어 본 비밀번호를 저장해 두고 다시 들어올 때 자동으로 여는 동작은 없앰(2026-10-24)
async function tryOpen(v) {
  if (!v) { pw.focus(); return; }
  go.disabled = true; go.textContent = "확인 중"; er.textContent = "";
  try {
    const page = slug ? await open_(v) : null;
    if (page && page.html) { pw.value = ""; show(page); }
    else { er.textContent = "비밀번호가 맞지 않습니다."; pw.select(); }
  } catch (e) {
    er.textContent = "잠시 후 다시 시도해 주세요.";
  }
  go.disabled = false; go.textContent = "열기";
}
f.addEventListener("submit", e => { e.preventDefault(); tryOpen(pw.value); });
try { sessionStorage.removeItem(KEY); } catch (e) {} // 예전 버전이 남긴 저장값 지우기
pw.focus();
</script>
