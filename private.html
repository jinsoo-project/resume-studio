<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>비공개 문서</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --page:#fafaf8; --ink:#141414; --ink2:#3a3a3a; --muted:#7a7a76; --faint:#b9b8b3; --line:#e4e3de; --soft:#f1f0ec;
    --acc:#141414; --lab:200px; --gap:56px;
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; scroll-padding-top:28px; }
  body { margin:0; background:var(--page); color:var(--ink); font-family:"Pretendard Variable",Pretendard,system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif; font-size:16.5px; line-height:1.72; -webkit-font-smoothing:antialiased; word-break:keep-all; overflow-wrap:break-word; font-feature-settings:"tnum"; }
  a { color:var(--ink); text-decoration:underline; text-underline-offset:3px; text-decoration-color:var(--faint); }
  b { font-weight:600; }

  /* 잠금 화면 */
  .gate { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  .gate form { width:100%; max-width:320px; }
  .gate h1 { font-size:19px; font-weight:600; margin:0 0 6px; }
  .gate p { margin:0 0 22px; color:var(--muted); font-size:14.5px; }
  .gate input { width:100%; height:46px; padding:0 14px; border:1px solid var(--line); border-radius:6px; background:#fff; font:inherit; font-size:16px; color:var(--ink); outline:none; }
  .gate input:focus { border-color:var(--ink); }
  .gate button { margin-top:10px; width:100%; height:46px; border:0; border-radius:6px; background:var(--ink); color:#fff; font:inherit; font-size:15.5px; font-weight:600; cursor:pointer; }
  .gate button:disabled { opacity:.5; cursor:default; }
  .gate .err { min-height:22px; margin:10px 0 0; color:#a3261d; font-size:14px; }

  /* 문서 틀 */
  .wrap { display:none; max-width:1200px; margin:0 auto; padding:72px 32px 140px; }
  body.open .gate { display:none; }
  body.open .wrap { display:grid; grid-template-columns:200px minmax(0,1fr); gap:64px; }
  body.open.tabbed .wrap { display:block; max-width:1140px; }
  body.tabbed .toc { display:none; }
  .toc { position:sticky; top:48px; align-self:start; font-size:14px; line-height:1.5; }
  .toc p { margin:0 0 12px; color:var(--muted); font-size:13px; }
  .toc a { display:block; padding:7px 0; color:var(--muted); text-decoration:none; }
  .toc a:hover, .toc a.on { color:var(--ink); }
  main { min-width:0; }

  .dh { padding-bottom:44px; }
  .eyebrow { margin:0 0 12px; color:var(--muted); font-size:14px; }
  .dh h1 { margin:0 0 14px; font-size:38px; line-height:1.3; font-weight:600; letter-spacing:-.025em; }
  .meta { margin:0; color:var(--muted); font-size:14px; }

  section { padding-top:80px; }
  h2 { margin:0 0 36px; font-size:30px; line-height:1.35; font-weight:600; letter-spacing:-.022em; }
  h2 .no { display:block; margin-bottom:10px; font-size:14px; font-weight:500; color:var(--muted); letter-spacing:0; }
  h2 .no::before { content:"0"; }
  h3 { margin:56px 0 14px; font-size:16px; line-height:1.5; font-weight:600; letter-spacing:-.005em; }
  h4, h5 { font-weight:600; }
  p { margin:0 0 14px; }
  .lead { font-size:18px; color:var(--ink2); }
  .note, .cap { margin:12px 0 0; color:var(--muted); font-size:14.5px; }
  .sl { margin:22px 0 8px; font-size:13.5px; color:var(--muted); }
  .sl:first-child { margin-top:0; }

  /* 탭 문서: 왼쪽 소제목 · 오른쪽 본문 */
  body.tabbed section[data-tab] { display:none; padding-top:56px; }
  body.tabbed section[data-tab].on { display:grid; grid-template-columns:var(--lab) minmax(0,1fr); column-gap:var(--gap); align-items:start; }
  section[data-tab] > * { grid-column:2; min-width:0; }
  section[data-tab] > h2, section[data-tab] > .kv.sum, section[data-tab] > .pn { grid-column:1 / -1; }
  section[data-tab] > h3 { grid-column:1; }
  section[data-tab] > h3, section[data-tab] > h3 + * { margin-top:76px; padding-top:18px; border-top:1px solid var(--ink); }
  section[data-tab] > h3 + .tw { padding-top:6px; }
  section[data-tab] > h3 + .tw thead th { border-top:0; }

  .tabs { position:sticky; top:0; z-index:5; display:flex; gap:26px; overflow-x:auto; padding:14px 0 0; background:var(--page); border-bottom:1px solid var(--line); scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tabs button { flex:none; padding:8px 0 13px; border:0; border-bottom:1.5px solid transparent; margin-bottom:-1px; background:none; font:inherit; font-size:15px; color:var(--muted); white-space:nowrap; cursor:pointer; }
  .tabs button:hover { color:var(--ink); }
  .tabs button .tn { margin-right:6px; font-size:13px; color:var(--faint); }
  .tabs button.on { color:var(--ink); font-weight:600; border-bottom-color:var(--ink); }
  .tabs button.on .tn { color:var(--muted); }
  .pn { display:flex; justify-content:space-between; gap:12px; margin-top:96px; padding-top:20px; border-top:1px solid var(--line); }
  .pn button { padding:0; border:0; background:none; font:inherit; font-size:16px; font-weight:600; color:var(--ink); text-align:left; cursor:pointer; }
  .pn button.nx { text-align:right; margin-left:auto; }
  .pn button small { display:block; margin-bottom:2px; font-size:13px; font-weight:500; color:var(--muted); }
  .pn button:hover { color:var(--muted); }

  /* 라벨 · 본문 줄 */
  .kv { display:grid; grid-template-columns:150px minmax(0,1fr); margin:0; border-top:1px solid var(--line); }
  .kv dt, .kv dd { margin:0; padding:12px 0; border-bottom:1px solid var(--line); }
  .kv dt { color:var(--muted); font-size:14.5px; padding-right:16px; padding-top:13px; }
  .kv dd { font-size:16px; }
  /* 탭 첫머리 요약 */
  .kv.sum { grid-template-columns:calc(var(--lab) + var(--gap)) minmax(0,1fr); border-top:1px solid var(--ink); }
  .kv.sum dt { padding:17px 0; font-size:14.5px; color:var(--muted); }
  .kv.sum dd { padding:15px 0; font-size:18px; line-height:1.6; font-weight:500; color:var(--ink); }

  ol.why { margin:0; padding:0; list-style:none; counter-reset:w; }
  ol.why li { counter-increment:w; position:relative; padding:16px 0 16px 36px; border-bottom:1px solid var(--line); color:var(--ink2); }
  ol.why li:first-child { padding-top:0; }
  ol.why li::before { content:counter(w); position:absolute; left:0; top:16px; color:var(--faint); font-size:15px; }
  ol.why li:first-child::before { top:0; }
  ol.why li b { display:block; margin-bottom:2px; font-size:17px; color:var(--ink); }

  /* 단계 · 나란한 칸 (상자 없이 윗선만) */
  .tl, .ax3 { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:0 28px; margin:0; }
  .tl.n3, .ax3 { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .ax3.n4 { grid-template-columns:repeat(4,minmax(0,1fr)); }
  .tl-c, .ax { padding:2px 0 0; }
  .tl-d { margin:0 0 6px; font-size:15.5px; font-weight:600; }
  .tl-u { margin:0; font-size:15px; line-height:1.62; color:var(--ink2); }
  .ax-k { margin:0 0 6px; font-size:13.5px; color:var(--muted); }
  .ax-t { margin:0 0 10px; font-size:18px; line-height:1.45; font-weight:600; letter-spacing:-.012em; }
  .ax-d { margin:0 0 12px; font-size:15px; color:var(--ink2); }
  .ax-q { margin:0; padding-top:10px; border-top:1px solid var(--line); font-size:15px; font-weight:600; }

  /* 표 */
  .tw { overflow-x:auto; margin:0; }
  table { width:100%; border-collapse:collapse; font-size:15px; line-height:1.6; }
  th, td { text-align:left; vertical-align:top; padding:12px 16px 12px 0; border-bottom:1px solid var(--line); }
  th:last-child, td:last-child { padding-right:0; }
  thead th { padding-top:0; padding-bottom:10px; color:var(--muted); font-weight:400; font-size:13px; }
  tbody th { font-weight:600; color:var(--ink); min-width:104px; }
  tr.hl th, tr.hl td { color:var(--ink); font-weight:600; }
  table.kw th small, tbody th small { display:block; margin-top:2px; font-size:12.5px; font-weight:400; color:var(--muted); }
  table.mx { min-width:780px; }
  table.mx td:nth-child(4) { color:var(--ink); }
  table.script td:nth-child(3) { font-weight:600; color:var(--ink); }
  table.script td:nth-child(2), table.script td:nth-child(4) { color:var(--ink2); }

  /* 지표 목록 */
  .chips-line { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); column-gap:28px; margin:0; }
  .chips-line span { padding:11px 0; border-bottom:1px solid var(--line); font-size:15.5px; }
  .chips-line span:nth-child(-n+3) { padding-top:0; }

  /* 키워드 */
  .kwg { margin:24px 0 0; }
  .kwg:first-child { margin-top:4px; }
  .kwg-h { margin:0 0 6px; }
  .kwg-h b { font-size:15.5px; }
  ul.kwl { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); column-gap:28px; margin:0; padding:0; list-style:none; border-top:1px solid var(--line); }
  ul.kwl li { display:flex; justify-content:space-between; gap:8px; padding:9px 0; border-bottom:1px solid var(--line); font-size:15px; }
  ul.kwl li em { font-style:normal; color:var(--muted); }

  /* 펼쳐 보는 예시 */
  details { margin:0; border-bottom:1px solid var(--line); }
  details:first-of-type, h3 + details { border-top:1px solid var(--line); }
  section[data-tab] > h3 + details { border-top:1px solid var(--ink); padding-top:0; }
  summary { display:flex; gap:14px; align-items:baseline; padding:15px 0; font-size:16px; font-weight:600; list-style:none; cursor:pointer; }
  summary::-webkit-details-marker { display:none; }
  summary::before { content:"+"; flex:none; width:12px; color:var(--muted); font-weight:400; }
  details[open] summary::before { content:"–"; }
  summary:hover { color:var(--ink2); }
  .ex { padding:0 0 28px 26px; }
  .exh { margin:22px 0 8px; font-size:13px; color:var(--muted); }
  .ex > .exh:first-child, .ex > .note:first-child { margin-top:4px; }
  .q { margin:0 0 12px; padding-left:16px; border-left:2px solid var(--line); color:var(--ink2); }
  .ans { margin:0 0 12px; padding-left:16px; border-left:2px solid var(--ink); font-size:15.5px; }
  .ans p { margin:0 0 10px; }
  .ans p:last-child { margin:0; }
  .post { margin:16px 0 0; padding:22px 0 4px; border-top:1px solid var(--line); font-size:15.5px; }
  .post h4 { margin:0 0 6px; font-size:20px; line-height:1.42; letter-spacing:-.012em; }
  .post h5 { margin:22px 0 6px; font-size:16px; }
  .post ol, .post ul { margin:0 0 12px; padding-left:20px; }
  .post li { margin:4px 0; }
  .kwline { margin:0 0 16px; font-size:13.5px; color:var(--muted); }
  .cta { margin:18px 0 0; padding-top:12px; border-top:1px solid var(--line); font-weight:600; }
  ul.pts { margin:12px 0 0; padding:0; list-style:none; }
  ul.pts li { padding:9px 0; border-bottom:1px solid var(--line); font-size:16px; }
  code { padding:1px 5px; background:var(--soft); border-radius:3px; font-size:13.5px; }
  .tag { margin-left:8px; font-size:13px; color:var(--muted); }

  /* 대시보드 구성: 지표 줄 + 세 묶음 */
  .cols3 { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:0 28px; margin:0; }
  .col-h { margin:0 0 6px; font-size:15.5px; font-weight:600; }
  .cols3 ul { margin:0 0 10px; padding:0; list-style:none; border-top:1px solid var(--line); }
  .cols3 li { padding:8px 0; border-bottom:1px solid var(--line); font-size:14.5px; color:var(--ink2); }
  .col-s { margin:0; font-size:13px; color:var(--muted); }

  /* 시안 이미지 */
  .shots { display:grid; grid-auto-flow:column; grid-auto-columns:236px; gap:14px; overflow-x:auto; padding:0 0 12px; margin:0; scroll-snap-type:x mandatory; }
  .shots img { display:block; width:100%; height:auto; border:1px solid var(--line); border-radius:3px; background:#fff; cursor:zoom-in; scroll-snap-align:start; }
  .shots.grid4 { grid-auto-flow:row; grid-template-columns:repeat(4,minmax(0,1fr)); align-items:start; overflow:visible; }
  .shots figure { margin:0; }
  .shots figcaption { margin-top:8px; font-size:13px; color:var(--muted); }
  .lbx { position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center; padding:28px; background:rgba(20,20,20,.88); cursor:zoom-out; }
  .lbx.on { display:flex; }
  .lbx img { max-width:100%; max-height:100%; border-radius:3px; }

  @media (max-width: 1000px) {
    :root { --lab:150px; --gap:32px; }
    body.open .wrap { display:block; padding:40px 18px 100px; }
    .toc { display:none; }
    .dh h1 { font-size:30px; }
    h2 { font-size:25px; }
    body.tabbed section[data-tab].on { display:block; }
    section[data-tab] > h3 { margin:60px 0 0; padding-top:16px; font-size:17px; }
    section[data-tab] > h3 + * { margin-top:14px; padding-top:0; border-top:0; }
    section[data-tab] > h3 + .tw { padding-top:0; }
    section[data-tab] > h3 + details { border-top:1px solid var(--line); }
    .kv, .kv.sum { grid-template-columns:96px minmax(0,1fr); }
    .kv.sum dd { font-size:16.5px; }
    .tl, .tl.n3, .ax3, .ax3.n4, .cols3 { grid-template-columns:1fr; }
    .tl-c, .ax, .cols3 > div { padding:14px 0 16px; border-top:1px solid var(--line); }
    .tl-c:first-child, .ax:first-child, .cols3 > div:first-child { border-top:0; padding-top:0; }
    .chips-line { grid-template-columns:1fr 1fr; }
    .chips-line span:nth-child(3) { padding-top:11px; }
    ul.kwl { grid-template-columns:1fr 1fr; }
    .shots.grid4 { grid-template-columns:1fr 1fr; }
    .shots { grid-auto-columns:200px; }
    .ex { padding-left:0; }
    .tabs { gap:20px; }
    .tabs button { font-size:14.5px; }
    table { font-size:14.5px; }
  }
  @media (max-width: 560px) {
    ul.kwl { grid-template-columns:1fr; }
  }
  @media print {
    body { background:#fff; }
    .tabs, .pn { display:none; }
    body.tabbed section[data-tab] { display:grid; }
  }
</style>
</head>
<body>
<div class="gate">
  <form id="gf" autocomplete="off">
    <h1>비공개 문서</h1>
    <p>비밀번호를 입력하면 열립니다.</p>
    <input id="pw" type="password" placeholder="비밀번호" aria-label="비밀번호" autocomplete="new-password" required>
    <button id="go" type="submit">열기</button>
    <p class="err" id="er" role="alert"></p>
  </form>
</div>
<div class="wrap">
  <nav class="toc" id="toc" aria-label="목차"></nav>
  <main id="doc"></main>
</div>
<div class="lbx" id="lbx" role="dialog" aria-label="이미지 크게 보기"><img alt=""></div>
<script src="/config.js"></script>
<script>
// 스튜디오 '과제' 탭에서 발행한 페이지 — /a/<slug>. 본문은 비밀번호가 맞을 때만 DB 함수(open_private_page)가 돌려줌
const cfg = window.APP_CONFIG || {};
const slug = (location.pathname.match(/^\/a\/([a-z0-9-]{3,64})\/?$/) || [])[1] || new URLSearchParams(location.search).get("s") || "";
const KEY = "pp:" + slug;

async function open_(pw) {
  const r = await fetch(cfg.SUPABASE_URL + "/rest/v1/rpc/open_private_page", {
    method: "POST",
    headers: { apikey: cfg.SUPABASE_ANON_KEY, Authorization: "Bearer " + cfg.SUPABASE_ANON_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ p_slug: slug, p_pass: pw })
  });
  if (!r.ok) throw new Error("net");
  return r.json();
}

function show(page) {
  const doc = document.getElementById("doc");
  doc.innerHTML = page.html || "";
  document.body.classList.add("open");
  const h1 = doc.querySelector("h1");
  document.title = page.title || (h1 ? h1.innerHTML.replace(/<br\s*\/?>/g, " ").replace(/<[^>]+>/g, "") : "문서");
  bindZoom(doc);
  const tabSecs = [...doc.querySelectorAll("section[data-tab]")];
  if (tabSecs.length) { showTabs(doc, tabSecs); return; }
  const toc = document.getElementById("toc"), hs = [...doc.querySelectorAll("section[id] > h2")];
  if (!hs.length) { toc.style.display = "none"; return; }
  toc.innerHTML = "<p>목차</p>" + hs.map(h => {
    const no = h.querySelector(".no"), t = no ? h.textContent.slice(no.textContent.length) : h.textContent;
    return `<a href="#${h.parentElement.id}">${no ? no.textContent + ". " : ""}${t}</a>`;
  }).join("");
  const links = [...toc.querySelectorAll("a")];
  const io = new IntersectionObserver(es => {
    es.forEach(e => { if (e.isIntersecting) links.forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id)); });
  }, { rootMargin: "-20% 0px -70% 0px" });
  doc.querySelectorAll("section[id]").forEach(s => io.observe(s));
  window.scrollTo(0, 0);
}

// 장(section[data-tab])마다 탭 하나. 왼쪽 목차는 지금 탭의 소제목, 주소 #장id로 탭 유지
function showTabs(doc, secs) {
  document.body.classList.add("tabbed");
  document.documentElement.style.scrollPaddingTop = "84px"; // 위에 붙는 탭 막대만큼
  const bar = document.createElement("nav");
  bar.className = "tabs"; bar.setAttribute("role", "tablist");
  bar.innerHTML = secs.map((s, i) => `<button type="button" role="tab" data-i="${i}"><span class="tn">${i + 1}</span>${s.dataset.tab}</button>`).join("");
  const head = doc.querySelector(".dh");
  head ? head.after(bar) : doc.prepend(bar);
  secs.forEach((s, i) => {
    s.querySelectorAll("h3").forEach((h, j) => { if (!h.id) h.id = s.id + "-" + j; });
    const pn = document.createElement("div");
    pn.className = "pn";
    pn.innerHTML = (i > 0 ? `<button type="button" data-i="${i - 1}"><small>← 이전</small>${secs[i - 1].dataset.tab}</button>` : "")
      + (i < secs.length - 1 ? `<button type="button" class="nx" data-i="${i + 1}"><small>다음 →</small>${secs[i + 1].dataset.tab}</button>` : "");
    s.appendChild(pn);
  });
  const toc = document.getElementById("toc"), btns = [...bar.querySelectorAll("button")];
  function go(i, fromUser) {
    secs.forEach((s, k) => s.classList.toggle("on", k === i));
    btns.forEach((b, k) => { b.classList.toggle("on", k === i); b.setAttribute("aria-selected", k === i); });
    btns[i].scrollIntoView({ block: "nearest", inline: "nearest" });
    toc.innerHTML = `<p>${i + 1}. ${secs[i].dataset.tab}</p>` + [...secs[i].querySelectorAll("h3")].map(h => `<a href="#${h.id}">${h.textContent}</a>`).join("");
    if (fromUser) {
      history.replaceState(null, "", "#" + secs[i].id);
      const top = bar.getBoundingClientRect().top + window.scrollY;
      if (window.scrollY > top) window.scrollTo(0, top);
    }
  }
  doc.addEventListener("click", e => { const b = e.target.closest(".tabs button, .pn button"); if (b) go(+b.dataset.i, true); });
  const h = decodeURIComponent(location.hash.slice(1)), el = h && document.getElementById(h);
  const sec = el && el.closest("section[data-tab]");
  go(sec ? secs.indexOf(sec) : 0, false);
  if ("scrollRestoration" in history) history.scrollRestoration = "manual";
  setTimeout(() => { if (el && el !== sec) el.scrollIntoView(); else window.scrollTo(0, 0); }, 0);
}

// 시안 이미지 누르면 크게
function bindZoom(doc) {
  const box = document.getElementById("lbx"), img = box.querySelector("img");
  doc.addEventListener("click", e => { const t = e.target.closest(".shots img"); if (!t) return; img.src = t.src; img.alt = t.alt; box.classList.add("on"); });
  box.addEventListener("click", () => box.classList.remove("on"));
  document.addEventListener("keydown", e => { if (e.key === "Escape") box.classList.remove("on"); });
}

const f = document.getElementById("gf"), pw = document.getElementById("pw"), go = document.getElementById("go"), er = document.getElementById("er");
// 매번 비밀번호를 물음 — 열어 본 비밀번호를 저장해 두고 다시 들어올 때 자동으로 여는 동작은 없앰(2026-10-24)
async function tryOpen(v) {
  if (!v) { pw.focus(); return; }
  go.disabled = true; go.textContent = "확인 중"; er.textContent = "";
  try {
    const page = slug ? await open_(v) : null;
    if (page && page.html) { pw.value = ""; show(page); }
    else { er.textContent = "비밀번호가 맞지 않습니다."; pw.select(); }
  } catch (e) {
    er.textContent = "잠시 후 다시 시도해 주세요.";
  }
  go.disabled = false; go.textContent = "열기";
}
f.addEventListener("submit", e => { e.preventDefault(); tryOpen(pw.value); });
try { sessionStorage.removeItem(KEY); } catch (e) {} // 예전 버전이 남긴 저장값 지우기
pw.focus();
</script>
