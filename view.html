<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>이력서</title>
<style>
  html,body{margin:0;height:100%;background:#e9eaec;font-family:ui-sans-serif,system-ui,"Malgun Gothic",sans-serif}
  #frame{border:0;width:100%;height:100vh;display:block;background:#e9eaec}
  .bar{position:fixed;top:14px;right:14px;display:flex;gap:8px;z-index:10}
  .bar button{font:inherit;font-size:13px;font-weight:600;border:1px solid #d3d4d8;background:#fff;color:#1b1c1f;
    border-radius:8px;padding:9px 13px;cursor:pointer;box-shadow:0 4px 14px -6px rgba(0,0,0,.3)}
  .bar .prim{background:#2f6fed;color:#fff;border-color:#2f6fed}
  .msg{display:grid;place-items:center;height:100vh;color:#888;font-size:15px;padding:24px;text-align:center;line-height:1.6}
</style>
</head>
<body>
<div class="bar" id="bar" style="display:none">
  <button class="prim" onclick="printDoc()">🖨 PDF로 저장</button>
</div>
<iframe id="frame" title="이력서"></iframe>
<div class="msg" id="msg" style="display:none">불러오는 중…</div>

<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/cloud.js"></script>
<script src="/templates.js"></script>
<script src="/view.js"></script>
</body>
</html>
