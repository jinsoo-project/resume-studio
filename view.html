<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>이력서</title>
<style>
  html,body{margin:0;height:100%;background:#e9eaec;font-family:ui-sans-serif,system-ui,"Malgun Gothic",sans-serif}
  #frame{border:0;width:100%;height:100vh;display:block;background:#e9eaec}
  .bar{position:fixed;top:14px;right:14px;display:flex;gap:8px;z-index:10}
  .bar button{font:inherit;font-size:13px;font-weight:600;border:1px solid #d3d4d8;background:#fff;color:#1b1c1f;
    border-radius:8px;padding:9px 13px;cursor:pointer;box-shadow:0 4px 14px -6px rgba(0,0,0,.3)}
  .bar .prim{background:#2f6fed;color:#fff;border-color:#2f6fed}
  .msg{display:grid;place-items:center;height:100vh;color:#888;font-size:15px;padding:24px;text-align:center;line-height:1.6}
</style>
</head>
<body>
<div class="bar" id="bar" style="display:none">
  <button class="prim" onclick="printDoc()">🖨 PDF로 저장</button>
</div>
<iframe id="frame" title="이력서"></iframe>
<div class="msg" id="msg" style="display:none">불러오는 중…</div>

<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/cloud.js"></script>
<script src="/templates.js"></script>
<script>
function decodeDoc(s){return JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/')))));}
function printDoc(){var f=document.getElementById('frame');if(f&&f.contentWindow){f.contentWindow.focus();f.contentWindow.print();}}
function render(doc){
  var f=document.getElementById('frame');
  document.title=(doc.profile&&doc.profile.nameKo?doc.profile.nameKo+' — ':'')+(doc.title||'이력서');
  f.setAttribute('srcdoc', window.TEMPLATES.render(doc));
  document.getElementById('bar').style.display='flex';
  document.getElementById('msg').style.display='none';
  f.style.display='block';
}
function fail(t){var f=document.getElementById('frame');f.style.display='none';var m=document.getElementById('msg');m.style.display='grid';m.textContent=t;}

(async function(){
  var msg=document.getElementById('msg');
  // slug: ?slug= 또는 /r/<slug> 경로
  var params=new URLSearchParams(location.search);
  var slug=params.get('slug');
  if(!slug){var m=location.pathname.match(/\/[rp]\/([^/?#]+)/);if(m)slug=decodeURIComponent(m[1]);}
  var hash=location.hash.slice(1);

  // 1) hash 인코딩 모드 (오프라인/자체완결) 우선
  if(hash){
    try{ render(decodeDoc(hash)); return; }
    catch(e){ fail('링크가 손상되었어요.'); return; }
  }
  // 2) slug → 클라우드 조회
  if(slug){
    document.getElementById('frame').style.display='none'; msg.style.display='grid'; msg.textContent='불러오는 중…';
    try{
      var row=await window.CLOUD.fetchPublic(slug);
      if(row&&row.snapshot){ render(row.snapshot); return; }
      fail('해당 주소의 이력서를 찾을 수 없어요. (비공개이거나 삭제됨)');
    }catch(e){ fail('불러오지 못했어요: '+(e.message||e)); }
    return;
  }
  fail('열 문서가 없습니다. 스튜디오에서 발행한 링크로 접속하세요.');
})();
</script>
</body>
</html>
