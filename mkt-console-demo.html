<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NESTWELL MKT — Agent Dashboard (Demo)</title>
<meta name="description" content="마케팅 운영 콘솔 데모 — 모든 수치는 가상 데이터입니다.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ── 전역 토큰 (shadcn 뉴트럴 · oklch 무채색) ───────────────────────── */
:root{
  --font-sans:"Inter","Pretendard Variable",Pretendard,-apple-system,system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --background:oklch(1 0 0);--foreground:oklch(0.145 0 0);--primary:oklch(0.205 0 0);--primary-foreground:oklch(0.985 0 0);
  --muted:oklch(0.97 0 0);--muted-foreground:oklch(0.556 0 0);--border-g:oklch(0.922 0 0);
  --sidebar:oklch(0.985 0 0);
  /* 화면 스코프 토큰(.pld) */
  --bg:oklch(1 0 0);--surface:oklch(1 0 0);--surface2:oklch(0.97 0 0);--border:oklch(0.922 0 0);--border2:oklch(0.87 0 0);
  --text:oklch(0.145 0 0);--subtle:oklch(0.446 0 0);--faint:oklch(0.708 0 0);
  --accent:oklch(0.205 0 0);--accent-soft:oklch(0.97 0 0);
  --seg-direct:#1baf7a;--seg-private:#eb6834;--seg-direct-soft:#dcf2e9;--seg-private-soft:#fce4d8;
  --good:#0ca30c;--danger:oklch(0.577 0.245 27.325);--amber:#9a5b09;--overlay:rgba(0,0,0,.5);
  --ring:oklch(0.922 0 0);--shadow:0 1px 2px rgba(0,0,0,.05);
  --host:#4c6ab0;--guest:#b95d18;--host-soft:#e5eaf5;--guest-soft:#f7e9dc;
  --comp-rent:oklch(0.269 0 0);--comp-mgmt:oklch(0.446 0 0);--comp-clean:oklch(0.60 0 0);--comp-fee:oklch(0.75 0 0);--comp-etc:oklch(0.922 0 0);--comp-dep:oklch(0.85 0.035 250);
  --c1:oklch(0.87 0 0);--c2:oklch(0.556 0 0);--c3:oklch(0.439 0 0);--c4:oklch(0.371 0 0);--c5:oklch(0.269 0 0);
}
.dark{
  --background:oklch(0.145 0 0);--foreground:oklch(0.985 0 0);--primary:oklch(0.922 0 0);--primary-foreground:oklch(0.205 0 0);
  --muted:oklch(0.269 0 0);--muted-foreground:oklch(0.708 0 0);--border-g:oklch(1 0 0 / 10%);--sidebar:oklch(0.17 0 0);
  --bg:oklch(0.145 0 0);--surface:oklch(0.205 0 0);--surface2:oklch(0.269 0 0);--border:oklch(1 0 0 / 10%);--border2:oklch(1 0 0 / 15%);
  --text:oklch(0.985 0 0);--subtle:oklch(0.708 0 0);--faint:oklch(0.556 0 0);--accent:oklch(0.922 0 0);--accent-soft:oklch(0.269 0 0);
  --seg-direct:#199e70;--seg-private:#d95926;--seg-direct-soft:#123430;--seg-private-soft:#3a2018;
  --danger:oklch(0.704 0.191 22.216);--amber:#e0a465;--overlay:rgba(0,0,0,.6);--ring:oklch(1 0 0 / 10%);--shadow:0 1px 2px rgba(0,0,0,.3);
  --host:#8ea8e8;--guest:#e8975a;--host-soft:#1d2537;--guest-soft:#332415;
  --comp-rent:oklch(0.87 0 0);--comp-mgmt:oklch(0.708 0 0);--comp-clean:oklch(0.60 0 0);--comp-fee:oklch(0.50 0 0);--comp-etc:oklch(0.371 0 0);--comp-dep:oklch(0.48 0.05 250);
  --c1:oklch(0.371 0 0);--c2:oklch(0.556 0 0);--c3:oklch(0.708 0 0);--c4:oklch(0.8 0 0);--c5:oklch(0.9 0 0);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;word-break:keep-all}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.tnum{font-variant-numeric:tabular-nums}
.app{display:flex;min-height:100%}
/* ── 사이드바 ─────────────────────────────────────────── */
.sb{position:sticky;top:0;height:100vh;width:256px;flex:none;display:flex;flex-direction:column;border-right:1px solid var(--border-g);background:var(--sidebar);transition:width .2s}
.sb.col{width:64px}
.sb-logo{display:flex;align-items:center;gap:10px;padding:20px;border-bottom:1px solid var(--border-g);min-height:73px}
.sb-mark{width:32px;height:32px;flex:none;border-radius:8px;background:var(--primary);color:var(--primary-foreground);display:grid;place-items:center}
.sb-mark svg{width:18px;height:18px}
.sb-t h1{margin:0;font-size:14px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.sb-t p{margin:0;font-size:11px;color:var(--muted-foreground);white-space:nowrap}
.sb.col .sb-t,.sb.col .sb-lbl,.sb.col .sb-chev,.sb.col .sb-kids,.sb.col .sb-foot-t{display:none}
.sb-tog{position:absolute;top:24px;right:-12px;width:24px;height:24px;border-radius:50%;border:1px solid var(--border-g);background:var(--background);box-shadow:0 1px 2px rgba(0,0,0,.08);display:grid;place-items:center;z-index:5;color:var(--muted-foreground)}
.sb-tog svg{width:12px;height:12px;transition:transform .2s}.sb.col .sb-tog svg{transform:rotate(180deg)}
.sb-nav{flex:1;overflow-y:auto;padding:16px 12px}
.sb-g{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;border:0;border-radius:8px;background:transparent;font-size:14px;text-align:left}
.sb-g:hover{background:var(--muted)}
.sb-g.act{font-weight:600}
.sb-ic{width:16px;height:16px;flex:none;color:var(--muted-foreground)}
.sb-g.act .sb-ic{color:var(--foreground)}
.sb-lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-chev{width:14px;height:14px;flex:none;color:var(--muted-foreground);transition:transform .2s}
.sb-g[aria-expanded="true"] .sb-chev{transform:rotate(90deg)}
.sb-kids{margin:2px 0 4px 24px;padding-left:8px;border-left:1px solid var(--border-g);display:flex;flex-direction:column;gap:2px}
.sb-l{display:block;width:100%;padding:7px 10px;border:0;border-radius:8px;background:transparent;font-size:13px;text-align:left;text-decoration:none;color:var(--foreground)}
.sb-l:hover{background:var(--muted)}
.sb-l.act{background:var(--primary);color:var(--primary-foreground);font-weight:500}
.sb-l.sub{padding-left:18px;font-size:12.5px}
.sb-l.off,.sb-g.off{opacity:.38;cursor:not-allowed;background:transparent!important;filter:grayscale(1)}
.sb-l.off:hover,.sb-g.off:hover{background:transparent}
.sb-sec{margin:10px 12px 4px;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground)}
.sb-foot{border-top:1px solid var(--border-g);padding:8px 12px}
.sb-foot .sb-g{font-size:13px;padding:8px 12px}
.sb-user{display:flex;align-items:center;gap:10px;padding:8px 12px}
.sb-av{width:28px;height:28px;flex:none;border-radius:50%;background:linear-gradient(135deg,#f97316,#8b5cf6);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}
.sb-live{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--border-g);font-size:12px;color:var(--muted-foreground);white-space:nowrap}
.pulse{width:8px;height:8px;flex:none;border-radius:50%;background:#22c55e;animation:pulse 2s cubic-bezier(.4,0,.6,1) infinite}
@keyframes pulse{50%{opacity:.5}}
.mbar{display:none}
/* ── 메인 ─────────────────────────────────────────────── */
main{flex:1;min-width:0}
.wrap{margin:0 auto;width:100%;max-width:1920px;padding:32px 24px 80px}
.demo-pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;background:var(--surface2);color:var(--subtle);font-size:11px;font-weight:600}
.demo-pill i{width:6px;height:6px;border-radius:50%;background:var(--amber)}
/* 히어로 */
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.eyebrow{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);display:flex;align-items:center;gap:8px}
.h-title{margin:6px 0 0;font-size:28px;font-weight:700;letter-spacing:-.025em;line-height:1.2;cursor:text;border-radius:6px}
.h-title:hover,.h-desc:hover{background:var(--surface2)}
.h-desc{margin:6px 0 0;max-width:768px;font-size:13px;color:var(--subtle);cursor:text;border-radius:6px}
.h-edit{font:inherit;border:1px solid var(--accent);border-radius:6px;background:var(--surface);padding:0 6px;width:100%;max-width:768px}
.hero-r{display:flex;align-items:center;gap:8px}
/* 버튼 · 입력 */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border2);border-radius:8px;background:var(--surface);padding:6px 12px;font-size:12.5px;font-weight:500;transition:border-color .15s;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn svg{width:14px;height:14px}
.btn-p{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:8px;background:var(--accent);color:var(--bg);padding:8px 16px;font-size:13px;font-weight:600;white-space:nowrap}
.btn-p:hover{opacity:.9}
.inp{width:100%;border:1px solid var(--border2);border-radius:8px;background:var(--surface);padding:9px 12px;font-size:13px;outline:none}
.inp:focus{border-color:var(--accent)}
textarea.inp{resize:vertical;min-height:72px;line-height:1.6}
.fld{display:flex;flex-direction:column;gap:6px}
.fld>span{font-size:12px;font-weight:600;color:var(--subtle)}
.spin svg{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
/* 세그먼트 */
.seg{display:inline-flex;flex:none;align-items:center;gap:2px;border-radius:8px;background:var(--surface2);padding:2px}
.seg button{border:0;border-radius:6px;background:transparent;padding:4px 12px;font-size:12.5px;font-weight:500;color:var(--subtle);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.seg.lg button{padding:6px 16px;font-size:13.5px}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow),0 0 0 1px var(--ring)}
.seg .dt{width:8px;height:8px;border-radius:50%}
.seg small{font-weight:400;color:var(--faint);margin-left:2px}
/* 스티키 필터 바 */
.fbar{position:sticky;top:0;z-index:10;margin:24px -24px 0;padding:10px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;border-bottom:1px solid var(--border);background:color-mix(in oklab,var(--bg) 95%,transparent);backdrop-filter:blur(8px)}
.fbar .sp{flex:1}
.vsep{width:1px;height:20px;background:var(--border)}
/* 카드 */
.card{border-radius:12px;background:var(--surface);box-shadow:var(--shadow),0 0 0 1px var(--ring)}
.card2{border-radius:16px;background:var(--surface);box-shadow:var(--shadow),0 0 0 1px var(--ring)}
.gp{overflow:hidden}
.gp-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;border-bottom:1px solid var(--border);padding:8px 16px}
.gp-h b{font-size:13.5px;font-weight:700}
.gp-h span{font-size:11.5px;color:var(--faint)}
.g7{display:grid;grid-template-columns:1fr}
.g7>*{border-top:1px solid var(--border)}.g7>*:first-child{border-top:0}
@media(min-width:640px){.g7{grid-template-columns:1fr 1fr}.g7>*{border-top:0;border-left:1px solid var(--border)}.g7>*:nth-child(2n+1){border-left:0}.g7>*:nth-child(n+3){border-top:1px solid var(--border)}}
@media(min-width:1100px) and (max-width:1599px){.g7{grid-template-columns:1.5fr 1.1fr 1.35fr 1fr}.g7>*{border-top:0!important;border-left:1px solid var(--border)!important}.g7>*:nth-child(4n+1){border-left:0!important}.g7>*:nth-child(n+5){border-top:1px solid var(--border)!important}}
@media(min-width:1600px){.g7{grid-template-columns:1.5fr 1.1fr 1.35fr 1fr 1fr 1fr 1.15fr}.g7>*{border-top:0!important;border-left:1px solid var(--border)!important}.g7>*:first-child{border-left:0!important}}
/* BigKpi */
.bk{display:flex;flex-direction:column;cursor:pointer;min-width:0;container-type:inline-size}
.bk:hover{background:color-mix(in oklab,var(--surface2) 40%,transparent)}
.bk-h{height:36px;display:flex;align-items:center;justify-content:center;gap:7px;border-bottom:1px solid var(--border);background:color-mix(in oklab,var(--surface2) 70%,transparent);font-size:13.5px;font-weight:700;padding:0 8px;white-space:nowrap;overflow:hidden}
.tdot{width:7px;height:7px;border-radius:50%;flex:none}
.bk-parts{display:flex;justify-content:center;padding-top:10px}
.bk-part{display:flex;flex-direction:column;align-items:center;padding:0 12px;min-width:0}
.bk-part+.bk-part{border-left:1px solid var(--border)}
.bk-v{height:48px;display:flex;align-items:flex-end;font-size:min(32px,15cqi);font-weight:800;letter-spacing:-.035em;line-height:1;white-space:nowrap}
.bk-v.mid{font-size:min(20px,10cqi)}
.bk-v small{font-size:14px;font-weight:600;color:var(--subtle);margin-left:2px;letter-spacing:0}
.nclk{text-decoration:underline dotted var(--faint);text-underline-offset:7px;text-decoration-thickness:1.5px;cursor:pointer}
.bk-l{height:24px;margin-top:8px;display:flex;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:4px;background:var(--surface2);padding:2px 6px;font-size:11.5px;font-weight:700;color:var(--subtle);white-space:nowrap}
.bk-sub{margin-top:8px;min-height:17px;text-align:center;font-size:11.5px;color:var(--faint);padding:0 10px}
.bk-x{margin-top:10px;padding:0 10px 12px;width:100%}
/* DetailBox */
.db{width:100%;border:1px solid var(--border);border-radius:8px;background:color-mix(in oklab,var(--surface2) 60%,transparent);padding:6px 10px}
.db-h{display:flex;width:100%;justify-content:space-between;border:0;background:none;padding:0;font-size:10.5px;font-weight:600;letter-spacing:.03em;color:var(--faint)}
.db-rows{margin-top:4px}
.db-r{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:4px 0;border-top:1px solid var(--border)}
.db-r:first-child{border-top:0}
.db-r .l{display:flex;align-items:flex-start;gap:6px;font-size:11px;line-height:15px;min-width:0}
.db-r .l i{width:6px;height:6px;border-radius:50%;flex:none;margin-top:4.5px}
.db-r.strong .l i{border-radius:2px}
.db-r .l b{font-weight:700}
.db-r .v{display:flex;align-items:baseline;gap:5px;white-space:nowrap}
.db-r .v em{font-style:normal;font-size:10px;color:var(--faint)}
.db-r .v strong{font-size:12.5px;font-weight:800}
.db-r .v small{font-size:10.5px;color:var(--subtle)}
.db-r.strong .l{font-weight:700}
.db-r.clk{cursor:pointer}.db-r.clk:hover strong{text-decoration:underline dotted;text-underline-offset:3px}
.db-foot{padding-top:4px;font-size:10px;color:var(--faint)}
/* 4주 */
details.w4{margin-top:10px}
details.w4>summary{cursor:pointer;list-style:none;font-size:12.5px;font-weight:600;color:var(--subtle);display:inline-flex;align-items:center;gap:6px;padding:6px 0}
details.w4>summary::-webkit-details-marker{display:none}
details.w4>summary::before{content:"▸";transition:transform .2s}details.w4[open]>summary::before{transform:rotate(90deg)}
.w4c{padding:0 12px 12px}
.w4c .hd{height:32px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border-bottom:1px solid var(--border);margin:0 -12px 8px;background:color-mix(in oklab,var(--surface2) 60%,transparent)}
.mbars{height:36px;display:flex;align-items:flex-end;gap:4px;margin-bottom:8px}
.mbars i{flex:1;border-radius:3px 3px 0 0;background:var(--accent)}
.mbars i.cur{opacity:.35}
.w4r{display:flex;justify-content:space-between;gap:6px;padding:3px 0;font-size:11px;border-top:1px solid var(--border)}
.w4r span{color:var(--faint)}.w4r b{font-size:14.5px;font-weight:800}
.dlt{font-size:10.5px;font-weight:600}.dlt.up{color:var(--good)}.dlt.dn{color:var(--danger)}.dlt.eq{color:var(--faint)}
/* Metric / Kpi */
.kg{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.kpi{display:flex;min-height:84px;flex-direction:column;border-radius:12px;background:var(--surface);box-shadow:var(--shadow),0 0 0 1px var(--ring);padding:14px 16px;cursor:pointer}
.kpi:hover{box-shadow:var(--shadow),0 0 0 1px var(--border2)}
.kpi .kl{font-size:11.5px;font-weight:600;color:var(--subtle);display:flex;align-items:center;gap:6px}
.kpi .kv{margin-top:6px;font-size:21px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.kpi.big .kv{font-size:26px}.kpi.acc .kv{color:var(--accent)}.kpi.bad .kv{color:var(--danger)}
.kpi .ks{margin-top:auto;padding-top:6px;font-size:11px;color:var(--faint);display:flex;align-items:center;gap:6px}
.met{display:flex;min-height:96px;flex-direction:column;padding:10px 16px}
.met .kl{font-size:12px;font-weight:600;color:var(--subtle);display:flex;align-items:center;gap:6px}
.met .kv{margin-top:6px;font-size:28px;font-weight:800;letter-spacing:-.035em;line-height:1}
.met .ks{margin-top:auto;padding-top:6px;font-size:11px;color:var(--faint)}
.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.mg>*{border-left:1px solid var(--border);border-top:1px solid var(--border);margin:-1px 0 0 -1px}
/* 흐름 */
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px;padding:12px 16px}
.fnode{min-width:240px;flex:1;border-radius:8px;background:var(--surface2);padding:8px 12px}
.fnode .t{font-size:11.5px;font-weight:600;color:var(--subtle)}
.fnode .v{font-size:20px;font-weight:800;letter-spacing:-.03em;margin-top:2px}
.fnode .r{font-size:11px;color:var(--faint)}
.fnode .eq{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.fnode .eq span{border-radius:6px;background:var(--surface);box-shadow:0 0 0 1px var(--ring);padding:1px 6px;font-size:10.5px;color:var(--subtle)}
.fnode .eq b{font-size:11.5px;color:var(--text)}
.farr{display:grid;place-items:center;color:var(--faint);font-size:16px}
/* 섹션 */
.sec{margin-top:28px}
.sec-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.sec-h .code{border-radius:4px;background:var(--accent-soft);padding:2px 5px;font-size:9.5px;font-weight:800;letter-spacing:.04em;color:var(--accent);box-shadow:0 0 0 1px var(--ring)}
.sec-h h2{margin:0;font-size:14px;font-weight:600}
.sec-h .hint{font-size:11.5px;color:var(--faint)}
.sec-h .sp{flex:1}
.lbl{margin:28px 0 10px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
/* 차트 카드 */
.cc{padding:16px}
.cc-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-bottom:8px}
.cc-h b{font-size:13px;font-weight:600}
.cc-h .lg{display:flex;flex-wrap:wrap;gap:10px;margin-left:auto}
.cc-h .lg span{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--subtle)}
.cc-h .lg i{width:10px;height:10px;border-radius:3px}
.cc-n{font-size:11px;color:var(--faint);margin-bottom:6px}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.chart .ax{font-size:10.5px;fill:var(--faint)}
.chart .gl{stroke:var(--border);stroke-width:1}
.chart .vl{font-size:10px;fill:var(--subtle);font-weight:600}
