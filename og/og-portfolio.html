<!doctype html>
<!-- 공유 미리보기 이미지(og/portfolio.jpg) 원본 — 1200×630 다크 명함형. 헤드리스 Chrome으로 캡처해 만듦:
     "Google Chrome" --headless=new --hide-scrollbars --force-device-scale-factor=2 --window-size=1200,630 --screenshot=og.png og/og-portfolio.html
     → sips -Z 1200 -s format jpeg -s formatOptions 90 og.png --out og/portfolio.jpg -->
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css">
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:#1b1f27;color:#fff;font-family:"Wanted Sans Variable","Wanted Sans","Pretendard",sans-serif;letter-spacing:-.02em;-webkit-font-smoothing:antialiased}
  .card{position:relative;display:grid;grid-template-columns:1fr 300px;gap:72px;height:100%;padding:76px 88px 72px}
  .l{display:flex;flex-direction:column;min-width:0}
  .lb{font-size:19px;font-weight:500;letter-spacing:.32em;color:rgba(255,255,255,.5)}
  h1{margin-top:auto;white-space:nowrap;font-size:58px;font-weight:700;line-height:1.24;letter-spacing:-.04em}
  .ft{display:flex;align-items:center;justify-content:space-between;margin-top:44px}
  .nm{font-size:25px;font-weight:500;color:rgba(255,255,255,.72);letter-spacing:-.01em}
  .nm b{margin-right:12px;font-weight:600;color:#fff}
  .loc{display:flex;align-items:center;gap:12px;font-size:23px;font-weight:500;color:rgba(255,255,255,.72)}
  .loc i{width:13px;height:13px;border-radius:50%;background:#4fb37b}
  .ph{align-self:center;width:300px;height:372px;border-radius:30px;overflow:hidden;background:#2a2f38;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 34px 60px -30px rgba(0,0,0,.7)}
  .ph img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 20%}
</style>
</head>
<body>
  <div class="card">
    <div class="l">
      <p class="lb">MARKETING × AX · PORTFOLIO</p>
      <h1>마케팅의 문제를 AI와 코드로<br>푸는 그로스 빌더</h1>
      <div class="ft"><p class="nm"><b>김진수</b>Kim Jinsoo</p><p class="loc"><i></i>Seoul, KR</p></div>
    </div>
    <div class="ph"><img src="https://qmabsrqpzbqvledywxtl.supabase.co/storage/v1/object/public/media/12ca909a-d9ae-4796-89af-57467df61a48/1790341964038-10r14r.jpg" alt=""></div>
  </div>
</body>
</html>
