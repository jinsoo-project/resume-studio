<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>김진수 · Jinsoo Kim — 마케팅 × AI 프로덕트 빌더</title>
<meta name="description" content="퍼포먼스 마케터에서 AI 프로덕트 빌더로. 마케팅 도메인 지식과 AI 엔지니어링을 잇는 그로스 빌더 김진수의 이력서·포트폴리오." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --background: oklch(1 0 0); --foreground: oklch(0.145 0 0);
  --card: oklch(1 0 0); --card-foreground: oklch(0.145 0 0);
  --muted: oklch(0.97 0 0); --muted-foreground: oklch(0.556 0 0);
  --primary: oklch(0.205 0 0); --primary-foreground: oklch(0.985 0 0);
  --accent: oklch(0.97 0 0); --border: oklch(0.922 0 0); --ring: oklch(0.708 0 0);
  --radius: 0.625rem;
  --sidebar: 264px;
  --font: "Inter", ui-sans-serif, system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
:root[data-theme="dark"]{
  --background: oklch(0.145 0 0); --foreground: oklch(0.985 0 0);
  --card: oklch(0.205 0 0); --card-foreground: oklch(0.985 0 0);
  --muted: oklch(0.269 0 0); --muted-foreground: oklch(0.708 0 0);
  --primary: oklch(0.922 0 0); --primary-foreground: oklch(0.205 0 0);
  --accent: oklch(0.269 0 0); --border: oklch(1 0 0 / 12%); --ring: oklch(0.556 0 0);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font);
  line-height:1.6;-webkit-font-smoothing:antialiased;letter-spacing:-0.011em}
a{color:inherit;text-decoration:none}
h1,h2,h3{letter-spacing:-0.03em;line-height:1.15;margin:0}
.mono{font-variant-numeric:tabular-nums}
.muted{color:var(--muted-foreground)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-foreground)}

/* ===== layout ===== */
.app{display:grid;grid-template-columns:var(--sidebar) 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;border-right:1px solid var(--border);background:var(--card);
  display:flex;flex-direction:column;padding:24px 18px;gap:6px;overflow-y:auto}
main{min-width:0}
.mwrap{max-width:820px;margin:0 auto;padding:56px 40px 96px}

/* ===== sidebar ===== */
.me{display:flex;align-items:center;gap:11px;padding:6px 8px 16px}
.avatar{width:42px;height:42px;border-radius:12px;background:var(--primary);color:var(--primary-foreground);
  display:grid;place-items:center;font-weight:700;font-size:17px;flex-shrink:0}
.me .nm{font-weight:700;font-size:15px}
.me .rl{font-size:12px;color:var(--muted-foreground);margin-top:1px}
.navlabel{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-foreground);padding:14px 10px 6px}
.nav-i{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:14px;color:var(--muted-foreground);
  cursor:pointer;border:none;background:none;width:100%;text-align:left;font-family:inherit;transition:background .12s,color .12s}
.nav-i:hover{background:var(--muted);color:var(--foreground)}
.nav-i.active{background:var(--muted);color:var(--foreground);font-weight:600}
.nav-i svg{width:16px;height:16px;stroke:currentColor;flex-shrink:0}
.spacer{flex:1}
.side-foot{border-top:1px solid var(--border);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.exp-title{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-foreground);padding:2px 10px 4px}
.exp-i{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;font-size:13px;color:var(--muted-foreground);transition:.12s}
.exp-i:hover{background:var(--muted);color:var(--foreground)}
.exp-i svg{width:15px;height:15px;stroke:currentColor}
.foot-row{display:flex;gap:6px;align-items:center;padding:6px 6px 0}
.iconbtn{width:32px;height:32px;border:1px solid var(--border);border-radius:8px;background:var(--card);cursor:pointer;
  color:var(--foreground);display:grid;place-items:center}
.iconbtn svg{width:15px;height:15px;stroke:currentColor}

/* ===== mobile top bar ===== */
.topbar{display:none}
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  aside{display:none}
  .topbar{display:block;position:sticky;top:0;z-index:30;background:color-mix(in oklch,var(--card) 90%,transparent);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
  .topbar .r1{display:flex;align-items:center;gap:10px;padding:12px 16px}
  .topbar .nm{font-weight:700;font-size:15px}
  .topbar .rl{font-size:12px;color:var(--muted-foreground)}
  .topbar nav{display:flex;gap:4px;overflow-x:auto;padding:0 12px 10px}
  .topbar nav button{white-space:nowrap;padding:7px 12px;border-radius:999px;border:1px solid var(--border);
    background:var(--card);font-size:13px;color:var(--muted-foreground);font-family:inherit;cursor:pointer}
  .topbar nav button.active{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
  .mwrap,.mwrap.mwrap{padding:32px 20px 80px}
  .mwrap{max-width:none}
}

/* ===== panels ===== */
.panel{display:none;animation:fade .25s ease}
.panel.show{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.phead{margin-bottom:28px}
.phead h2{font-size:clamp(24px,3.5vw,32px);font-weight:750;margin-top:8px}
.phead p{color:var(--muted-foreground);margin:8px 0 0;font-size:15px;max-width:560px}

/* overview hero */
.hero h1{font-size:clamp(30px,5vw,46px);font-weight:800;margin-top:6px}
.hero .lead{font-size:clamp(16px,2vw,18px);color:var(--muted-foreground);max-width:600px;margin:18px 0 26px}
.hero .lead b{color:var(--foreground);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin:30px 0 8px;padding:26px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.stats .n{font-size:clamp(20px,3vw,28px);font-weight:700;letter-spacing:-.03em}
.stats .l{font-size:12px;color:var(--muted-foreground);margin-top:3px}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr);gap:22px}}
.cta{display:flex;gap:9px;flex-wrap:wrap;margin-top:26px}
.btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 15px;border-radius:8px;font-size:14px;
  font-weight:500;border:1px solid var(--border);background:var(--card);cursor:pointer;color:var(--foreground);transition:.15s;font-family:inherit}
.btn:hover{background:var(--muted)}
.btn.primary{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
.btn.primary:hover{opacity:.9}
.btn svg{width:15px;height:15px;stroke:currentColor}

/* cards grid */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.card{border:1px solid var(--border);border-radius:var(--radius);background:var(--card);padding:22px;transition:.18s}
.card:hover{border-color:var(--ring)}
.card .ic{width:36px;height:36px;border-radius:9px;background:var(--muted);display:grid;place-items:center;margin-bottom:14px}
.card .ic svg{width:18px;height:18px;stroke:var(--foreground)}
.card h3{font-size:15.5px;font-weight:650;margin-bottom:7px}
.card p{font-size:13.5px;color:var(--muted-foreground);margin:0}

/* timeline */
.tl .item{position:relative;padding:0 0 30px 26px;border-left:1px solid var(--border)}
.tl .item:last-child{padding-bottom:0}
.tl .item::before{content:"";position:absolute;left:-5px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--background);border:2px solid var(--foreground)}
.tl .top{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px}
.tl h3{font-size:17px;font-weight:650}
.tl .role{font-size:13px;color:var(--muted-foreground)}
.tl .date{margin-left:auto;font-size:12.5px;color:var(--muted-foreground)}
.tl .sm{font-size:13.5px;color:var(--muted-foreground);margin:8px 0 2px}
.tl ul{margin:8px 0 0;padding-left:18px}
.tl li{font-size:13.5px;color:var(--muted-foreground);margin-bottom:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-size:11.5px;color:var(--muted-foreground);background:var(--muted);border-radius:6px;padding:3px 9px}

/* projects */
.proj{border:1px solid var(--border);border-radius:var(--radius);background:var(--card);padding:24px;margin-bottom:14px;transition:.18s}
.proj:hover{border-color:var(--ring)}
.proj .head{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px}
.proj h3{font-size:19px;font-weight:700}
.proj .tag{font-size:11.5px;color:var(--muted-foreground);border:1px solid var(--border);border-radius:999px;padding:2px 9px}
.proj .meta{margin-left:auto;font-size:12.5px;color:var(--muted-foreground)}
.proj .rl{font-size:13px;color:var(--muted-foreground);margin-top:4px}
.proj .desc{font-size:14px;color:var(--muted-foreground);margin:12px 0 14px}
.kpis{display:flex;flex-wrap:wrap;gap:24px;padding:14px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:14px}
.kpis .n{font-size:20px;font-weight:700}
.kpis .l{font-size:11.5px;color:var(--muted-foreground)}

/* skills / edu */
.skgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.skgrid{grid-template-columns:1fr}}
.skblock h3{font-size:13.5px;font-weight:600;margin-bottom:11px}
.subhead{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-foreground);margin:34px 0 14px}
.line{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);font-size:14px}
.line .r{color:var(--muted-foreground);font-size:13px}
</style>
</head>
<body>
<div class="app">

  <!-- ===== SIDEBAR ===== -->
  <aside>
    <div class="me">
      <div class="avatar" id="sbInit">JK</div>
      <div><div class="nm" id="sbName">김진수</div><div class="rl" id="sbRole">Jinsoo Kim</div></div>
    </div>
    <div class="navlabel">Menu</div>
    <button class="nav-i active" data-tab="overview">
      <svg fill="none" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21v-7h6v7"/></svg> 소개</button>
    <button class="nav-i" data-tab="ax">
      <svg fill="none" stroke-width="2" viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M12 8V4M8 4h8M9 13v2m6-2v2"/></svg> AX 스토리</button>
    <button class="nav-i" data-tab="career">
      <svg fill="none" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg> 상세 이력</button>
    <button class="nav-i" data-tab="projects">
      <svg fill="none" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg> 프로젝트</button>
    <button class="nav-i" data-tab="skills">
      <svg fill="none" stroke-width="2" viewBox="0 0 24 24"><path d="m18 16 4-4-4-4M6 8l-4 4 4 4m8.5-12-5 16"/></svg> 스킬 · 학력</button>

    <div class="spacer"></div>
    <div class="side-foot">
      <div class="exp-title">이력서 내보내기</div>
      <a class="exp-i" href="wanted.html" target="_blank" rel="noopener">
        <svg fill="none" stroke-width="2" viewBox="0 0 24 24"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/></svg> 원티드형 이력서 ↗</a>
      <a class="exp-i" href="remember.html" target="_blank" rel="noopener">
        <svg fill="none" stroke-width="2" viewBox="0 0 24 24"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/></svg> 리멤버형 이력서 ↗</a>
      <div class="foot-row">
        <a class="iconbtn" id="mailBtn" title="이메일"><svg fill="none" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg></a>
        <a class="iconbtn" id="pdfBtn" title="이력서 PDF" download><svg fill="none" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/></svg></a>
        <button class="iconbtn" id="themeBtn" title="테마 전환"><svg fill="none" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg></button>
      </div>
    </div>
  </aside>

  <!-- ===== MAIN ===== -->
  <main>
    <div class="topbar">
      <div class="r1"><div class="avatar" style="width:34px;height:34px;border-radius:9px;font-size:14px" id="tbInit">JK</div>
        <div><div class="nm" id="tbName">김진수</div><div class="rl" id="tbRole">마케팅 × AI 프로덕트 빌더</div></div>
        <button class="iconbtn" id="themeBtn2" style="margin-left:auto" title="테마"><svg fill="none" stroke-width="2" viewBox="0 0 24 24" stroke="currentColor"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2"/></svg></button>
      </div>
      <nav id="mnav"></nav>
    </div>

    <div class="mwrap">
      <section class="panel show" id="p-overview"></section>
      <section class="panel" id="p-ax"></section>
      <section class="panel" id="p-career"></section>
      <section class="panel" id="p-projects"></section>
      <section class="panel" id="p-skills"></section>
    </div>
  </main>
</div>

<script src="resume.data.js"></script>
<script>
const R = window.RESUME, P = R.profile;
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const initials = (P.nameEn||P.nameKo).split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();

// header bits
document.getElementById('sbInit').textContent = initials;
document.getElementById('tbInit').textContent = initials;
document.getElementById('sbName').textContent = P.nameKo;
document.getElementById('tbName').textContent = P.nameKo;
document.getElementById('sbRole').textContent = P.nameEn;
document.getElementById('tbRole').textContent = P.title;
document.getElementById('mailBtn').href = 'mailto:'+P.email;
const pdf = (P.links.find(l=>/pdf/i.test(l.label))||{}).url || '#';
document.getElementById('pdfBtn').href = pdf;

/* ---------- OVERVIEW ---------- */
document.getElementById('p-overview').innerHTML = `
  <div class="hero">
    <div class="eyebrow">${esc(P.tagline)}</div>
    <h1>${esc(P.nameKo)} · <span class="muted" style="font-weight:700">${esc(P.nameEn)}</span></h1>
    <p class="lead">${esc(P.summary)}</p>
    <div class="cta">
      <button class="btn primary" data-goto="projects">프로젝트 보기
        <svg fill="none" stroke-width="2" viewBox="0 0 24 24"><path d="M5 12h14M13 5l7 7-7 7"/></svg></button>
      <button class="btn" data-goto="ax">AX 스토리</button>
      <a class="btn" href="${esc(pdf)}" download>이력서 PDF</a>
    </div>
    <div class="stats">
      ${R.highlights.map(h=>`<div><div class="n mono">${esc(h.n)}</div><div class="l">${esc(h.l)}</div></div>`).join('')}
    </div>
  </div>
  <div class="subhead">지금 하는 일</div>
  <div class="grid2">
    ${R.ax.slice(0,2).map(axCard).join('')}
  </div>`;

function axCard(a){return `<div class="card">
  <div class="ic"><svg fill="none" stroke-width="2" viewBox="0 0 24 24"><path d="m9 11 3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg></div>
  <h3>${esc(a.title)}</h3><p>${esc(a.desc)}</p></div>`;}

/* ---------- AX ---------- */
document.getElementById('p-ax').innerHTML = `
  <div class="phead"><div class="eyebrow">AI Transformation</div>
    <h2>마케터에서 AI 프로덕트 빌더로</h2>
    <p>도구를 쓰는 사람에서, 팀의 문제를 AI로 자동화하는 사람으로. 제 차별점은 여기에 있습니다.</p></div>
  <div class="grid2">${R.ax.map(axCard).join('')}</div>`;

/* ---------- CAREER ---------- */
document.getElementById('p-career').innerHTML = `
  <div class="phead"><div class="eyebrow">Experience</div><h2>상세 이력</h2>
    <p>퍼포먼스 마케팅 실무 ${esc(P.totalYears)} → 마케팅 엔지니어링으로 확장.</p></div>
  <div class="tl">${R.experiences.map(e=>`
    <div class="item">
      <div class="top"><h3>${esc(e.company)}</h3><span class="role">${esc(e.role)}</span><span class="date mono">${esc(e.period)}</span></div>
      ${e.summary?`<div class="sm">${esc(e.summary)}</div>`:''}
      <ul>${e.bullets.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>
      ${e.tags?`<div class="chips">${e.tags.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div>`:''}
    </div>`).join('')}</div>`;

/* ---------- PROJECTS ---------- */
document.getElementById('p-projects').innerHTML = `
  <div class="phead"><div class="eyebrow">Portfolio</div><h2>프로젝트</h2>
    <p>수치는 각 저장소 코드·git 히스토리 실측 기준.</p></div>
  ${R.projects.map(p=>`
    <div class="proj">
      <div class="head"><h3>${esc(p.name)}</h3><span class="tag">${esc(p.kind)}</span><span class="meta mono">${esc(p.period)}</span></div>
      <div class="rl">${esc(p.role)}</div>
      <div class="desc">${esc(p.desc)}</div>
      ${p.kpis&&p.kpis.length?`<div class="kpis">${p.kpis.map(k=>`<div><div class="n mono">${esc(k.n)}</div><div class="l">${esc(k.l)}</div></div>`).join('')}</div>`:''}
      <div class="chips">${p.stack.map(s=>`<span class="chip">${esc(s)}</span>`).join('')}</div>
    </div>`).join('')}`;

/* ---------- SKILLS + EDU + AWARDS ---------- */
document.getElementById('p-skills').innerHTML = `
  <div class="phead"><div class="eyebrow">Stack</div><h2>스킬 · 학력</h2>
    <p>마케팅 도메인과 엔지니어링을 잇는 교차 스택.</p></div>
  <div class="skgrid">${R.skills.map(s=>`
    <div class="card skblock"><h3>${esc(s.group)}</h3>
      <div class="chips">${s.items.map(i=>`<span class="chip">${esc(i)}</span>`).join('')}</div></div>`).join('')}</div>
  <div class="subhead">학력</div>
  ${R.education.map(e=>`<div class="line"><span>${esc(e.school)} · ${esc(e.degree)}</span><span class="r mono">${esc(e.period)}</span></div>`).join('')}
  <div class="subhead">수상 · 기타</div>
  ${R.awards.map(a=>`<div class="line"><span>${esc(a.title)}<span class="r"> · ${esc(a.org)}</span></span><span class="r mono">${esc(a.date)}</span></div>`).join('')}`;

/* ---------- TABS ---------- */
const tabs = ['overview','ax','career','projects','skills'];
const labels = {overview:'소개',ax:'AX',career:'상세 이력',projects:'프로젝트',skills:'스킬·학력'};
function activate(tab){
  tabs.forEach(t=>{
    document.getElementById('p-'+t).classList.toggle('show', t===tab);
  });
  document.querySelectorAll('.nav-i').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  document.querySelectorAll('#mnav button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  if(location.hash.slice(1)!==tab) history.replaceState(null,'','#'+tab);
  window.scrollTo({top:0,behavior:'instant'in window?'instant':'auto'});
}
document.querySelectorAll('.nav-i').forEach(b=>b.addEventListener('click',()=>activate(b.dataset.tab)));
document.addEventListener('click',e=>{const g=e.target.closest('[data-goto]');if(g)activate(g.dataset.goto);});

// mobile nav
document.getElementById('mnav').innerHTML = tabs.map(t=>`<button data-tab="${t}" class="${t==='overview'?'active':''}">${labels[t]}</button>`).join('');
document.querySelectorAll('#mnav button').forEach(b=>b.addEventListener('click',()=>activate(b.dataset.tab)));

// deep link
const h=location.hash.slice(1); if(tabs.includes(h)) activate(h);

/* ---------- THEME ---------- */
(function(){var root=document.documentElement;var saved=localStorage.getItem('theme');
if(saved)root.setAttribute('data-theme',saved);
else if(matchMedia('(prefers-color-scheme:dark)').matches)root.setAttribute('data-theme','dark');
function tg(){var n=root.getAttribute('data-theme')==='dark'?'light':'dark';root.setAttribute('data-theme',n);localStorage.setItem('theme',n);}
['themeBtn','themeBtn2'].forEach(id=>{var el=document.getElementById(id);if(el)el.addEventListener('click',tg);});})();
</script>
</body>
</html>
