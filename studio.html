<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Resume Studio — 이력서 빌더</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:oklch(0.985 0 0);--surface:oklch(1 0 0);--fg:oklch(0.145 0 0);--muted:oklch(0.556 0 0);
  --card:oklch(1 0 0);--panel:oklch(0.97 0 0);--border:oklch(0.922 0 0);--ring:oklch(0.708 0 0);
  --primary:oklch(0.205 0 0);--primary-fg:oklch(0.985 0 0);--acc:#3182F6;--acc-soft:#EAF2FE;--ok:#12B886;
  --radius:12px;--rail:220px;--font:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo",system-ui,Roboto,"Segoe UI","Malgun Gothic",sans-serif;
}
:root[data-theme="dark"]{
  --bg:oklch(0.145 0 0);--surface:oklch(0.185 0 0);--fg:oklch(0.985 0 0);--muted:oklch(0.708 0 0);
  --card:oklch(0.205 0 0);--panel:oklch(0.235 0 0);--border:oklch(1 0 0 / 12%);--ring:oklch(0.556 0 0);
  --primary:oklch(0.922 0 0);--primary-fg:oklch(0.205 0 0);--acc:#4593FC;--acc-soft:rgba(69,147,252,.14);--ok:#4ADE80;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.55;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
a{color:inherit}
.mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,Menlo,Consolas,monospace}
button{font-family:inherit}
input,textarea,select{font-family:inherit}

.app{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100vh}
/* rail */
aside{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--border);padding:18px 12px;display:flex;flex-direction:column;gap:3px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:9px;padding:4px 8px 16px;font-weight:700;font-size:14px}
.brand .lg{width:26px;height:26px;border-radius:7px;background:var(--primary);color:var(--primary-fg);display:grid;place-items:center;font-size:12px;font-weight:700}
.nv{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:8px;font-size:13.5px;color:var(--muted);border:none;background:none;width:100%;text-align:left;cursor:pointer}
.nv:hover{background:var(--panel);color:var(--fg)}
.nv.on{background:var(--panel);color:var(--fg);font-weight:600}
.nv svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.rail-sp{flex:1}
.railfoot{border-top:1px solid var(--border);padding-top:10px;font-size:11px;color:var(--muted)}
.railfoot .row{display:flex;gap:6px;margin-top:8px}
.mini{flex:1;font-size:11px;border:1px solid var(--border);background:var(--card);color:var(--muted);border-radius:7px;padding:7px;cursor:pointer;text-align:center}
.mini:hover{color:var(--fg)}

main{min-width:0}
.mtop{position:sticky;top:0;z-index:5;background:color-mix(in oklch,var(--bg) 86%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:14px 26px;display:flex;align-items:center;gap:12px}
.mtop h1{font-size:17px;font-weight:700;margin:0}
.mtop .sp{flex:1}
.mwrap{padding:24px 26px 80px;max-width:1160px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:8px;font-size:13.5px;font-weight:500;border:1px solid var(--border);background:var(--card);cursor:pointer;color:var(--fg)}
.btn:hover{background:var(--panel)}
.btn.p{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.btn.a{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.icon{width:32px;height:32px;padding:0;justify-content:center}

/* cards / docs */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.doc{border:1px solid var(--border);border-radius:12px;background:var(--card);padding:16px 17px}
.doc .tt{font-size:15px;font-weight:650}
.doc .badge{display:inline-block;font-size:11px;color:var(--acc);background:var(--acc-soft);border-radius:6px;padding:2px 8px;margin-top:7px}
.doc .meta{font-size:11.5px;color:var(--muted);margin-top:8px}
.doc .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px}
.newcard{border:1.5px dashed var(--border);border-radius:12px;display:grid;place-items:center;min-height:130px;color:var(--muted);cursor:pointer;font-size:13.5px}
.newcard:hover{border-color:var(--acc);color:var(--acc)}

/* library forms */
.sec{margin-bottom:26px}
.sec > h2{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;display:flex;align-items:center;gap:8px}
.sec > h2 .add{margin-left:auto;font-size:12px;color:var(--acc);cursor:pointer;letter-spacing:0;text-transform:none;font-weight:500}
.blockcard{border:1px solid var(--border);border-radius:11px;background:var(--card);padding:15px;margin-bottom:11px}
.blockcard .bh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.blockcard .bh .t{font-weight:600;font-size:13px;color:var(--muted)}
.blockcard .bh .rm{margin-left:auto;color:var(--muted);cursor:pointer;font-size:12px;border:1px solid var(--border);border-radius:6px;padding:3px 8px}
.blockcard .bh .rm:hover{color:#dc2626;border-color:#dc2626}
.f{margin-bottom:10px}
.f:last-child{margin-bottom:0}
.f label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
.f input,.f textarea,.f select{width:100%;border:1px solid var(--border);background:var(--surface);color:var(--fg);border-radius:9px;padding:10px 12px;font-size:14px;transition:border-color .12s}
.f input:focus,.f textarea:focus{outline:none;border-color:var(--acc)}
.f textarea{resize:vertical;line-height:1.5}
.f .hint{font-size:10.5px;color:var(--muted);margin-top:3px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:620px){.frow,.frow3{grid-template-columns:1fr}}
.worksec{margin-top:12px;border-top:1px solid var(--border);padding-top:10px}
.workhd{font-size:12px;font-weight:700;color:var(--muted);display:flex;align-items:center;margin-bottom:8px}
.workhd .add{margin-left:auto}
.workcard{border:1px solid var(--border);border-radius:9px;background:var(--panel);padding:12px;margin-bottom:8px}
.featlbl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:6px;cursor:pointer}
/* library 2-pane + segmented toggle */
.seg{display:inline-flex;background:var(--panel);border-radius:10px;padding:3px;gap:2px}
.segbtn{border:none;background:none;color:var(--muted);font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:8px;cursor:pointer;font-family:inherit}
.segbtn.on{background:var(--surface);color:var(--acc);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.libsplit{display:grid;grid-template-columns:1.7fr minmax(300px,34%);height:calc(100vh - 58px)}
.libform{overflow-y:auto;padding:24px 30px 100px}
.libform .sec{max-width:920px}
.skillgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:1200px){.skillgrid{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11.5px;color:var(--muted);background:var(--panel);border-radius:7px;padding:4px 9px}
/* DB viewer */
.dbcard{border:1px solid var(--border);border-radius:12px;background:var(--card);padding:16px 18px;margin-bottom:14px}
.dbhd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dbname{font-weight:700;font-size:15px;font-family:ui-monospace,Menlo,monospace}
.dbrel{font-size:11px;color:var(--acc);background:var(--acc-soft);border-radius:6px;padding:2px 8px}
.dbcount{font-size:11.5px;color:var(--muted);margin-left:auto}
.dbcols{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.dbcol{font-size:11px;font-family:ui-monospace,Menlo,monospace;color:var(--muted);background:var(--panel);border-radius:6px;padding:3px 8px}
.dbtable{overflow-x:auto;border:1px solid var(--border);border-radius:9px}
.dbtable table{border-collapse:collapse;width:100%;font-size:12px}
.dbtable th{text-align:left;background:var(--panel);color:var(--muted);font-weight:600;padding:7px 10px;white-space:nowrap;font-family:ui-monospace,Menlo,monospace;font-size:11px;border-bottom:1px solid var(--border)}
.dbtable td{padding:7px 10px;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid var(--border);color:var(--fg)}
.dbtable tr:last-child td{border-bottom:none}
.dbrel.grpc{color:var(--ok);background:color-mix(in oklch,var(--ok) 14%,transparent)}
.libpv{background:var(--panel);border-left:1px solid var(--border);padding:16px}
#libPreview{width:100%;height:100%;border:1px solid var(--border);border-radius:12px;background:#fff}
/* company accordion */
.cocard{border:1px solid var(--border);border-radius:12px;background:var(--card);margin-bottom:10px;overflow:hidden}
.cohd{display:flex;align-items:center;gap:11px;padding:13px 14px;cursor:pointer;user-select:none}
.cohd:hover{background:var(--panel)}
.cohd .chev{color:var(--muted);font-size:11px;transition:transform .15s;flex-shrink:0}
.cocard.open .cohd .chev{transform:rotate(90deg)}
.cohd .coinfo{flex:1;min-width:0}
.cohd .coname{font-weight:700;font-size:14.5px}
.cohd .cometa{font-size:11.5px;color:var(--muted);margin-top:2px}
.cohd .rm{color:var(--muted);cursor:pointer;font-size:11.5px;border:1px solid var(--border);border-radius:7px;padding:4px 9px;flex-shrink:0}
.cohd .rm:hover{color:#dc2626;border-color:#dc2626}
.cobody{display:none;padding:4px 14px 16px;border-top:1px solid var(--border)}
.cocard.open .cobody{display:block}
@media(max-width:900px){.libsplit{grid-template-columns:1fr;height:auto}.libpv{border-left:none;border-top:1px solid var(--border)}#libPreview{height:70vh}}

/* builder */
.buildwrap{display:grid;grid-template-columns:380px 1fr;gap:0;height:calc(100vh - 58px)}
.bcol{overflow-y:auto;padding:20px 22px}
.bcol.left{border-right:1px solid var(--border)}
.bcol.right{background:var(--panel);padding:18px}
.blabel{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:20px 0 10px}
.blabel:first-child{margin-top:0}
.tplrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tpl{border:1px solid var(--border);border-radius:9px;padding:10px;cursor:pointer;background:var(--card);text-align:center}
.tpl .t{font-size:12.5px;font-weight:650}.tpl .d{font-size:10.5px;color:var(--muted)}
.tpl.sel{border-color:var(--acc);background:var(--acc-soft);color:var(--acc)}
.tgl{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--border);border-radius:9px;background:var(--card);margin-bottom:6px;font-size:13px}
.tgl .grip{color:var(--muted);cursor:grab;font-size:11px;letter-spacing:-2px;user-select:none}
.tgl .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tgl .mv{color:var(--muted);cursor:pointer;font-size:12px;padding:0 3px}
.tgl .mv:hover{color:var(--fg)}
.sw{width:34px;height:20px;border-radius:999px;background:var(--acc);position:relative;cursor:pointer;flex-shrink:0;border:none}
.sw::after{content:"";position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.sw.off{background:#c7cbd1}
.sw.off::after{right:auto;left:2px}
:root[data-theme="dark"] .sw.off{background:#3a3d42}
.previewframe{width:100%;height:100%;border:1px solid var(--border);border-radius:10px;background:#fff;display:block}
.pubbox{border:1px solid var(--border);border-radius:10px;background:var(--card);padding:13px;margin-top:14px}
.urlline{display:flex;align-items:center;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-top:8px;font-size:11.5px}
.urlline input{flex:1;border:none;background:var(--surface);color:var(--fg);padding:8px 9px;font-family:ui-monospace,Menlo,monospace;min-width:0}
.hidden{display:none!important}
.empty{color:var(--muted);font-size:14px;padding:40px 0;text-align:center}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--primary);color:var(--primary-fg);padding:10px 18px;border-radius:9px;font-size:13px;z-index:50;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
.modalbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;place-items:center;padding:20px}
.modalcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px;width:340px;max-width:100%}
.modalcard input{width:100%;border:1px solid var(--border);background:var(--bg);color:var(--fg);border-radius:8px;padding:10px;font-size:14px;margin-bottom:8px}
@media(max-width:860px){.app{grid-template-columns:1fr}aside{display:none}.buildwrap{grid-template-columns:1fr;height:auto}.bcol.left{border-right:none;border-bottom:1px solid var(--border)}.previewframe{height:70vh}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><span class="lg">JK</span> Resume Studio</div>
    <button class="nv on" data-view="home"><svg viewBox="0 0 24 24"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></svg> 내보낸 이력서</button>
    <button class="nv" data-view="library"><svg viewBox="0 0 24 24"><path d="M4 5h11a2 2 0 0 1 2 2v13M4 5v13a2 2 0 0 0 2 2h11M4 5a2 2 0 0 1 2-2h9"/></svg> 콘텐츠 라이브러리</button>
    <button class="nv" data-view="builder"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 17h7M17.5 14v7"/></svg> 이력서 내보내기</button>
    <button class="nv" data-view="portfolio"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg> 포트폴리오</button>
    <button class="nv" data-view="db"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg> 데이터 (DB)</button>
    <div class="rail-sp"></div>
    <div class="railfoot">
      <div id="authBox" style="margin-bottom:10px"></div>
      정적 빌더 · 클라우드 동기화
      <div class="row">
        <button class="mini" id="exportBtn">내보내기(JSON)</button>
        <button class="mini" id="importBtn">가져오기</button>
        <button class="mini icon" id="themeBtn" title="테마" style="flex:0 0 auto;width:32px">◐</button>
      </div>
    </div>
  </aside>

  <main>
    <!-- HOME -->
    <section id="v-home">
      <div class="mtop"><h1>내보낸 이력서</h1><div class="sp"></div><button class="btn p" id="newDocTop">+ 새 이력서</button></div>
      <div class="mwrap"><div class="grid" id="docGrid"></div></div>
    </section>

    <!-- LIBRARY -->
    <section id="v-library" class="hidden">
      <div class="mtop">
        <h1>콘텐츠 라이브러리</h1><div class="sp"></div>
        <span class="mono" style="font-size:12px;color:var(--muted);margin-right:12px" id="libSaved">저장됨</span>
        <div class="seg">
          <button data-libtpl="wanted" class="segbtn on">원티드로 보기</button>
          <button data-libtpl="remember" class="segbtn">리멤버로 보기</button>
          <button data-libtpl="web" class="segbtn">웹</button>
        </div>
      </div>
      <div class="libsplit">
        <div class="libform" id="libBody"></div>
        <div class="libpv"><iframe class="previewframe" id="libPreview" title="이력서 미리보기"></iframe></div>
      </div>
    </section>

    <!-- BUILDER -->
    <section id="v-builder" class="hidden">
      <div class="mtop">
        <h1 id="bTitle">빌더</h1><div class="sp"></div>
        <button class="btn sm" id="bViewOpen">새 탭에서 열기</button>
        <button class="btn a sm" id="bPublish">🚀 발행 / 링크복사</button>
      </div>
      <div id="bEmpty" class="empty hidden">문서를 선택하거나 <b>새 이력서</b>를 만들어 주세요.</div>
      <div class="buildwrap" id="bWrap">
        <div class="bcol left" id="bLeft"></div>
        <div class="bcol right"><iframe class="previewframe" id="preview" title="미리보기"></iframe></div>
      </div>
    </section>

    <!-- PORTFOLIO -->
    <section id="v-portfolio" class="hidden">
      <div class="mtop">
        <h1 id="pfTitle">포트폴리오</h1><div class="sp"></div>
        <button class="btn sm" id="pfBackList" style="display:none">← 목록</button>
        <button class="btn sm" id="pfViewOpen" style="display:none">새 탭</button>
        <button class="btn a sm" id="pfPublish" style="display:none">🚀 발행 / 링크복사</button>
        <button class="btn p" id="pfNew">+ 새 포트폴리오</button>
      </div>
      <div class="mwrap" id="pfList"></div>
      <div class="buildwrap hidden" id="pfWrap">
        <div class="bcol left" id="pfLeft"></div>
        <div class="bcol right"><iframe class="previewframe" id="pfPreview" title="포트폴리오 미리보기"></iframe></div>
      </div>
    </section>

    <!-- DB VIEWER -->
    <section id="v-db" class="hidden">
      <div class="mtop"><h1>데이터 (DB 테이블)</h1><div class="sp"></div>
        <span class="mono" style="font-size:12px;color:var(--muted);margin-right:10px" id="dbWho"></span>
        <button class="btn sm" id="dbRefresh">↻ 새로고침</button>
      </div>
      <div class="mwrap" id="dbBody"></div>
    </section>
  </main>
</div>
<div class="toast" id="toast"></div>

<div class="modalbg" id="authModal">
  <div class="modalcard">
    <h3 style="margin:0 0 4px;font-size:16px">클라우드 로그인</h3>
    <p style="margin:0 0 14px;font-size:12px;color:var(--muted)">로그인하면 클라우드에 저장되고, 어느 기기에서나 이어서 편집·발행할 수 있어요.</p>
    <input id="authEmail" type="email" placeholder="이메일" autocomplete="username">
    <input id="authPw" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="current-password">
    <div id="authErr" style="font-size:12px;color:#dc2626;min-height:16px;margin:6px 0"></div>
    <div style="display:flex;gap:8px">
      <button class="btn a" id="authLogin" style="flex:1">로그인</button>
      <button class="btn" id="authSignup" style="flex:1">가입</button>
    </div>
    <button class="btn" id="authClose" style="width:100%;margin-top:8px">닫기</button>
  </div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="cloud.js"></script>
<script src="resume.data.js"></script>
<script src="templates.js"></script>
<script>
/* ============ storage & state ============ */
const LS_LIB='rs_lib_v1', LS_DOCS='rs_docs_v1';
const $=s=>document.querySelector(s);
const uid=()=> (window.crypto&&crypto.randomUUID) ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&0x3|0x8)).toString(16);});
const isUuid=s=>/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(s||'');
function normalizeIds(){
  (LIB.companies||[]).forEach(c=>{ if(!isUuid(c.id))c.id=uid(); (c.works||[]).forEach(w=>{ if(!isUuid(w.id))w.id=uid(); (w.media||[]).forEach(m=>{ if(!isUuid(m.id))m.id=uid(); }); }); });

  (DOCS||[]).forEach(d=>{ if(!isUuid(d.id))d.id=uid(); });
}

/* ============ doc config ============ */
function newDoc(){
  const d={id:uid(),title:'새 이력서',template:'wanted',slug:'resume-'+uid(),visibility:'unlisted',
    summaryOn:true,axOn:true,highlightsOn:true,skillsOn:true,educationOn:true,awardsOn:true,
    lists:{experiences:LIB.experiences.map((_,i)=>({i,on:true})),projects:LIB.projects.map((_,i)=>({i,on:true}))},
    updated:Date.now()};
  DOCS.unshift(d); save(); return d;
}
function reconcile(d){ // keep lists in sync with LIB length
  ['experiences','projects'].forEach(k=>{
    const have=new Set(d.lists[k].map(x=>x.i));
    d.lists[k]=d.lists[k].filter(x=>x.i<LIB[k].length);
    LIB[k].forEach((_,i)=>{if(!have.has(i))d.lists[k].push({i,on:true});});
  });
  return d;
}
function resolve(d){
  reconcile(d);
  return {
    template:d.template,title:d.title,slug:d.slug,visibility:d.visibility,
    profile:LIB.profile, summaryOn:d.summaryOn,
    highlights:d.highlightsOn?LIB.highlights:[],
    ax:d.axOn?LIB.ax:[],
    experiences:d.lists.experiences.filter(x=>x.on).map(x=>LIB.experiences[x.i]).filter(Boolean),
    projects:d.lists.projects.filter(x=>x.on).map(x=>LIB.projects[x.i]).filter(Boolean),
    skills:d.skillsOn?LIB.skills:[],
    education:d.educationOn?LIB.education:[],
    awards:d.awardsOn?LIB.awards:[],
    roleTags:LIB.roleTags
  };
}

/* ============ encode / URL ============ */
function encodeDoc(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function viewURL(d){
  const base=location.href.replace(/studio\.html.*$/,'').replace(/[^/]*$/,'');
  // 로그인 상태면 클라우드 slug URL(짧고 공유용), 아니면 자체완결 hash URL(오프라인)
  if(window.CLOUD&&CLOUD.enabled()&&CLOUD.user()){
    if(location.protocol==='http:'||location.protocol==='https:') return base+(d.kind==='portfolio'?'p/':'r/')+encodeURIComponent(d.slug);
    return base+'view.html?slug='+encodeURIComponent(d.slug);
  }
  return base+'view.html#'+encodeDoc(resolveAny(d));
}
function resolveAny(d){ return d.kind==='portfolio' ? resolvePF(d) : resolve(d); }

function show(view){
  ['home','library','builder','portfolio','db'].forEach(v=>$('#v-'+v).classList.toggle('hidden',v!==view));
  document.querySelectorAll('.nv').forEach(b=>b.classList.toggle('on',b.dataset.view===view));
  if(view==='home')renderHome();
  if(view==='library'){renderLibrary();updateLibPreview();}
  if(view==='builder')renderBuilder();
  if(view==='portfolio')renderPortfolioView();
  if(view==='db')renderDbView();
}
const DB_TABLES=[
  {name:'profile', rel:'1행/유저', cols:['name_ko','name_en','title','summary','email','phone','links','role_tags','ax','highlights']},
  {name:'companies', rel:'회사 → works', grp:1, cols:['id','name','role','period','summary','logo_url','sort']},
  {name:'works', rel:'작업 → media', grp:1, cols:['id','company_id','title','category','period','summary','detail','featured','icon','cover_url','metrics','stack','links','sort']},
  {name:'media', rel:'image/video/file', grp:1, cols:['id','work_id','type','url','title','sort']},
  {name:'skills', cols:['id','group_name','items','sort']},
  {name:'education', cols:['id','school','degree','period','sort']},
  {name:'awards', cols:['id','title','org','date_text','sort']},
  {name:'resume_docs', rel:'이력서 발행', cols:['id','slug','title','template','visibility','updated_at']},
  {name:'portfolio_pages', rel:'포트폴리오 발행', cols:['id','slug','title','subtitle','visibility']},
  {name:'portfolio_blocks', rel:'페이지 블록', cols:['id','page_id','type','content','sort']}
];
function dbCell(v){ if(v==null)return ''; if(typeof v==='object')return JSON.stringify(v).slice(0,80); return String(v).slice(0,80); }
function dbCard(t,rows,err){
  const cols=t.cols.map(c=>`<span class="dbcol">${c}</span>`).join('');
  let count='', tbl='';
  if(err){ tbl=`<div style="color:#dc2626;font-size:12px">${esc(err)}</div>`; }
  else if(rows===null){ tbl=`<div class="muted" style="font-size:12px">로그인하면 실제 행 표시</div>`; }
  else {
    count=`<span class="dbcount">${rows.length} rows</span>`;
    if(rows.length){
      tbl=`<div class="dbtable"><table><thead><tr>${t.cols.map(k=>`<th>${k}</th>`).join('')}</tr></thead><tbody>`+
        rows.slice(0,25).map(r=>`<tr>${t.cols.map(k=>`<td title="${esc(dbCell(r[k]))}">${esc(dbCell(r[k]))}</td>`).join('')}</tr>`).join('')+
        `</tbody></table></div>`;
    } else { tbl=`<div class="muted" style="font-size:12px">(비어있음)</div>`; }
  }
  return `<div class="dbcard"><div class="dbhd"><span class="dbname">${t.name}</span>${t.rel?`<span class="dbrel${t.grp?' grpc':''}">${esc(t.rel)}</span>`:''}${count}</div><div class="dbcols">${cols}</div>${tbl}</div>`;
}
async function renderDbView(){
  const body=$('#dbBody'), who=$('#dbWho');
  const logged=window.CLOUD&&CLOUD.enabled()&&CLOUD.user();
  who.textContent = logged ? ('☁️ '+CLOUD.user().email) : '오프라인 (로그인 필요)';
  body.innerHTML = logged ? '' : '<div class="empty" style="padding:14px;margin-bottom:12px">로그인하면 실제 행 데이터가 표시됩니다. 아래는 테이블 구조.</div>';
  for(const t of DB_TABLES){
    let rows=null,err=null;
    if(logged){ const r=await CLOUD.tableRows(t.name,100); if(r&&r.error)err=r.error; else rows=r||[]; }
    body.insertAdjacentHTML('beforeend', dbCard(t,rows,err));
  }
}

$('#docGrid').addEventListener('click',e=>{
  if(e.target.id==='newCard'){const d=newDoc();openBuilder(d.id);return;}
  const card=e.target.closest('.doc'); if(!card)return;
  const d=DOCS.find(x=>x.id===card.dataset.id); const act=e.target.dataset.act; if(!d||!act)return;
  if(act==='edit')openBuilder(d.id);
  else if(act==='link'){navigator.clipboard.writeText(viewURL(d)).then(()=>toast('공개 링크 복사됨'));}
  else if(act==='pdf'){window.open(viewURL(d),'_blank');toast('열린 창에서 PDF로 저장을 누르세요');}
  else if(act==='del'){if(confirm('삭제할까요?')){DOCS=DOCS.filter(x=>x.id!==d.id);save();renderHome();}}
});

function rowTgl(list,pos,on,name){
  return `<div class="tgl" data-list="${list}" data-pos="${pos}">
    <span class="grip">⋮⋮</span>
    <span class="mv" data-mv="up">▲</span><span class="mv" data-mv="dn">▼</span>
    <span class="nm">${esc(name)}</span>
    <button class="sw ${on?'':'off'}" data-toggle="1"></button></div>`;
}
function curDoc(){return DOCS.find(x=>x.id===curDocId);}
function touch(){const d=curDoc();if(d){d.updated=Date.now();save();}}
let pvTimer=null;
function updatePreview(){
  const d=curDoc(); if(!d)return;
  $('#bURL').value=viewURL(d);
  clearTimeout(pvTimer);
  pvTimer=setTimeout(()=>{$('#preview').setAttribute('srcdoc',TEMPLATES.render(resolve(d)));},180);

// builder interactions (delegated)
$('#bLeft').addEventListener('click',e=>{
  const d=curDoc(); if(!d)return;
  const tpl=e.target.closest('[data-tpl]'); if(tpl){d.template=tpl.dataset.tpl;touch();renderBuilder();return;}
  const flag=e.target.closest('[data-flag]'); if(flag){d[flag.dataset.flag]=!d[flag.dataset.flag];flag.classList.toggle('off');touch();updatePreview();return;}
  const row=e.target.closest('[data-list]');
  if(row){
    const list=row.dataset.list, pos=+row.dataset.pos, arr=d.lists[list];
    if(e.target.dataset.toggle){arr[pos].on=!arr[pos].on;e.target.classList.toggle('off');touch();updatePreview();return;}
    const mv=e.target.dataset.mv;
    if(mv==='up'&&pos>0){[arr[pos-1],arr[pos]]=[arr[pos],arr[pos-1]];touch();renderBuilder();}
    if(mv==='dn'&&pos<arr.length-1){[arr[pos+1],arr[pos]]=[arr[pos],arr[pos+1]];touch();renderBuilder();}
    return;
  }
  if(e.target.id==='bCopy'){navigator.clipboard.writeText($('#bURL').value).then(()=>toast('링크 복사됨'));}
});
$('#bLeft').addEventListener('input',e=>{
  const d=curDoc(); if(!d)return;
  if(e.target.id==='bDocTitle'){d.title=e.target.value;$('#bTitle').textContent=d.title;touch();}
  if(e.target.id==='bSlug'){d.slug=e.target.value.replace(/[^a-zA-Z0-9-_가-힣]/g,'-');e.target.value=d.slug;touch();updatePreview();}
});
$('#bLeft').addEventListener('change',e=>{
  const d=curDoc(); if(!d)return;
  if(e.target.id==='bVis'){d.visibility=e.target.value;touch();}
});
$('#bPublish').addEventListener('click',async()=>{
  const d=curDoc();if(!d)return;

/* ============ PORTFOLIO ============ */
let curPfId=null, pfPvTimer=null;
function curPf(){return DOCS.find(x=>x.id===curPfId&&x.kind==='portfolio');}
function flatWorks(){const a=[];(LIB.companies||[]).forEach((c,ci)=>(c.works||[]).forEach((w,wi)=>a.push({ci,wi})));return a;}
function reconcilePF(d){
  if(!d.works)d.works=[];
  const key=x=>x.ci+':'+x.wi, have=new Set(d.works.map(key));
  d.works=d.works.filter(x=>LIB.companies[x.ci]&&LIB.companies[x.ci].works[x.wi]);
  flatWorks().forEach(x=>{if(!have.has(key(x)))d.works.push({ci:x.ci,wi:x.wi,on:false});});
  return d;
}
function resolvePF(d){
  reconcilePF(d);
  const works=[];
  d.works.forEach(x=>{ if(x.on){ const c=LIB.companies[x.ci], w=c&&c.works[x.wi]; if(w) works.push(Object.assign({company:c.name},w)); }});
  return { template:'portfolio', title:d.title, subtitle:d.subtitle, intro:d.intro, cover:d.cover, slug:d.slug, visibility:d.visibility, profile:LIB.profile, works };
}
function newPortfolio(){
  const d={id:uid(),kind:'portfolio',template:'portfolio',title:'새 포트폴리오',subtitle:'',intro:'',cover:'',slug:'pf-'+uid(),visibility:'unlisted',works:[],updated:Date.now()};
  reconcilePF(d); d.works.forEach(x=>{const w=LIB.companies[x.ci].works[x.wi]; x.on=!!w.featured;});
  DOCS.unshift(d); save(); return d;
}
function pfTouch(){const d=curPf();if(d){d.updated=Date.now();save();}}
function updatePfPreview(){const d=curPf();if(!d)return;$('#pfURL').value=viewURL(d);clearTimeout(pfPvTimer);pfPvTimer=setTimeout(()=>{$('#pfPreview').setAttribute('srcdoc',TEMPLATES.render(resolvePF(d)));},180);}

  updatePfPreview();
}
$('#pfNew').addEventListener('click',()=>{const d=newPortfolio();curPfId=d.id;renderPortfolioView();});
$('#pfBackList').addEventListener('click',()=>{curPfId=null;renderPortfolioView();});
$('#pfViewOpen').addEventListener('click',()=>{const d=curPf();if(d)window.open(viewURL(d),'_blank');});
$('#pfPublish').addEventListener('click',async()=>{const d=curPf();if(!d)return;
  if(window.CLOUD&&CLOUD.user()){try{normalizeIds();await CLOUD.pushAll(LIB,DOCS,resolveAny);}catch(e){toast('발행 오류: '+(e.message||e));return;}}
  navigator.clipboard.writeText(viewURL(d)).then(()=>toast('발행됨 · 포트폴리오 링크 복사'));});
$('#pfList').addEventListener('click',e=>{
  if(e.target.id==='pfNewCard'){const d=newPortfolio();curPfId=d.id;renderPortfolioView();return;}
  const card=e.target.closest('.doc'); if(!card)return;
  const d=DOCS.find(x=>x.id===card.dataset.pfid); const act=e.target.dataset.pfact; if(!d||!act)return;
  if(act==='edit'){curPfId=d.id;renderPortfolioView();}
  else if(act==='link'){navigator.clipboard.writeText(viewURL(d)).then(()=>toast('포트폴리오 링크 복사됨'));}
  else if(act==='open'){window.open(viewURL(d),'_blank');}
  else if(act==='del'){if(confirm('삭제할까요?')){DOCS=DOCS.filter(x=>x.id!==d.id);save();renderPortfolioView();}}
});
$('#pfLeft').addEventListener('click',e=>{
  const d=curPf(); if(!d)return;
  const row=e.target.closest('[data-pfpos]');
  if(row){const pos=+row.dataset.pfpos;
    if(e.target.dataset.pftoggle){d.works[pos].on=!d.works[pos].on;e.target.classList.toggle('off');pfTouch();updatePfPreview();return;}
    const mv=e.target.dataset.pfmv;
    if(mv==='up'&&pos>0){[d.works[pos-1],d.works[pos]]=[d.works[pos],d.works[pos-1]];pfTouch();renderPfEditor();}
    if(mv==='dn'&&pos<d.works.length-1){[d.works[pos+1],d.works[pos]]=[d.works[pos],d.works[pos+1]];pfTouch();renderPfEditor();}
    return;}
  if(e.target.id==='pfCopy'){navigator.clipboard.writeText($('#pfURL').value).then(()=>toast('링크 복사됨'));}
});
$('#pfLeft').addEventListener('input',e=>{
  const d=curPf(); if(!d)return; const id=e.target.id;
  if(id==='pfF-title'){d.title=e.target.value;$('#pfTitle').textContent=d.title;pfTouch();}
  else if(id==='pfF-subtitle'){d.subtitle=e.target.value;pfTouch();updatePfPreview();}
  else if(id==='pfF-intro'){d.intro=e.target.value;pfTouch();updatePfPreview();}
  else if(id==='pfF-cover'){d.cover=e.target.value;pfTouch();updatePfPreview();}
  else if(id==='pfF-slug'){d.slug=e.target.value.replace(/[^a-zA-Z0-9-_가-힣]/g,'-');e.target.value=d.slug;pfTouch();updatePfPreview();}
});
$('#pfLeft').addEventListener('change',e=>{const d=curPf();if(d&&e.target.id==='pfF-vis'){d.visibility=e.target.value;pfTouch();}});

/* ============ LIBRARY ============ */
function fInput(b,i,field,val,label,type){
  return `<div class="f"><label>${label}</label><input data-b="${b}" data-i="${i}" data-f="${field}" data-t="${type||'str'}" value="${esc(val)}"></div>`;
}
function fArea(b,i,field,val,label,type,rows,hint){
  return `<div class="f"><label>${label}</label><textarea rows="${rows||3}" data-b="${b}" data-i="${i}" data-f="${field}" data-t="${type}">${esc(val)}</textarea>${hint?`<div class="hint">${hint}</div>`:''}</div>`;
}
function cField(ci,f,val,label){return `<div class="f"><label>${label}</label><input data-co="${ci}" data-cf="${f}" value="${esc(val)}"></div>`;}
function cArea(ci,f,val,label,rows){return `<div class="f"><label>${label}</label><textarea rows="${rows||2}" data-co="${ci}" data-cf="${f}">${esc(val)}</textarea></div>`;}
function wField(ci,wi,f,val,label){return `<div class="f"><label>${label}</label><input data-wc="${ci}:${wi}" data-wf="${f}" data-wt="str" value="${esc(val)}"></div>`;}
function wArea(ci,wi,f,val,label,type,rows,hint){return `<div class="f"><label>${label}</label><textarea rows="${rows||2}" data-wc="${ci}:${wi}" data-wf="${f}" data-wt="${type||'str'}">${esc(val)}</textarea>${hint?`<div class="hint">${hint}</div>`:''}</div>`;}
function renderCompanies(){
  return `<div class="sec"><h2>경력 · 회사 <span class="add" data-addco="1">+ 회사 추가</span></h2>
   ${(LIB.companies||[]).map((c,ci)=>{
     const open=openCo.has(ci);
     return `<div class="cocard ${open?'open':''}">
      <div class="cohd" data-cotoggle="${ci}">
        <span class="chev">▶</span>
        <div class="coinfo"><div class="coname">${esc(c.name||'회사')}</div><div class="cometa">${esc(c.role||'역할 미입력')}${c.period?' · '+esc(c.period):''} · 작업 ${(c.works||[]).length}개</div></div>
        <span class="rm" data-rmco="${ci}">삭제</span>
      </div>
      <div class="cobody">
        <div class="frow">${cField(ci,'name',c.name,'회사명')}${cField(ci,'period',c.period,'기간')}</div>
        ${cField(ci,'role',c.role,'직무/역할')}
        ${cArea(ci,'summary',c.summary,'회사 한 줄 요약',2)}
        <div class="worksec">
          <div class="workhd">작업 (프로젝트·캠페인)<span class="add" data-addwork="${ci}">+ 작업 추가</span></div>
          ${(c.works||[]).map((w,wi)=>`
            <div class="workcard">
              <div class="bh"><span class="t">📦 ${esc(w.title||'작업')}</span><span class="rm" data-rmwork="${ci}:${wi}">삭제</span></div>
              <div class="frow3">${wField(ci,wi,'title',w.title,'제목')}${wField(ci,wi,'category',w.category,'카테고리')}${wField(ci,wi,'period',w.period,'기간')}</div>
              <div class="frow">${wArea(ci,wi,'summary',w.summary,'요약 (이력서용, 짧게)','str',3)}${wArea(ci,wi,'detail',w.detail,'상세 (포트폴리오용)','str',3)}</div>
              <div class="frow">${wArea(ci,wi,'links',(w.links||[]).map(l=>l.label+' | '+l.url).join('\n'),'링크 (라벨 | URL, 한 줄에 하나)','links',3,'예: YouTube | https://youtu.be/...')}${wArea(ci,wi,'images',(w.images||[]).join('\n'),'이미지 URL (한 줄에 하나)','lines',3)}</div>
              <label class="featlbl"><input type="checkbox" data-feat="${ci}:${wi}" ${w.featured?'checked':''}> 이력서 '프로젝트' 섹션에 표시</label>
            </div>`).join('')||'<div class="empty" style="padding:8px;font-size:12px">작업 없음 · + 작업 추가</div>'}
        </div>
      </div>
     </div>`;
   }).join('')||'<div class="empty" style="padding:14px">회사 없음 · + 회사 추가</div>'}
  </div>`;
}
function renderLibrary(){
  const p=LIB.profile;
  const linkStr=(p.links||[]).map(l=>l.label+' | '+l.url).join('\n');
  let h=`
  <div class="sec"><h2>프로필</h2>
   <div class="blockcard">
    <div class="frow">${fInput('profile',0,'nameKo',p.nameKo,'이름(한글)')}${fInput('profile',0,'nameEn',p.nameEn,'이름(영문)')}</div>
    <div class="frow">${fInput('profile',0,'title',p.title,'타이틀')}${fInput('profile',0,'totalYears',p.totalYears,'총 경력')}</div>
    <div class="f"><label>한 줄 태그라인</label><input data-b="profile" data-i="0" data-f="tagline" data-t="str" value="${esc(p.tagline)}"></div>
    <div class="frow3">${fInput('profile',0,'email',p.email,'이메일')}${fInput('profile',0,'phone',p.phone,'전화')}${fInput('profile',0,'location',p.location,'지역')}</div>
    ${fArea('profile',0,'summary',p.summary,'자기소개','str',4)}
    ${fArea('profile',0,'links',linkStr,'링크 (한 줄에 하나: 라벨 | URL)','links',2,'예: GitHub | https://github.com/...')}
   </div>
  </div>`;

  h+=renderCompanies();

  h+=`<div class="sec"><h2>스킬 <span class="add" data-add="skills">+ 그룹 추가</span></h2>
    <div class="skillgrid">${(LIB.skills||[]).map((s,i)=>`
      <div class="blockcard">
        <div class="bh"><span class="t">${esc(s.group||'그룹')}</span><span class="rm" data-rm="skills" data-i="${i}">삭제</span></div>
        ${fInput('skills',i,'group',s.group,'그룹명')}
        ${fArea('skills',i,'items',(s.items||[]).join(', '),'항목 (쉼표로 구분)','csv',3)}
        <div class="chips" style="margin-top:8px">${(s.items||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>
      </div>`).join('')||'<div class="empty" style="padding:12px">스킬 그룹 없음 · + 그룹 추가</div>'}</div></div>`;
  window['_fac_skills']=()=>({group:'그룹',items:[]});

  h+=libList('학력','education',LIB.education,(e,i)=>`
    <div class="frow3">${fInput('education',i,'school',e.school,'학교/전공')}${fInput('education',i,'degree',e.degree,'학위')}${fInput('education',i,'period',e.period,'기간')}</div>`,
    ()=>({school:'',degree:'',period:''}));

  h+=libList('수상 · 기타','awards',LIB.awards,(a,i)=>`
    <div class="frow3">${fInput('awards',i,'title',a.title,'제목')}${fInput('awards',i,'org',a.org,'주최/설명')}${fInput('awards',i,'date',a.date,'날짜')}</div>`,
    ()=>({title:'',org:'',date:''}));

  h+=libList('AX 하이라이트 (웹용)','ax',LIB.ax,(a,i)=>`
    ${fInput('ax',i,'title',a.title,'제목')}
    ${fArea('ax',i,'desc',a.desc,'설명','str',2)}`,
    ()=>({title:'',desc:''}));

  h+=libList('핵심 지표 (웹용)','highlights',LIB.highlights,(x,i)=>`
    <div class="frow">${fInput('highlights',i,'n',x.n,'수치')}${fInput('highlights',i,'l',x.l,'설명')}</div>`,
    ()=>({n:'',l:''}));

  $('#libBody').innerHTML=h;
}
function libList(title,key,arr,fields,factory){
  window['_fac_'+key]=factory;
  return `<div class="sec"><h2>${title}<span class="add" data-add="${key}">+ 추가</span></h2>
    ${arr.map((it,i)=>`<div class="blockcard"><div class="bh"><span class="t">${title} ${i+1}</span><span class="rm" data-rm="${key}" data-i="${i}">삭제</span></div>${fields(it,i)}</div>`).join('')||'<div class="empty" style="padding:14px">없음 · + 추가</div>'}</div>`;
}
function parseLinks(v){return v.split('\n').map(s=>s.trim()).filter(Boolean).map(l=>{const[la,...r]=l.split('|');return{label:(la||'').trim(),url:r.join('|').trim()};});}
$('#libBody').addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.co!==undefined&&t.dataset.cf){const c=LIB.companies[+t.dataset.co];if(c){c[t.dataset.cf]=t.value;derive();save();}return;}
  if(t.dataset.wc){const[ci,wi]=t.dataset.wc.split(':').map(Number);const w=LIB.companies[ci]&&LIB.companies[ci].works[wi];if(w){const ty=t.dataset.wt,v=t.value;
    if(ty==='links')w[t.dataset.wf]=parseLinks(v);
    else if(ty==='lines')w[t.dataset.wf]=v.split('\n').map(s=>s.trim()).filter(Boolean);
    else w[t.dataset.wf]=v;
    derive();save();}return;}
  if(!t.dataset.b)return;
  const b=t.dataset.b, i=+t.dataset.i, f=t.dataset.f, ty=t.dataset.t, v=t.value;
  const tgt = b==='profile'?LIB.profile:LIB[b][i]; if(!tgt)return;
  if(ty==='lines')tgt[f]=v.split('\n').map(s=>s.trim()).filter(Boolean);
  else if(ty==='csv')tgt[f]=v.split(',').map(s=>s.trim()).filter(Boolean);
  else if(ty==='kpis')tgt[f]=v.split('\n').map(s=>s.trim()).filter(Boolean).map(l=>{const [n,...r]=l.split('|');return {n:(n||'').trim(),l:r.join('|').trim()};});
  else if(ty==='links')tgt[f]=v.split('\n').map(s=>s.trim()).filter(Boolean).map(l=>{const [la,...r]=l.split('|');return {label:(la||'').trim(),url:r.join('|').trim()};});
  else tgt[f]=v;
  save();
});
$('#libBody').addEventListener('click',e=>{
  const ds=e.target.dataset;
  if(ds.addco){LIB.companies.push({id:'c'+Date.now().toString(36),name:'새 회사',role:'',period:'',summary:'',works:[]});derive();save();renderLibrary();return;}
  if(ds.rmco!==undefined){if(confirm('회사를 삭제할까요? (하위 작업 포함)')){LIB.companies.splice(+ds.rmco,1);derive();save();renderLibrary();}return;}
  if(ds.addwork!==undefined){LIB.companies[+ds.addwork].works.push({id:'w'+Date.now().toString(36),title:'새 작업',category:'',period:'',summary:'',detail:'',links:[],images:[],featured:false});derive();save();renderLibrary();return;}
  if(ds.rmwork){const[ci,wi]=ds.rmwork.split(':').map(Number);LIB.companies[ci].works.splice(wi,1);derive();save();renderLibrary();return;}
  if(ds.feat){const[ci,wi]=ds.feat.split(':').map(Number);LIB.companies[ci].works[wi].featured=e.target.checked;derive();save();return;}
  const add=e.target.dataset.add;
  if(add){LIB[add].push(window['_fac_'+add]());save();renderLibrary();return;}
  const rm=e.target.dataset.rm;
  if(rm){LIB[rm].splice(+e.target.dataset.i,1);save();renderLibrary();return;}
  const coT=e.target.closest('[data-cotoggle]');
  if(coT){const ci=+coT.dataset.cotoggle;openCo.has(ci)?openCo.delete(ci):openCo.add(ci);renderLibrary();}
});
document.querySelectorAll('[data-libtpl]').forEach(b=>b.addEventListener('click',()=>{
  libTpl=b.dataset.libtpl;
  document.querySelectorAll('[data-libtpl]').forEach(x=>x.classList.toggle('on',x===b));
  updateLibPreview();
}));

/* ============ import / export / theme ============ */
$('#exportBtn').addEventListener('click',()=>{
  const blob=new Blob([JSON.stringify({LIB,DOCS},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='resume-studio-backup.json';a.click();
});
$('#importBtn').addEventListener('click',()=>{
  const inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=()=>{const fr=new FileReader();fr.onload=()=>{try{const o=JSON.parse(fr.result);if(o.LIB)LIB=o.LIB;if(o.DOCS)DOCS=o.DOCS;save();toast('가져오기 완료');show('home');}catch(err){toast('파일 오류');}};fr.readAsText(inp.files[0]);};
  inp.click();
});
(function(){var r=document.documentElement,s=localStorage.getItem('studio_theme');
if(s)r.setAttribute('data-theme',s);else if(matchMedia('(prefers-color-scheme:dark)').matches)r.setAttribute('data-theme','dark');
$('#themeBtn').addEventListener('click',()=>{var n=r.getAttribute('data-theme')==='dark'?'light':'dark';r.setAttribute('data-theme',n);localStorage.setItem('studio_theme',n);if(curDoc())updatePreview();});})();

/* ============ cloud sync ============ */
let cloudTimer=null;
function cloudSync(){
  if(!(window.CLOUD&&CLOUD.enabled()&&CLOUD.user()))return;
  clearTimeout(cloudTimer);
  cloudTimer=setTimeout(async()=>{
    try{ normalizeIds(); await CLOUD.pushAll(LIB,DOCS,resolveAny); }
    catch(e){ console.warn('cloudSync',e); }
  },900);
}
async function syncFromCloud(){
  try{
    const r=await CLOUD.pull(); if(!r)return;
    if(r.library){                       // 클라우드에 데이터 있으면 채택
      LIB=Object.assign({},LIB,r.library);
      DOCS=r.docs||[];
      normalizeIds(); derive();
    }else{                               // 최초: 로컬 시드를 클라우드로 업로드
      if(!LIB.companies){ LIB.companies=clone((window.RESUME||{}).companies||[]); }
      normalizeIds(); derive();
      await CLOUD.pushAll(LIB,DOCS,resolveAny);
    }
    localStorage.setItem(LS_LIB,JSON.stringify(LIB));
    localStorage.setItem(LS_DOCS,JSON.stringify(DOCS));
    renderHome(); toast('클라우드 동기화 완료');
  }catch(e){ console.warn(e); toast('동기화 오류'); }
}
function renderAuthBox(){
  const box=$('#authBox'); if(!box)return;
  if(!(window.CLOUD&&CLOUD.enabled())){box.innerHTML='<span style="font-size:11px;color:var(--muted)">오프라인 모드</span>';return;}
  const u=CLOUD.user();
  if(u){
    box.innerHTML=`<div style="font-size:11px;color:var(--ok);word-break:break-all">☁️ ${esc(u.email)}</div><button class="mini" id="logoutBtn" style="margin-top:6px;width:100%">로그아웃</button>`;
    $('#logoutBtn').onclick=async()=>{await CLOUD.signOut();toast('로그아웃');};
  }else{
    box.innerHTML=`<button class="mini" id="loginBtn" style="width:100%">☁️ 클라우드 로그인</button>`;
    $('#loginBtn').onclick=()=>{$('#authModal').style.display='grid';$('#authErr').textContent='';};
  }
}
let _lastUser=null;
function onAuth(u){ renderAuthBox(); if(u&&!_lastUser) syncFromCloud(); _lastUser=u; }
function authVals(){return [$('#authEmail').value.trim(),$('#authPw').value];}
$('#authClose').onclick=()=>$('#authModal').style.display='none';
$('#authLogin').onclick=async()=>{const[e,p]=authVals();try{await CLOUD.signIn(e,p);$('#authModal').style.display='none';}catch(err){$('#authErr').textContent=err.message||String(err);}};
$('#authSignup').onclick=async()=>{const[e,p]=authVals();try{const d=await CLOUD.signUp(e,p);if(!d.session){$('#authErr').textContent='가입됨. 이메일 확인이 필요할 수 있어요(설정에서 확인을 끄면 바로 로그인).';}else{$('#authModal').style.display='none';}}catch(err){$('#authErr').textContent=err.message||String(err);}};

/* ============ boot ============ */
(async function(){
  renderHome();
  if(window.CLOUD&&CLOUD.enabled()){
    await CLOUD.init();
    _lastUser=CLOUD.user();
    CLOUD.onAuth(onAuth);
    renderAuthBox();
    if(CLOUD.user()) await syncFromCloud();
  }else{ renderAuthBox(); }
})();
</script>
