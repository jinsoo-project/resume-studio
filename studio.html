<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Resume Studio — 이력서 빌더</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:oklch(0.985 0 0);--surface:oklch(1 0 0);--fg:oklch(0.145 0 0);--muted:oklch(0.556 0 0);
  --card:oklch(1 0 0);--panel:oklch(0.97 0 0);--border:oklch(0.922 0 0);--ring:oklch(0.708 0 0);
  --primary:oklch(0.205 0 0);--primary-fg:oklch(0.985 0 0);--acc:#3182F6;--acc-soft:#EAF2FE;--ok:#12B886;
  --radius:12px;--rail:220px;--font:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo",system-ui,Roboto,"Segoe UI","Malgun Gothic",sans-serif;
}
:root[data-theme="dark"]{
  --bg:oklch(0.145 0 0);--surface:oklch(0.185 0 0);--fg:oklch(0.985 0 0);--muted:oklch(0.708 0 0);
  --card:oklch(0.205 0 0);--panel:oklch(0.235 0 0);--border:oklch(1 0 0 / 12%);--ring:oklch(0.556 0 0);
  --primary:oklch(0.922 0 0);--primary-fg:oklch(0.205 0 0);--acc:#4593FC;--acc-soft:rgba(69,147,252,.14);--ok:#4ADE80;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.55;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
a{color:inherit}
.mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,Menlo,Consolas,monospace}
button{font-family:inherit}
input,textarea,select{font-family:inherit}

.app{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100vh}
/* rail */
aside{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--border);padding:18px 12px;display:flex;flex-direction:column;gap:3px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:9px;padding:4px 8px 16px;font-weight:700;font-size:14px}
.brand .lg{width:26px;height:26px;border-radius:7px;background:var(--primary);color:var(--primary-fg);display:grid;place-items:center;font-size:12px;font-weight:700}
.nv{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:8px;font-size:13.5px;color:var(--muted);border:none;background:none;width:100%;text-align:left;cursor:pointer}
.nv:hover{background:var(--panel);color:var(--fg)}
.nv.on{background:var(--panel);color:var(--fg);font-weight:600}
.nv svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.rail-sp{flex:1}
.railfoot{border-top:1px solid var(--border);padding-top:10px;font-size:11px;color:var(--muted)}
.railfoot .row{display:flex;gap:6px;margin-top:8px}
.mini{flex:1;font-size:11px;border:1px solid var(--border);background:var(--card);color:var(--muted);border-radius:7px;padding:7px;cursor:pointer;text-align:center}
.mini:hover{color:var(--fg)}

main{min-width:0}
.mtop{position:sticky;top:0;z-index:5;background:color-mix(in oklch,var(--bg) 86%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:14px 26px;display:flex;align-items:center;gap:12px}
.mtop h1{font-size:17px;font-weight:700;margin:0}
.mtop .sp{flex:1}
.mwrap{padding:24px 26px 80px;max-width:1160px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:8px;font-size:13.5px;font-weight:500;border:1px solid var(--border);background:var(--card);cursor:pointer;color:var(--fg)}
.btn:hover{background:var(--panel)}
.btn.p{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.btn.a{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.icon{width:32px;height:32px;padding:0;justify-content:center}

/* cards / docs */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.doc{border:1px solid var(--border);border-radius:12px;background:var(--card);padding:16px 17px}
.doc .tt{font-size:15px;font-weight:650}
.doc .badge{display:inline-block;font-size:11px;color:var(--acc);background:var(--acc-soft);border-radius:6px;padding:2px 8px;margin-top:7px}
.doc .meta{font-size:11.5px;color:var(--muted);margin-top:8px}
.doc .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px}
.newcard{border:1.5px dashed var(--border);border-radius:12px;display:grid;place-items:center;min-height:130px;color:var(--muted);cursor:pointer;font-size:13.5px}
.newcard:hover{border-color:var(--acc);color:var(--acc)}

/* library forms */
.sec{margin-bottom:26px}
.sec > h2{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;display:flex;align-items:center;gap:8px}
.sec > h2 .add{margin-left:auto;font-size:12px;color:var(--acc);cursor:pointer;letter-spacing:0;text-transform:none;font-weight:500}
.blockcard{border:1px solid var(--border);border-radius:11px;background:var(--card);padding:15px;margin-bottom:11px}
.blockcard .bh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.blockcard .bh .t{font-weight:600;font-size:13px;color:var(--muted)}
.blockcard .bh .rm{margin-left:auto;color:var(--muted);cursor:pointer;font-size:12px;border:1px solid var(--border);border-radius:6px;padding:3px 8px}
.blockcard .bh .rm:hover{color:#dc2626;border-color:#dc2626}
.f{margin-bottom:10px}
.f:last-child{margin-bottom:0}
.f label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
.f input,.f textarea,.f select{width:100%;border:1px solid var(--border);background:var(--surface);color:var(--fg);border-radius:9px;padding:10px 12px;font-size:14px;transition:border-color .12s}
.f input:focus,.f textarea:focus{outline:none;border-color:var(--acc)}
.f textarea{resize:vertical;line-height:1.5}
.f .hint{font-size:10.5px;color:var(--muted);margin-top:3px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frow3{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:620px){.frow,.frow3{grid-template-columns:1fr}}
.worksec{margin-top:12px;border-top:1px solid var(--border);padding-top:10px}
.workhd{font-size:12px;font-weight:700;color:var(--muted);display:flex;align-items:center;margin-bottom:8px}
.workhd .add{margin-left:auto}
.workcard{border:1px solid var(--border);border-radius:9px;background:var(--panel);padding:12px;margin-bottom:8px}
.featlbl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:6px;cursor:pointer}
/* library 2-pane + segmented toggle */
.seg{display:inline-flex;background:var(--panel);border-radius:10px;padding:3px;gap:2px}
.segbtn{border:none;background:none;color:var(--muted);font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:8px;cursor:pointer;font-family:inherit}
.segbtn.on{background:var(--surface);color:var(--acc);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.libsplit{display:grid;grid-template-columns:minmax(380px,45%) 1fr;height:calc(100vh - 58px)}
.libform{overflow-y:auto;padding:22px 24px 100px;border-right:1px solid var(--border)}
.libform .sec{max-width:none}
.skillgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:1200px){.skillgrid{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11.5px;color:var(--muted);background:var(--panel);border-radius:7px;padding:4px 9px}
/* DB viewer */
.dbtabs{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:14px;margin-bottom:16px;border-bottom:1px solid var(--border)}
.dbtab{white-space:nowrap;font-size:13px;font-weight:600;color:var(--muted);background:var(--panel);border:1px solid var(--border);border-radius:999px;padding:8px 15px;cursor:pointer}
.dbtab:hover{color:var(--fg);border-color:var(--muted)}
.dbtab.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.dbwrap{padding:22px 30px 90px}
.dbhint{font-size:12.5px;color:var(--muted);margin:0 0 14px}
.dbgridwrap{overflow:auto;max-height:calc(100vh - 220px);border:1px solid var(--border);border-radius:12px;background:var(--card)}
.dbgrid{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
.dbgrid th{text-align:left;background:var(--panel);color:var(--muted);font-weight:700;padding:11px 12px;white-space:nowrap;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:2;font-size:12px}
.dbgrid td{padding:5px 7px;vertical-align:top;border-bottom:1px solid var(--border)}
.dbgrid tbody tr:hover{background:color-mix(in oklch,var(--acc) 4%,transparent)}
.dbgrid tr:last-child td{border-bottom:none}
.dbin{width:100%;min-width:96px;box-sizing:border-box;border:1px solid transparent;background:transparent;color:var(--fg);border-radius:7px;padding:7px 9px;font:inherit;font-size:13px;resize:vertical}
.dbin:hover{border-color:var(--border);background:var(--surface)}
.dbin:focus{border-color:var(--acc);background:var(--surface);outline:none;box-shadow:0 0 0 2px color-mix(in oklch,var(--acc) 18%,transparent)}
textarea.dbin{min-width:200px;line-height:1.45}
select.dbin{min-width:120px;cursor:pointer}
.dbchk{width:18px;height:18px;cursor:pointer;margin-top:8px}
.dbdel{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:transparent;color:#c0392b;cursor:pointer;font-size:13px;line-height:1}
.dbdel:hover{background:color-mix(in oklch,#c0392b 12%,transparent);border-color:#c0392b}
.libpv{background:var(--panel);padding:14px;overflow:hidden}
#libPreview{width:100%;height:100%;border:1px solid var(--border);border-radius:12px;background:#fff}
/* company accordion */
.cocard{border:1px solid var(--border);border-radius:12px;background:var(--card);margin-bottom:10px;overflow:hidden}
.cohd{display:flex;align-items:center;gap:11px;padding:13px 14px;cursor:pointer;user-select:none}
.cohd:hover{background:var(--panel)}
.cohd .chev{color:var(--muted);font-size:11px;transition:transform .15s;flex-shrink:0}
.cocard.open .cohd .chev{transform:rotate(90deg)}
.cohd .coinfo{flex:1;min-width:0}
.cohd .coname{font-weight:700;font-size:14.5px}
.cohd .cometa{font-size:11.5px;color:var(--muted);margin-top:2px}
.cohd .rm{color:var(--muted);cursor:pointer;font-size:11.5px;border:1px solid var(--border);border-radius:7px;padding:4px 9px;flex-shrink:0}
.cohd .rm:hover{color:#dc2626;border-color:#dc2626}
.cobody{display:none;padding:4px 14px 16px;border-top:1px solid var(--border)}
.cocard.open .cobody{display:block}
@media(max-width:900px){.libsplit{grid-template-columns:1fr;height:auto}.libpv{border-left:none;border-top:1px solid var(--border)}#libPreview{height:70vh}}

/* builder */
.buildwrap{display:grid;grid-template-columns:380px 1fr;gap:0;height:calc(100vh - 58px)}
.bcol{overflow-y:auto;padding:20px 22px}
.bcol.left{border-right:1px solid var(--border)}
.bcol.right{background:var(--panel);padding:18px}
.blabel{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:20px 0 10px}
.blabel:first-child{margin-top:0}
.tplrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tpl{border:1px solid var(--border);border-radius:9px;padding:10px;cursor:pointer;background:var(--card);text-align:center}
.tpl .t{font-size:12.5px;font-weight:650}.tpl .d{font-size:10.5px;color:var(--muted)}
.tpl.sel{border-color:var(--acc);background:var(--acc-soft);color:var(--acc)}
.tgl{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--border);border-radius:9px;background:var(--card);margin-bottom:6px;font-size:13px}
.tgl .grip{color:var(--muted);cursor:grab;font-size:11px;letter-spacing:-2px;user-select:none}
.tgl .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tgl .mv{color:var(--muted);cursor:pointer;font-size:12px;padding:0 3px}
.tgl .mv:hover{color:var(--fg)}
.sw{width:34px;height:20px;border-radius:999px;background:var(--acc);position:relative;cursor:pointer;flex-shrink:0;border:none}
.sw::after{content:"";position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.sw.off{background:#c7cbd1}
.sw.off::after{right:auto;left:2px}
:root[data-theme="dark"] .sw.off{background:#3a3d42}
.previewframe{width:100%;height:100%;border:1px solid var(--border);border-radius:10px;background:#fff;display:block}
.pubbox{border:1px solid var(--border);border-radius:10px;background:var(--card);padding:13px;margin-top:14px}
.urlline{display:flex;align-items:center;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-top:8px;font-size:11.5px}
.urlline input{flex:1;border:none;background:var(--surface);color:var(--fg);padding:8px 9px;font-family:ui-monospace,Menlo,monospace;min-width:0}
.hidden{display:none!important}
.empty{color:var(--muted);font-size:14px;padding:40px 0;text-align:center}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--primary);color:var(--primary-fg);padding:10px 18px;border-radius:9px;font-size:13px;z-index:50;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
.modalbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;place-items:center;padding:20px}
.modalcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px;width:340px;max-width:100%}
.modalcard input{width:100%;border:1px solid var(--border);background:var(--bg);color:var(--fg);border-radius:8px;padding:10px;font-size:14px;margin-bottom:8px}
@media(max-width:860px){.app{grid-template-columns:1fr}aside{display:none}.buildwrap{grid-template-columns:1fr;height:auto}.bcol.left{border-right:none;border-bottom:1px solid var(--border)}.previewframe{height:70vh}}
/* ===== KILO 대시보드: 탭 · 카드 · 스위치 · 아코디언 ===== */
#v-ax .libsplit{grid-template-columns:minmax(440px,50%) 1fr}
#axLeft{padding:0!important;background:var(--bg)}
.kd-tabs{position:sticky;top:0;z-index:5;display:flex;gap:4px;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.kd-tabs::-webkit-scrollbar{display:none}
.kd-tab{flex:none;height:32px;padding:0 13px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--muted);font:600 13px/1 inherit;font-family:inherit;cursor:pointer;white-space:nowrap}
.kd-tab:hover{color:var(--fg);background:var(--panel)}
.kd-tab.on{color:var(--fg);background:var(--card);border-color:var(--border);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.kd-tab i{font-style:normal;font-size:10px;font-weight:700;color:#c0392b;margin-left:5px}
.kd-pane{padding:16px 16px 120px}
.kd-intro{font-size:12.5px;color:var(--muted);line-height:1.6;margin:0 2px 12px}
.kd-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 14px 12px;margin-bottom:12px}
.kd-card>h4{margin:0 0 12px;font-size:13px;font-weight:700;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.kd-card>h4 span{font-size:11.5px;font-weight:500;color:var(--muted)}
.kd-f{margin-bottom:10px}.kd-f:last-child{margin-bottom:0}
.kd-l{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:4px}
.kd-l em{font-style:normal;font-weight:400;margin-left:6px;opacity:.85}
.kd-in{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--fg);font-size:13px;font-family:inherit;line-height:1.4;transition:border-color .15s,box-shadow .15s}
.kd-in:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea.kd-in{resize:vertical;min-height:38px}
select.kd-in{cursor:pointer}
.kd-g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kd-g2>.kd-f{margin-bottom:10px}
.kd-row{display:flex;align-items:center;gap:8px}
.kd-row>.kd-in{flex:1;min-width:0}
.kd-sw{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--fg);cursor:pointer;user-select:none;white-space:nowrap;position:relative;flex:none}
.kd-sw input{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
.kd-sw span{flex:none;width:30px;height:18px;border-radius:999px;background:var(--border);position:relative;transition:background .2s}
.kd-sw span::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .2s}
.kd-sw input:checked+span{background:var(--acc)}
.kd-sw input:checked+span::after{transform:translateX(12px)}
.kd-sw input:focus-visible+span{box-shadow:0 0 0 3px var(--acc-soft)}
.kd-sws{display:flex;flex-wrap:wrap;gap:10px 18px}
.kd-ib{flex:none;width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:13px;cursor:pointer;line-height:1;display:inline-grid;place-items:center;font-family:inherit;padding:0}
.kd-ib:hover:not(:disabled){color:var(--fg);border-color:var(--ring)}
.kd-ib:disabled{opacity:.35;cursor:default}
.kd-del:hover:not(:disabled){color:#c0392b;border-color:#c0392b}
.kd-btn,.kd-add{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--fg);font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;flex:none}
.kd-add{border-style:dashed;color:var(--muted)}
.kd-add:hover,.kd-btn:hover{border-color:var(--ring);color:var(--fg)}
.kd-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.kd-seg{display:flex;flex-wrap:wrap;gap:6px}
.kd-seg .kd-btn{text-decoration:none}
.kd-btn.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}
/* 프로젝트 그룹(묶음) 편집 */
.kd-cnt{flex:none;font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.kd-cats{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;padding-left:38px}
.kd-cat{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 11px;border-radius:999px;border:1px dashed var(--border);background:transparent;color:var(--muted);font:inherit;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.kd-cat i{font-style:normal;font-weight:500;opacity:.7}
.kd-cat b{font-weight:600;opacity:.55;margin-left:1px}
select.kd-catadd{width:auto;max-width:200px;height:28px;padding:0 10px;border-radius:999px;font-size:12px}
.kd-cat:hover{border-color:var(--ring);color:var(--fg)}
.kd-cat.on{border-style:solid;border-color:var(--acc);background:var(--acc-soft);color:var(--acc)}
.kd-wrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--border)}
.kd-wrow:first-of-type{border-top:0}
.kd-wt{flex:1;min-width:0;font-size:12.5px;font-weight:600;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kd-wt small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.kd-wrow select.kd-in{flex:none;width:200px}
.kd-item{border:1px solid var(--border);border-radius:10px;padding:8px 10px;margin-bottom:6px;background:var(--surface)}
.kd-item.off{opacity:.55}
.kd-thumb{flex:none;object-fit:cover;background:#fff;border:1px solid var(--border);box-sizing:border-box}
.kd-note{font-size:11.5px;color:var(--muted);margin:6px 0 0;line-height:1.5}
.kd-sec-t{display:flex;align-items:baseline;gap:8px;font-size:12px;font-weight:700;margin:16px 0 8px}
.kd-sec-t:first-child{margin-top:0}
.kd-sec-t span{font-size:11.5px;font-weight:500;color:var(--muted)}
.kd-acc{border:1px solid var(--border);border-radius:12px;background:var(--card);margin-bottom:8px;overflow:hidden}
.kd-acc.off{opacity:.6}
.kd-acc-hd{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer}

.kd-dim{opacity:.45}

<script>
/* ============ storage & state ============ */
const LS_LIB='rs_lib_v1', LS_DOCS='rs_docs_v1';
const $=s=>document.querySelector(s);
const uid=()=> (window.crypto&&crypto.randomUUID) ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&0x3|0x8)).toString(16);});
const isUuid=s=>/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(s||'');
function normalizeIds(){
  const remap={};
  (LIB.companies||[]).forEach(c=>{ const old=c.id; if(!isUuid(c.id))c.id=uid(); if(old&&old!==c.id)remap[old]=c.id;
    (c.works||[]).forEach(w=>{ if(!isUuid(w.id))w.id=uid();
      (w.metrics||[]).forEach(m=>{ if(!isUuid(m.id))m.id=uid(); });
      (w.links||[]).forEach(l=>{ if(!isUuid(l.id))l.id=uid(); });
      (w.media||[]).forEach(m=>{ if(!isUuid(m.id))m.id=uid(); }); }); });
  (LIB.ax||[]).forEach(a=>{ if(!isUuid(a.id))a.id=uid(); if(a.companyId&&remap[a.companyId])a.companyId=remap[a.companyId]; if(a.companyId&&!isUuid(a.companyId))a.companyId=null; });
  (LIB.highlights||[]).forEach(h=>{ if(!isUuid(h.id))h.id=uid(); });
  ['skills','education','awards'].forEach(k=>(LIB[k]||[]).forEach(x=>{ if(!isUuid(x.id))x.id=uid(); }));
  (DOCS||[]).forEach(d=>{ if(!isUuid(d.id))d.id=uid(); });
}
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function save(){localStorage.setItem(LS_LIB,JSON.stringify(LIB));localStorage.setItem(LS_DOCS,JSON.stringify(DOCS));flash();cloudSync();updateLibPreview();}
function buildFullResolved(tpl){return {template:tpl,title:'미리보기',profile:LIB.profile,summaryOn:true,highlights:LIB.highlights,ax:LIB.ax,experiences:LIB.experiences,projects:LIB.projects,skills:LIB.skills,education:LIB.education,awards:LIB.awards,roleTags:LIB.roleTags};}
let libPvTimer=null;
function updateLibPreview(){const pv=document.getElementById('libPreview');if(!pv)return;if(document.getElementById('v-library').classList.contains('hidden'))return;clearTimeout(libPvTimer);libPvTimer=setTimeout(()=>{pv.setAttribute('srcdoc',TEMPLATES.render(buildFullResolved(libTpl)));},200);}
function flash(){const el=$('#libSaved');if(el){el.textContent='저장됨 · '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});}}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1900);}

function seed(){
  const R=window.RESUME||{};
  return {
    profile: clone(R.profile||{nameKo:'',nameEn:'',title:'',tagline:'',totalYears:'',email:'',phone:'',location:'',summary:'',links:[]}),
    highlights: clone(R.highlights||[]),
    ax: clone(R.ax||[]),
    experiences: clone(R.experiences||[]),
    projects: clone(R.projects||[]),
    skills: clone(R.skills||[]),
    education: clone(R.education||[]),
    awards: clone(R.awards||[]),
    companies: clone(R.companies||[]),
    roleTags: ["퍼포먼스 마케팅","마케팅 데이터 분석","그로스 엔지니어링","브랜딩/콘텐츠","프론트엔드"]
  };
}
function derive(){ if(window.deriveFromCompanies) window.deriveFromCompanies(LIB); }
let LIB = JSON.parse(localStorage.getItem(LS_LIB)||'null') || seed();
if(!LIB.companies){ LIB.companies = clone((window.RESUME||{}).companies||[]); }
if(LIB.companies[0] && LIB.companies[0].nameKo===undefined){ LIB = seed(); }  // v2→v3 구조 재시드
derive();
let DOCS = JSON.parse(localStorage.getItem(LS_DOCS)||'null') || [];
let curDocId = null;
let libTpl = 'web', openCo = new Set();

/* ============ doc config ============ */
function newDoc(){
  const d={id:uid(),title:'새 이력서',template:'wanted',slug:'resume-'+uid(),visibility:'unlisted',
    summaryOn:true,axOn:true,highlightsOn:true,skillsOn:true,educationOn:true,awardsOn:true,
    lists:{experiences:LIB.experiences.map((_,i)=>({i,on:true})),projects:LIB.projects.map((_,i)=>({i,on:true}))},
    updated:Date.now()};
  DOCS.unshift(d); save(); return d;
}
function reconcile(d){ // keep lists in sync with LIB length
  ['experiences','projects'].forEach(k=>{
    const have=new Set(d.lists[k].map(x=>x.i));
    d.lists[k]=d.lists[k].filter(x=>x.i<LIB[k].length);
    LIB[k].forEach((_,i)=>{if(!have.has(i))d.lists[k].push({i,on:true});});
  });
  return d;
}
function resolve(d){
  reconcile(d);
  return {
    template:d.template,title:d.title,slug:d.slug,visibility:d.visibility,
    profile:LIB.profile, summaryOn:d.summaryOn,
    highlights:d.highlightsOn?LIB.highlights:[],
    ax:d.axOn?LIB.ax:[],
    experiences:d.lists.experiences.filter(x=>x.on).map(x=>LIB.experiences[x.i]).filter(Boolean),
    projects:d.lists.projects.filter(x=>x.on).map(x=>LIB.projects[x.i]).filter(Boolean),
    skills:d.skillsOn?LIB.skills:[],
    education:d.educationOn?LIB.education:[],
    awards:d.awardsOn?LIB.awards:[],
    roleTags:LIB.roleTags
  };
}

/* ============ encode / URL ============ */
function encodeDoc(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function viewURL(d){
  const base=location.href.replace(/studio\.html.*$/,'').replace(/[^/]*$/,'');
  // 로그인 상태면 클라우드 slug URL(짧고 공유용), 아니면 자체완결 hash URL(오프라인)
  if(window.CLOUD&&CLOUD.enabled()&&CLOUD.user()){
    if(location.protocol==='http:'||location.protocol==='https:'){ if(d.template==='klio'||d.slug==='portfolio') return 'https://kimjinsoo-mkt-ax.vercel.app/'+encodeURIComponent(d.slug); return base+(d.kind==='portfolio'?'p/':'r/')+encodeURIComponent(d.slug); }
    return base+'view.html?slug='+encodeURIComponent(d.slug);
  }
  return base+'view.html#'+encodeDoc(resolveAny(d));
}
function resolveKlio(d){ var s=resolveAX(d); s.template='klio'; s.title=d.title||'마케팅 포트폴리오'; return s; }
function resolveAny(d){ if(d.template==='klio') return resolveKlio(d); if(d.template==='ax') return resolveAX(d); return d.kind==='portfolio' ? resolvePF(d) : resolve(d); }
function resolveAX(d){ return { template:'ax', title:d.title||'AX 포트폴리오', slug:d.slug, visibility:d.visibility||'unlisted', profile:LIB.profile, companies:LIB.companies||[], capabilities:LIB.capabilities||[], pipeline:LIB.pipeline||[], flow:LIB.flow||[], highlights:LIB.highlights||[], axLoop:LIB.axLoop||[], axScreens:LIB.axScreens||[], axNotes:LIB.axNotes||[], klio:klioNormalize(d) }; }

/* ============ nav ============ */
function show(view){
  ['home','library','builder','portfolio','resume','ax','db'].forEach(v=>$('#v-'+v).classList.toggle('hidden',v!==view));
  document.querySelectorAll('.nv').forEach(b=>b.classList.toggle('on',b.dataset.view===view));
  if(view==='home')renderHome();
  if(view==='library'){renderLibrary();updateLibPreview();}
  if(view==='builder')renderBuilder();
  if(view==='portfolio')renderPortfolioView();
  if(view==='db')renderDbView();
  if(view==='resume')renderResumeManage();
  if(view==='ax')renderAXAdmin();
}
const DB_TABLES=[
  {name:'profile', rel:'1행/유저', cols:['name_ko','name_en','title','summary','email','phone','location','links','role_tags']},
  {name:'companies', rel:'회사 → works', grp:1, cols:['id','name_ko','name_en','role','start_date','end_date','summary','logo_url','sort']},
  {name:'works', rel:'작업(회사 기준)', grp:1, cols:['id','company_id','title','category','start_date','end_date','summary','detail','featured','stack','sort']},
  {name:'work_metrics', rel:'성과수치(작업 기준)', grp:1, cols:['id','work_id','value','label','sort']},
  {name:'work_links', rel:'외부 URL(작업 기준)', grp:1, cols:['id','work_id','label','url','sort']},
  {name:'media', rel:'이미지/영상/첨부', grp:1, cols:['id','work_id','type','url','title','sort']},
  {name:'ax_experiences', rel:'AX 경험(회사 연결)', cols:['id','company_id','title','description','sort']},
  {name:'highlights', rel:'핵심 지표', cols:['id','value','label','sort']},
  {name:'skills', cols:['id','group_name','items','sort']},
  {name:'education', cols:['id','school','degree','field','start_date','end_date','sort']},
  {name:'awards', cols:['id','title','org','award_date','sort']},
  {name:'resume_docs', rel:'이력서 발행', cols:['id','slug','title','template','visibility','updated_at']},
  {name:'portfolio_pages', rel:'포폴 발행', cols:['id','slug','title','subtitle','visibility']},
  {name:'portfolio_blocks', rel:'블록', cols:['id','page_id','type','content','sort']}
];
function dbCell(v){ if(v==null)return ''; if(typeof v==='object')return JSON.stringify(v).slice(0,80); return String(v).slice(0,80); }
let dbSort={col:null,dir:1};
function dbSortRows(rows,t,maps){
  const val=(r,k)=>{ if(k==='company_id')return maps.co[r[k]]||''; if(k==='work_id')return maps.wk[r[k]]||''; const v=r[k]; return v==null?'':v; };
  const rr=[...rows];
  if(dbSort.col){
    rr.sort((a,b)=>{const x=val(a,dbSort.col),y=val(b,dbSort.col);const c=(typeof x==='number'&&typeof y==='number')?x-y:String(x).localeCompare(String(y),'ko',{numeric:true});return c*dbSort.dir;});
  } else {
    const pk=t.cols.includes('company_id')?'company_id':(t.cols.includes('work_id')?'work_id':null);
    rr.sort((a,b)=>{ if(pk){const c=String(val(a,pk)).localeCompare(String(val(b,pk)),'ko');if(c)return c;} return (a.sort??0)-(b.sort??0); });
  }
  return rr;
}
function dbCard(t,rows,err,maps){
  maps=maps||{co:{},wk:{}};
  const cols=t.cols.map(c=>`<span class="dbcol">${c}</span>`).join('');
  let count='', tbl='';
  if(err){ tbl=`<div style="color:#dc2626;font-size:12px">${esc(err)}</div>`; }
  else if(rows===null){ tbl=`<div class="muted" style="font-size:12px">로그인하면 실제 행 표시</div>`; }
  else {
    count=`<span class="dbcount">${rows.length} rows</span>`;
    if(rows.length){
      const sorted=dbSortRows(rows,t,maps);
      const cell=(r,k)=>{ if(k==='company_id')return maps.co[r[k]]||dbCell(r[k]); if(k==='work_id')return maps.wk[r[k]]||dbCell(r[k]); const raw=dbCell(r[k]); return (k==='id'&&raw.length>12)?raw.slice(0,8)+'…':raw; };
      const arrow=k=>dbSort.col===k?(dbSort.dir>0?' ▲':' ▼'):'';
      tbl=`<div class="dbtable"><table><thead><tr>${t.cols.map(k=>`<th data-dbsort="${k}" class="dbsortable">${k}${arrow(k)}</th>`).join('')}</tr></thead><tbody>`+
        sorted.slice(0,100).map(r=>`<tr>${t.cols.map(k=>`<td title="${esc(dbCell(r[k]))}">${esc(cell(r,k))}</td>`).join('')}</tr>`).join('')+
        `</tbody></table></div>`;

function dbAttrEsc(s){ return esc(s).replace(/"/g,'&quot;'); }
function dbCellHtml(cfg,w,cd,ri){
  var k=cd[0], type=(typeof cd[2]==='string')?cd[2]:'', o=w.o;
  var wide=(typeof cd[2]==='number')?cd[2]:(typeof cd[3]==='number'?cd[3]:0);
  if(type==='parent'){ var opts=cfg.parentOpts(),cur=cfg.curParent(w);
    return '<select data-gr="'+ri+'" data-gpar="1" class="dbin">'+opts.map(function(op){return '<option value="'+op.val+'"'+(op.val===cur?' selected':'')+'>'+esc(op.label)+'</option>';}).join('')+'</select>'; }
  if(type==='co'){ return '<select data-gr="'+ri+'" data-gf="'+k+'" data-co="1" class="dbin"><option value="">—</option>'+(LIB.companies||[]).map(function(c){return '<option value="'+c.id+'"'+(o[k]===c.id?' selected':'')+'>'+esc(c.nameKo||c.nameEn||'')+'</option>';}).join('')+'</select>'; }
  if(type==='bool'){ return '<input type="checkbox" class="dbchk" data-gr="'+ri+'" data-gf="'+k+'"'+(o[k]?' checked':'')+'>'; }
  var val=(type==='arr')?((o[k]||[]).join(', ')):(o[k]==null?'':o[k]);
  var a='data-gr="'+ri+'" data-gf="'+k+'"'+(type==='arr'?' data-arr="1"':'')+' class="dbin"';
  if(wide>=2) return '<textarea '+a+' rows="2">'+esc(val)+'</textarea>';
  return '<input '+a+' value="'+dbAttrEsc(String(val))+'">';
}

/* ============ HOME ============ */
function renderHome(){
  const g=$('#docGrid');
  const cards=DOCS.filter(d=>d.kind!=='portfolio').map(d=>{
    const tpl=TEMPLATES.list.find(t=>t.id===d.template)||{name:d.template};
    return `<div class="doc" data-id="${d.id}">
      <div class="tt">${esc(d.title)}</div>
      <span class="badge">${esc(tpl.name)}</span>
      <div class="meta">/${esc(d.slug)} · ${new Date(d.updated).toLocaleDateString('ko-KR')}</div>
      <div class="acts">
        <button class="btn sm" data-act="edit">편집</button>
        <button class="btn sm" data-act="link">🔗 링크</button>
        <button class="btn sm" data-act="pdf">PDF</button>
        <button class="btn sm" data-act="del">삭제</button>
      </div></div>`;
  }).join('');
  g.innerHTML=`<div class="newcard" id="newCard">+ 새 이력서 만들기</div>`+cards;
}
$('#docGrid').addEventListener('click',e=>{
  if(e.target.id==='newCard'){const d=newDoc();openBuilder(d.id);return;}
  const card=e.target.closest('.doc'); if(!card)return;
  const d=DOCS.find(x=>x.id===card.dataset.id); const act=e.target.dataset.act; if(!d||!act)return;
  if(act==='edit')openBuilder(d.id);
  else if(act==='link'){navigator.clipboard.writeText(viewURL(d)).then(()=>toast('공개 링크 복사됨'));}
  else if(act==='pdf'){window.open(viewURL(d),'_blank');toast('열린 창에서 PDF로 저장을 누르세요');}
  else if(act==='del'){if(confirm('삭제할까요?')){DOCS=DOCS.filter(x=>x.id!==d.id);save();renderHome();}}
});
$('#newDocTop').addEventListener('click',()=>{const d=newDoc();openBuilder(d.id);});

/* ============ BUILDER ============ */
function openBuilder(id){curDocId=id;show('builder');}
function renderBuilder(){
  const d=DOCS.find(x=>x.id===curDocId)||DOCS[0]; curDocId=d?d.id:null;
  $('#bWrap').classList.toggle('hidden',!d); $('#bEmpty').classList.toggle('hidden',!!d);
  if(!d)return;
  $('#bTitle').textContent=d.title||'빌더';
  const tpls=TEMPLATES.list.map(t=>`<div class="tpl ${d.template===t.id?'sel':''}" data-tpl="${t.id}"><div class="t">${t.name}</div><div class="d">${t.desc}</div></div>`).join('');
  const expRows=d.lists.experiences.map((x,pos)=>rowTgl('experiences',pos,x.on,LIB.experiences[x.i]?.company||'(삭제됨)')).join('');
  const prjRows=d.lists.projects.map((x,pos)=>rowTgl('projects',pos,x.on,LIB.projects[x.i]?.name||'(삭제됨)')).join('');
  const secTgl=(k,label)=>`<div class="tgl"><span class="nm">${label}</span><button class="sw ${d[k]?'':'off'}" data-flag="${k}"></button></div>`;
  $('#bLeft').innerHTML=`
    <div class="blabel">문서</div>
    <div class="f"><label>제목</label><input id="bDocTitle" value="${esc(d.title)}"></div>
    <div class="blabel">템플릿</div>
    <div class="tplrow">${tpls}</div>
    <div class="blabel">자기소개 / 하이라이트</div>
    ${secTgl('summaryOn','자기소개')}
    ${d.template==='web'?secTgl('highlightsOn','핵심 지표(숫자)')+secTgl('axOn','AX 하이라이트'):''}
    <div class="blabel">경력 <span style="color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0">· 켜기/순서</span></div>
    ${expRows||'<div class="empty" style="padding:10px">경력 없음</div>'}
    <div class="blabel">프로젝트</div>
    ${prjRows||'<div class="empty" style="padding:10px">프로젝트 없음</div>'}
    <div class="blabel">기타 섹션</div>
    ${secTgl('skillsOn','스킬')}${secTgl('educationOn','학력')}${secTgl('awardsOn','수상')}
    <div class="pubbox">
      <div class="blabel" style="margin:0 0 8px">발행 설정</div>
      <div class="f"><label>URL 주소(슬러그)</label><input id="bSlug" value="${esc(d.slug)}"></div>
      <div class="f"><label>공개 범위</label><select id="bVis"><option value="unlisted"${d.visibility==='unlisted'?' selected':''}>링크 있는 사람만</option><option value="public"${d.visibility==='public'?' selected':''}>공개</option></select></div>
      <div class="urlline"><input id="bURL" readonly value=""><button class="btn sm" id="bCopy" style="border:none;border-radius:0">복사</button></div>
    </div>`;
  updatePreview();
}
function rowTgl(list,pos,on,name){
  return `<div class="tgl" data-list="${list}" data-pos="${pos}">
    <span class="grip">⋮⋮</span>
    <span class="mv" data-mv="up">▲</span><span class="mv" data-mv="dn">▼</span>
    <span class="nm">${esc(name)}</span>
    <button class="sw ${on?'':'off'}" data-toggle="1"></button></div>`;
}
function curDoc(){return DOCS.find(x=>x.id===curDocId);}
function touch(){const d=curDoc();if(d){d.updated=Date.now();save();}}
let pvTimer=null;
function updatePreview(){
  const d=curDoc(); if(!d)return;
  $('#bURL').value=viewURL(d);
  clearTimeout(pvTimer);
  pvTimer=setTimeout(()=>{$('#preview').setAttribute('srcdoc',TEMPLATES.render(resolve(d)));},180);
}

// builder interactions (delegated)
$('#bLeft').addEventListener('click',e=>{
  const d=curDoc(); if(!d)return;
  const tpl=e.target.closest('[data-tpl]'); if(tpl){d.template=tpl.dataset.tpl;touch();renderBuilder();return;}
  const flag=e.target.closest('[data-flag]'); if(flag){d[flag.dataset.flag]=!d[flag.dataset.flag];flag.classList.toggle('off');touch();updatePreview();return;}
  const row=e.target.closest('[data-list]');
  if(row){
    const list=row.dataset.list, pos=+row.dataset.pos, arr=d.lists[list];
    if(e.target.dataset.toggle){arr[pos].on=!arr[pos].on;e.target.classList.toggle('off');touch();updatePreview();return;}
    const mv=e.target.dataset.mv;
    if(mv==='up'&&pos>0){[arr[pos-1],arr[pos]]=[arr[pos],arr[pos-1]];touch();renderBuilder();}
    if(mv==='dn'&&pos<arr.length-1){[arr[pos+1],arr[pos]]=[arr[pos],arr[pos+1]];touch();renderBuilder();}
    return;
  }
  if(e.target.id==='bCopy'){navigator.clipboard.writeText($('#bURL').value).then(()=>toast('링크 복사됨'));}
});
$('#bLeft').addEventListener('input',e=>{
  const d=curDoc(); if(!d)return;
  if(e.target.id==='bDocTitle'){d.title=e.target.value;$('#bTitle').textContent=d.title;touch();}
  if(e.target.id==='bSlug'){d.slug=e.target.value.replace(/[^a-zA-Z0-9-_가-힣]/g,'-');e.target.value=d.slug;touch();updatePreview();}
});
$('#bLeft').addEventListener('change',e=>{
  const d=curDoc(); if(!d)return;
  if(e.target.id==='bVis'){d.visibility=e.target.value;touch();}
});
$('#bPublish').addEventListener('click',async()=>{
  const d=curDoc();if(!d)return;
  if(window.CLOUD&&CLOUD.user()){ try{ normalizeIds(); await CLOUD.pushAll(LIB,DOCS,resolveAny); }catch(e){ toast('발행 오류: '+(e.message||e)); return; } }
  navigator.clipboard.writeText(viewURL(d)).then(()=>toast('발행됨 · 공개 링크 복사 완료'));
});
$('#bViewOpen').addEventListener('click',()=>{const d=curDoc();if(d)window.open(viewURL(d),'_blank');});

/* ============ PORTFOLIO ============ */
let curPfId=null, pfPvTimer=null;
function curPf(){return DOCS.find(x=>x.id===curPfId&&x.kind==='portfolio');}
function flatWorks(){const a=[];(LIB.companies||[]).forEach((c,ci)=>(c.works||[]).forEach((w,wi)=>a.push({ci,wi})));return a;}
function reconcilePF(d){
  if(!d.works)d.works=[];
  const key=x=>x.ci+':'+x.wi, have=new Set(d.works.map(key));
  d.works=d.works.filter(x=>LIB.companies[x.ci]&&LIB.companies[x.ci].works[x.wi]);
  flatWorks().forEach(x=>{if(!have.has(key(x)))d.works.push({ci:x.ci,wi:x.wi,on:false});});
  return d;
}
function resolvePF(d){
  reconcilePF(d);
  const works=[];
  d.works.forEach(x=>{ if(x.on){ const c=LIB.companies[x.ci], w=c&&c.works[x.wi]; if(w) works.push(Object.assign({},w,{company:c.nameKo||c.nameEn||'', period:window.fmtPeriod(w.startDate,w.endDate), images:(w.media||[]).filter(m=>m.type==='image').map(m=>m.url)})); }});
  return { template:'portfolio', title:d.title, subtitle:d.subtitle, intro:d.intro, cover:d.cover, slug:d.slug, visibility:d.visibility, profile:LIB.profile, works };
}
function newPortfolio(){
  const d={id:uid(),kind:'portfolio',template:'portfolio',title:'새 포트폴리오',subtitle:'',intro:'',cover:'',slug:'pf-'+uid(),visibility:'unlisted',works:[],updated:Date.now()};
  reconcilePF(d); d.works.forEach(x=>{const w=LIB.companies[x.ci].works[x.wi]; x.on=!!w.featured;});
  DOCS.unshift(d); save(); return d;
}
function pfTouch(){const d=curPf();if(d){d.updated=Date.now();save();}}
function updatePfPreview(){const d=curPf();if(!d)return;$('#pfURL').value=viewURL(d);clearTimeout(pfPvTimer);pfPvTimer=setTimeout(()=>{$('#pfPreview').setAttribute('srcdoc',TEMPLATES.render(resolvePF(d)));},180);}

function renderPortfolioView(){
  if(curPfId&&curPf()){ renderPfEditor(); return; }
  curPfId=null;
  $('#pfWrap').classList.add('hidden'); $('#pfList').classList.remove('hidden');
  $('#pfBackList').style.display='none';$('#pfViewOpen').style.display='none';$('#pfPublish').style.display='none';$('#pfNew').style.display='';
  $('#pfTitle').textContent='포트폴리오';
  const list=DOCS.filter(d=>d.kind==='portfolio');
  $('#pfList').innerHTML=`<div class="grid"><div class="newcard" id="pfNewCard">+ 새 포트폴리오 만들기</div>`+
    list.map(d=>`<div class="doc" data-pfid="${d.id}"><div class="tt">${esc(d.title)}</div>
      <span class="badge" style="color:var(--ok);background:color-mix(in oklch,var(--ok) 14%,transparent)">포트폴리오</span>
      <div class="meta">/p/${esc(d.slug)} · ${new Date(d.updated).toLocaleDateString('ko-KR')}</div>
      <div class="acts"><button class="btn sm" data-pfact="edit">편집</button><button class="btn sm" data-pfact="link">🔗 링크</button><button class="btn sm" data-pfact="open">열기</button><button class="btn sm" data-pfact="del">삭제</button></div></div>`).join('')+`</div>`;
}
function renderPfEditor(){
  const d=curPf(); if(!d){renderPortfolioView();return;}
  reconcilePF(d);
  $('#pfWrap').classList.remove('hidden'); $('#pfList').classList.add('hidden');
  $('#pfBackList').style.display='';$('#pfViewOpen').style.display='';$('#pfPublish').style.display='';$('#pfNew').style.display='none';
  $('#pfTitle').textContent=d.title||'포트폴리오';
  const rows=d.works.map((x,pos)=>{const c=LIB.companies[x.ci],w=c&&c.works[x.wi];if(!w)return '';
    return `<div class="tgl" data-pfpos="${pos}"><span class="mv" data-pfmv="up">▲</span><span class="mv" data-pfmv="dn">▼</span><span class="nm">${esc(w.title)} <span style="color:var(--muted);font-size:11px">· ${esc(c.name)}</span></span><button class="sw ${x.on?'':'off'}" data-pftoggle="1"></button></div>`;}).join('');
  $('#pfLeft').innerHTML=`
    <div class="blabel">포트폴리오 정보</div>
    <div class="f"><label>제목</label><input id="pfF-title" value="${esc(d.title)}"></div>
    <div class="f"><label>부제</label><input id="pfF-subtitle" value="${esc(d.subtitle||'')}"></div>
    <div class="f"><label>소개글</label><textarea id="pfF-intro" rows="3">${esc(d.intro||'')}</textarea></div>
    <div class="f"><label>커버 이미지 URL</label><input id="pfF-cover" value="${esc(d.cover||'')}"></div>
    <div class="blabel">담을 작업 <span style="color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0">· 켜기/순서</span></div>
    ${rows||'<div class="empty" style="padding:10px">작업 없음 (라이브러리에서 추가)</div>'}
    <div class="pubbox">
      <div class="blabel" style="margin:0 0 8px">발행</div>
      <div class="f"><label>URL 주소(슬러그)</label><input id="pfF-slug" value="${esc(d.slug)}"></div>
      <div class="f"><label>공개 범위</label><select id="pfF-vis"><option value="unlisted"${d.visibility==='unlisted'?' selected':''}>링크 있는 사람만</option><option value="public"${d.visibility==='public'?' selected':''}>공개</option></select></div>
      <div class="urlline"><input id="pfURL" readonly value=""><button class="btn sm" id="pfCopy" style="border:none;border-radius:0">복사</button></div>
    </div>`;
  updatePfPreview();
}
$('#pfNew').addEventListener('click',()=>{const d=newPortfolio();curPfId=d.id;renderPortfolioView();});
$('#pfBackList').addEventListener('click',()=>{curPfId=null;renderPortfolioView();});
$('#pfViewOpen').addEventListener('click',()=>{const d=curPf();if(d)window.open(viewURL(d),'_blank');});
$('#pfPublish').addEventListener('click',async()=>{const d=curPf();if(!d)return;
  if(window.CLOUD&&CLOUD.user()){try{normalizeIds();await CLOUD.pushAll(LIB,DOCS,resolveAny);}catch(e){toast('발행 오류: '+(e.message||e));return;}}
  navigator.clipboard.writeText(viewURL(d)).then(()=>toast('발행됨 · 포트폴리오 링크 복사'));});
$('#pfList').addEventListener('click',e=>{
  if(e.target.id==='pfNewCard'){const d=newPortfolio();curPfId=d.id;renderPortfolioView();return;}
  const card=e.target.closest('.doc'); if(!card)return;
  const d=DOCS.find(x=>x.id===card.dataset.pfid); const act=e.target.dataset.pfact; if(!d||!act)return;
  if(act==='edit'){curPfId=d.id;renderPortfolioView();}
  else if(act==='link'){navigator.clipboard.writeText(viewURL(d)).then(()=>toast('포트폴리오 링크 복사됨'));}
  else if(act==='open'){window.open(viewURL(d),'_blank');}
  else if(act==='del'){if(confirm('삭제할까요?')){DOCS=DOCS.filter(x=>x.id!==d.id);save();renderPortfolioView();}}
});
$('#pfLeft').addEventListener('click',e=>{
  const d=curPf(); if(!d)return;
  const row=e.target.closest('[data-pfpos]');
  if(row){const pos=+row.dataset.pfpos;
    if(e.target.dataset.pftoggle){d.works[pos].on=!d.works[pos].on;e.target.classList.toggle('off');pfTouch();updatePfPreview();return;}
    const mv=e.target.dataset.pfmv;
    if(mv==='up'&&pos>0){[d.works[pos-1],d.works[pos]]=[d.works[pos],d.works[pos-1]];pfTouch();renderPfEditor();}
    if(mv==='dn'&&pos<d.works.length-1){[d.works[pos+1],d.works[pos]]=[d.works[pos],d.works[pos+1]];pfTouch();renderPfEditor();}
    return;}
  if(e.target.id==='pfCopy'){navigator.clipboard.writeText($('#pfURL').value).then(()=>toast('링크 복사됨'));}
});
$('#pfLeft').addEventListener('input',e=>{
  const d=curPf(); if(!d)return; const id=e.target.id;
  if(id==='pfF-title'){d.title=e.target.value;$('#pfTitle').textContent=d.title;pfTouch();}
  else if(id==='pfF-subtitle'){d.subtitle=e.target.value;pfTouch();updatePfPreview();}
  else if(id==='pfF-intro'){d.intro=e.target.value;pfTouch();updatePfPreview();}
  else if(id==='pfF-cover'){d.cover=e.target.value;pfTouch();updatePfPreview();}
  else if(id==='pfF-slug'){d.slug=e.target.value.replace(/[^a-zA-Z0-9-_가-힣]/g,'-');e.target.value=d.slug;pfTouch();updatePfPreview();}
});
$('#pfLeft').addEventListener('change',e=>{const d=curPf();if(d&&e.target.id==='pfF-vis'){d.visibility=e.target.value;pfTouch();}});

/* ============ LIBRARY ============ */

function fArea(b,i,field,val,label,type,rows,hint){

function techSeedRows(){
  var CUR=[
    {label:'마케팅 · 데이터', items:['Meta Ads','Google Ads','GA4·GTM','네이버 검색광고 API','BigQuery','Amplitude','Airbridge']},
    {label:'개발', items:['TypeScript','Next.js','React','Tailwind','Supabase','SQL','Metabase·Redash']},
    {label:'AI · 인프라', items:['Anthropic','OpenAI','AI SDK·MCP','Vertex AI','Vercel','GitHub Actions','git worktree']}
  ];
  var rows=CUR.map(function(r){return {label:r.label,items:r.items.slice(),visible:true};});
  var present={}; rows.forEach(function(r){r.items.forEach(function(t){present[String(t).toLowerCase()]=1;});});
  var extras=[],push=function(t){t=t&&String(t).trim();if(t&&!present[t.toLowerCase()]){present[t.toLowerCase()]=1;extras.push(t);}};
  ((typeof LIB!=='undefined'&&LIB.companies)||[]).forEach(function(c){(c.works||[]).forEach(function(w){(w.stack||[]).forEach(push);});});
  ((typeof LIB!=='undefined'&&LIB.profile&&LIB.profile.stack)||[]).forEach(function(s){push(s.title||s.area);});
  ((typeof LIB!=='undefined'&&LIB.capabilities)||[]).forEach(function(c){if(c.visible!==false)push(c.label);});
  if(extras.length)rows.push({label:'후보 · DB (화면 미노출)',items:extras,visible:false});
  return rows;
}

  var KEYS=KLIO_SEC.map(function(p){return p[0];});
  if(!d.klio||typeof d.klio!=='object')d.klio={};

  var cur=Array.isArray(d.klio.sections)?d.klio.sections:[];
  var seen={},out=[];
  cur.forEach(function(s){ if(!s)return; var k=s.key==='archive'?'ax':s.key; if(KEYS.indexOf(k)>=0&&!seen[k]){ seen[k]=1; out.push({key:k,label:(s.label!=null?s.label:''),on:s.on!==false}); } });
  KEYS.forEach(function(k){ if(!seen[k]) out.push({key:k,label:'',on:true}); });
  d.klio.sections=out;
  // Techstack 편집 데이터: 없으면(최초) 시드, 있으면 형태 정규화(사용자가 전부 비운 경우는 존중)
  if(!Array.isArray(d.klio.techstack)) d.klio.techstack=techSeedRows();
  d.klio.techstack=d.klio.techstack.map(function(r){ r=r||{}; var lb=(r.label!=null?String(r.label):''), vis=r.visible!==false;
    if(lb==='기타 · DB'){ lb='후보 · DB (화면 미노출)'; vis=false; } // 예전 자동 덤프 행은 화면에서 내리고 후보 목록으로만 유지
    return {label:lb, items:Array.isArray(r.items)?r.items.filter(function(x){return x!=null&&String(x).trim();}).map(String):[], visible:vis}; });
  // AX 대표 3: 없으면 콘솔 대표값 시드, 있으면 정규화
  if(!Array.isArray(d.klio.axCore)) d.klio.axCore=axCoreSeed();
  d.klio.axCore=d.klio.axCore.map(function(c,i){ c=c||{}; return {num:(c.num!=null&&String(c.num).trim()?String(c.num):'0'+(i+1)), title:(c.title!=null?String(c.title):''), desc:(c.desc!=null?String(c.desc):''), img:(c.img?String(c.img):''), visible:c.visible!==false}; });
  // 표시 설정: show(표시 항목 on/off) · hidden(개별 숨김 id 목록) · skills(스킬 카드)
  if(!d.klio.show||typeof d.klio.show!=='object')d.klio.show={};
  if(!d.klio.hidden||typeof d.klio.hidden!=='object'){
    // 처음 만들 때 지금 화면 그대로: 하단 스탯은 앞 3개만 노출
    var HL=(typeof LIB!=='undefined'&&LIB.highlights)||[];
    d.klio.hidden={companies:[],works:[],stats:HL.slice(3).map(function(h){return h&&h.id;}).filter(Boolean)};
  }
  ['companies','works','stats'].forEach(function(b){ if(!Array.isArray(d.klio.hidden[b]))d.klio.hidden[b]=[]; });
  if(!Array.isArray(d.klio.skills)) d.klio.skills=skillsSeed(d);
  d.klio.skills=d.klio.skills.map(function(s){ s=s||{}; return {value:s.value!=null?String(s.value):'', label:s.label!=null?String(s.label):'', sub:s.sub!=null?String(s.sub):'', visible:s.visible!==false}; });
  // ui(사진 딤 등) · expPj(회사별 Experience 주요 프로젝트 목록, 회사 id → 항목) — 없을 때만 빈 그릇 생성(기존 값 유지)
  if(!d.klio.ui||typeof d.klio.ui!=='object')d.klio.ui={};
  if(!d.klio.expPj||typeof d.klio.expPj!=='object'||Array.isArray(d.klio.expPj))d.klio.expPj={};
  if(!d.klio.expColor||typeof d.klio.expColor!=='object'||Array.isArray(d.klio.expColor))d.klio.expColor={};
  if(!d.klio.expCo||typeof d.klio.expCo!=='object'||Array.isArray(d.klio.expCo))d.klio.expCo={}; // 회사별 설정(프로젝트 목록·기간 표시)
  // 프로젝트 묶음: 없을 때만 기본 4개(사용자 편집값 유지) · 한 분야는 한 묶음에만 · groupOf = 프로젝트별 예외(작업 id → 묶음 id)

}

function skillsSeed(d){
  const EN={'퍼포먼스':'Performance','성과':'Data','브랜딩':'Branding','커머스':'Commerce','콘텐츠':'Content','그로스':'Growth','영상':'Film','CRM':'CRM','제휴':'Partnership','AX':'AX'};
  const hid=(((d&&d.klio&&d.klio.hidden)||{}).works)||[], cnt={};
  ((typeof LIB!=='undefined'&&LIB.companies)||[]).forEach(c=>(c.works||[]).forEach(w=>{ if(hid.indexOf(w.id)>=0)return; const k=w.category||'기타'; cnt[k]=(cnt[k]||0)+1; }));
  return Object.keys(cnt).map(k=>({k,n:cnt[k]})).sort((a,b)=>b.n-a.n).slice(0,6).map(o=>({value:String(o.n),label:o.k,sub:EN[o.k]||o.k,visible:true}));

    +`<div class="kd-acts"><a class="kd-btn" href="https://kimjinsoo-mkt-ax.vercel.app/portfolio?kilo-owner=1" target="_blank" rel="noopener" title="이 브라우저에서 여는 포트폴리오 방문은 집계하지 않아요">이 브라우저 방문 제외</a><button class="kd-btn" data-kview-reset>보정 지우기</button><button class="kd-btn" data-kview-refresh>새로 고침</button></div>`
    +G2(F('누적 라벨',kt('viewsTotal','누적')),F('오늘 라벨',kt('viewsToday','오늘'))));
  const P_home=()=>intro('맨 위 첫 화면이에요. 비워 둔 칸은 기본값으로 보여요.')

      +F('대표 문장',ta('profile.tagline',LIB.profile.tagline,'마케팅의 문제를 AI와 코드로 푸는 그로스 빌더',2),'첫 문장 = “{이름} — {대표 문장}.”')
      +F('첫 문장 직접 쓰기',kta('heroMain',heroAuto,2),'선택 · 비우면 위 칸들로 자동(회색 글씨가 지금 모습) · 쓰면 이 문장 그대로')
      +F('회색 보조 문장',kta('heroSub',sum0,2),'비우면 소개 첫 문장')

    +card('사진 카드',`<div class="kd-row" style="margin-bottom:12px">${thumb(LIB.profile.avatar,48)}<div style="flex:1;min-width:0">${ti('profile.avatar',LIB.profile.avatar,'사진 URL (또는 업로드)')}</div>${upl('avatar','업로드')}</div>`
      +`<div class="kd-sws" style="margin-bottom:12px">${showSw('home','photo',false,'사진 사용 (끄면 이니셜)')}</div>`
      +G2(F('사진 딤',`<div class="kd-row" style="height:36px"><input type="range" min="0" max="60" step="5" value="${dimV}" data-knum="ui.photoDim" style="flex:1;accent-color:var(--acc)"><b data-knum-out="ui.photoDim" style="font-size:12px;min-width:34px;text-align:right">${dimV}%</b></div>`),
          F('딤 방식',`<select class="kd-in" data-ksel="ui.photoDimMode"><option value="bg"${(kd.ui||{}).photoDimMode!=='all'?' selected':''}>배경만 (얼굴은 밝게)</option><option value="all"${(kd.ui||{}).photoDimMode==='all'?' selected':''}>사진 전체</option></select>`))
      +G2(F('이니셜',kt('initials','JK'),'사진 끌 때'),F('회전 문구',kt('orbit','JINSOO KIM · MARKETER · '))))
    +card('상단 연락처',`<div class="kd-sws" style="margin-bottom:12px">${showSw('home','location',true,'위치')}${showSw('home','email',true,'이메일')}${showSw('home','site',true,'사이트 링크')}</div>`
      +G2(F('위치',ti('profile.location',LIB.profile.location,'Seoul, KR')),F('이메일',ti('profile.email',LIB.profile.email,'you@mail.com')))
      +F('사이트 링크',kt('siteUrl','https://kimjinsoo-mkt-ax.vercel.app'),'Contact와 공유 · 비우면 기본 도메인'))
    +viewsCard;

  // ── About
  const P_about=()=>intro('About 섹션 문단이에요.')
    +card('소개',F('소개 요약',ta('profile.summary',LIB.profile.summary,'',7),'이력서와 공유 · 화면엔 문장 기준 2문단 자동')
      +F('포트폴리오 전용 소개',kta('about','비우면 위 요약을 사용',6),'선택 · 빈 줄 = 문단 구분 · 2번째 문단부터 회색'));

  // ── Projects: 회사 → 작업 (작업은 제목 줄에서 노출·대표, ▸로 세부)
  const CATOPTS=['퍼포먼스','성과','브랜딩','커머스','콘텐츠','그로스','영상','CRM','제휴','AX'];
  const ppN=cos.reduce((n,c)=>n+(c.works||[]).filter(w=>!kHidden('works',w.id)).length,0);
  const ppUrl='https://kimjinsoo-mkt-ax.vercel.app/'+encodeURIComponent(axDoc().slug||'portfolio')+'/projects';
  const ppCard=card('전체 프로젝트 페이지',
    `<div class="kd-seg" style="margin-bottom:12px"><button class="kd-btn${axPvPage!=='projects'?' on':''}" data-kpv="main">메인 화면</button><button class="kd-btn${axPvPage==='projects'?' on':''}" data-kpv="projects">전체 프로젝트 페이지</button><a class="kd-btn" href="${ppUrl}" target="_blank" rel="noopener" title="${axAttr(ppUrl)}">새 탭 ↗</a></div>`
    +G2(F('버튼 제목',kt('pjAllTitle','전체 프로젝트 보기')),F('버튼 보조 문구',kt('pjAllSub','원형 휠로 한눈에 돌려보기'),`큰 숫자 = 노출 프로젝트 수(${ppN})`))
    +G2(F('페이지 제목',kt('ppTitle','All Projects'),'오른쪽 위 큰 글씨 · 띄어쓰기마다 줄바꿈'),F('돌아가기 버튼',kt('ppBack','포트폴리오')))
    +`<p class="kd-note">주소 <code>${axText(ppUrl.replace(/^https:\/\//,''))}</code> — 노출된 프로젝트 ${ppN}개가 원형 휠로 펼쳐져요(드래그 · 휠 · ← →, 가만두면 천천히 넘어감). 꼭대기 카드 정보가 가운데에, ‘자세히 보기’로 상세가 열려요. 모자이크 타일을 누르면 그 카드로 바로 열리고, 미리보기에서도 타일을 누르면 이 페이지로 바뀌어요.</p>`,'새 URL');
  const P_projects=()=>intro('회사를 눌러 작업을 편집해요. <b>노출</b> = 포트폴리오·전체 프로젝트 페이지에 표시 · <b>대표</b> = 상단 모자이크(최대 5개). 타일 배지는 첫 번째 지표, 썸네일은 첫 번째 이미지(없으면 유튜브 링크)예요.')

          const media=(w.media||[]).map((m,mi)=>`<span style="position:relative;display:inline-block">${thumb(m.url,56)}<button class="kd-ib kd-del" data-del="${P}.media.${mi}" title="이미지 삭제" style="position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:var(--surface)">✕</button></span>`).join('');
          detail=`<div class="kd-wd">`

  // ── 프로젝트 그룹: 전체 프로젝트 페이지(원형 휠) 아래 분류 버튼 = 분야를 4~5개로 묶은 것 · 프로젝트별 예외 지정
  const CAT_EN={'퍼포먼스':'Performance','성과':'Data','브랜딩':'Branding','커머스':'Commerce','콘텐츠':'Content','그로스':'Growth','영상':'Film','CRM':'CRM','제휴':'Partnership','AX':'AX'};
  const P_groups=()=>{
    const G=kd.groups||[], GO=kd.groupOf||{}, allW=[];
    cos.forEach((c,ci)=>(c.works||[]).forEach(w=>{ if(!kHidden('works',w.id)) allW.push({c,w}); }));
    const cats=[]; allW.forEach(x=>{ const k=x.w.category||'기타'; if(cats.indexOf(k)<0)cats.push(k); }); CATOPTS.forEach(k=>{ if(cats.indexOf(k)<0)cats.push(k); });
    const catG=k=>G.find(g=>(g.cats||[]).indexOf(k)>=0);
    const gOfW=w=>{ const o=G.find(g=>g.id===GO[w.id]); return o||catG(w.category||'기타')||null; };
    const nCat=k=>allW.filter(x=>(x.w.category||'기타')===k).length;
    const rows=G.map((g,i)=>{
      const n=allW.filter(x=>gOfW(x.w)===g).length;
      // 담긴 분야만 칩(누르면 빼기) + '＋ 분야 담기'(다른 묶음에 있으면 이 묶음으로 옮김)

        +`<select class="kd-in kd-catadd" data-kg-addcat="${i}"><option value="">＋ 분야 담기</option>${cats.filter(k=>(g.cats||[]).indexOf(k)<0).map(k=>{ const o=catG(k); return `<option value="${axAttr(k)}">${axText(CAT_EN[k]||k)} (${nCat(k)})${o?' · 지금 '+axText(o.label||'다른 묶음'):' · 묶음 없음'}</option>`; }).join('')}</select>`;
      return `<div class="kd-item${g.on===false?' off':''}" data-row><div class="kd-row">${sw(`data-kg-on="${i}"`,g.on!==false,'','노출')}<input class="kd-in" data-kg-label="${i}" value="${axAttr(g.label||'')}" placeholder="묶음 이름 (예: Performance & Growth)"><span class="kd-cnt">${n}개</span>${upDown('data-kg-move',i,i===0,i===G.length-1)}${delB('data-kg-del',i)}</div><div class="kd-cats">${chipsH}</div></div>`;
    }).join('')||`<p class="kd-note" style="margin:0 0 6px">묶음이 없어요 — 추가하거나 기본값으로 채우세요. (없으면 화면엔 ‘전체’만 보여요)</p>`;
    const orphan=allW.filter(x=>!gOfW(x.w)).length, freeCats=cats.filter(k=>nCat(k)&&!catG(k));
    const wrows=allW.map(x=>{ const o=GO[x.w.id]||'', auto=catG(x.w.category||'기타');
      return `<div class="kd-wrow"><span class="kd-wt">${axText(x.w.title||'(제목 없음)')}<small>${axText(CAT_EN[x.w.category]||x.w.category||'기타')} · ${axText(coName(x.c))}</small></span><select class="kd-in" data-kg-w="${axAttr(x.w.id||'')}"><option value="">자동 · ${axText(auto?(auto.label||'이름 없음'):'기타')}</option>${G.map(g=>`<option value="${axAttr(g.id)}"${o===g.id?' selected':''}>${axText(g.label||'이름 없음')}</option>`).join('')}</select></div>`; }).join('');
    return intro('전체 프로젝트 페이지(원형 휠) 아래 분류 버튼이에요. 분야를 눌러 묶음에 담으면 그 분야 프로젝트가 전부 들어가요. 휠 카드도 묶음 순서대로 놓여요. 오른쪽 미리보기에서 바로 확인할 수 있어요.')

      +card('프로젝트별 묶음',`<p class="kd-note" style="margin:0 0 10px">기본은 분야를 따라 자동이에요. 특정 프로젝트만 다른 묶음에 넣고 싶을 때 바꿔요.</p>`+wrows,'예외 지정');
  };

  // ── Experience: 표시 항목(공통) · 회사(행에서 노출·목록·기간 바로 설정, 펼쳐서 내용) · 스탯
  const P_experience=()=>{
    const rows=cos.map((c,ci)=>{

      const sub=c.id?`<div class="kd-acc-sub">${sw(`data-kco="${axAttr(c.id)}:pj"`,pjOn,'프로젝트 목록')}${sw(`data-kco="${axAttr(c.id)}:pjPeriod"`,pjpOn,'프로젝트 기간')}</div>`:'';
      let body='';
      if(open){
        const cmets=(c.metrics||[]).map((m,mi)=>`<div class="kd-row" style="margin-bottom:6px">${ti(`${P}.metrics.${mi}.v`,m.v,'값 (예: 2배)')}${ti(`${P}.metrics.${mi}.k`,m.k,'라벨 (예: ROAS 개선)')}${delB('data-del',`${P}.metrics.${mi}`)}</div>`).join('');
        const xCustom=xpjList(ci,false), xl=xCustom||xpjDerived(ci);
        const xrows=xl.map((it,i)=>`<div class="kd-item${it.visible===false?' off':''}" data-row><div class="kd-row">${sw(`data-xpj-on="${ci}:${i}"`,it.visible!==false,'','노출')}<input class="kd-in" data-xpj="${ci}:${i}:title" value="${axAttr(it.title)}" placeholder="프로젝트명">${upDown('data-xpj-move',`${ci}:${i}`,i===0,i===xl.length-1)}${delB('data-xpj-del',`${ci}:${i}`)}</div><div class="kd-row${pjpOn?'':' kd-dim'}" style="margin-top:6px;padding-left:38px"><span class="kd-l" style="margin:0;white-space:nowrap">기간</span><input class="kd-in" data-xpj="${ci}:${i}:period" value="${axAttr(it.period)}" placeholder="2021.04 – 2021.12" style="max-width:220px"></div></div>`).join('')

      if(ds.kview){ const v=Math.max(0,parseInt(t.value,10)||0), real=axViews.data||{total:0,today:0}; if(!k.views||typeof k.views!=='object')k.views={}; if(ds.kview==='total')k.views.totalAdj=v-real.total; else { k.views.todayAdj=v-real.today; k.views.todayDay=kstToday(); } axSchedule(); return; }

      if((el=q('[data-xpj-del]'))){ const [ci,i]=el.dataset.xpjDel.split(':'), L=xpjList(+ci,true); if(L)L.splice(+i,1); rerender(); return; }
      if((el=q('[data-xpj-move]'))){ const [ci,i,dir]=el.dataset.xpjMove.split(':'), L=xpjList(+ci,true); if(L)axMove(L,+i,dir); rerender(); return; }
      if((el=q('[data-xpj-reset]'))){ const c=LIB.companies[+el.dataset.xpjReset]; if(c&&k.expPj)delete k.expPj[c.id]; rerender(); return; }
      if((el=q('[data-kl-on]'))){ const [n,i]=el.dataset.klOn.split(':'), L=klList(n); if(L[+i])L[+i].visible=el.checked; dim(el,el.checked); save(); updateAXPreview(); return; }
      if((el=q('[data-kl-add]'))){ const n=el.dataset.klAdd; klList(n).push(KL_NEW[n]()); rerender(); return; }
      if((el=q('[data-kl-del]'))){ const [n,i]=el.dataset.klDel.split(':'); klList(n).splice(+i,1); rerender(); return; }
      if((el=q('[data-kl-move]'))){ const [n,i,dir]=el.dataset.klMove.split(':'); axMove(klList(n),+i,dir); rerender(); return; }
      if((el=q('[data-kl-reset]'))){ const n=el.dataset.klReset; k[n]=KL_SEED[n](); rerender(); return; }
      // 아코디언 머리(안의 버튼·스위치·입력 클릭은 제외)
      if(e.target.closest('input,button,label,select,textarea,a'))return;
      if((el=q('[data-kd-co]'))){ axOpenCo=axOpenCo===el.dataset.kdCo?'':el.dataset.kdCo; renderAXAdmin(); axPvGoto('experience',true); return; }
      if((el=q('[data-kd-pjco]'))){ axOpenPj=axOpenPj===el.dataset.kdPjco?'':el.dataset.kdPjco; axOpenW=''; renderAXAdmin(); axPvGoto('projects',true); return; }
    });
    left.addEventListener('change',async e=>{
      const t=e.target;
      if(t.dataset&&t.dataset.kgAddcat!=null){ const k=axDoc().klio, g=(k.groups||[])[+t.dataset.kgAddcat], cat=t.value; if(g&&cat){ k.groups.forEach(o=>{ o.cats=(o.cats||[]).filter(c=>c!==cat); }); g.cats.push(cat); } rerender(); return; } // 분야 담기(다른 묶음에서 옮김)
      if(t.dataset&&t.dataset.kgW!=null){ const k=axDoc().klio; if(!k.groupOf||typeof k.groupOf!=='object')k.groupOf={}; if(t.value)k.groupOf[t.dataset.kgW]=t.value; else delete k.groupOf[t.dataset.kgW]; rerender(); return; } // 프로젝트별 묶음 예외
      if(t.dataset.ksel){ kSet(t.dataset.ksel,t.value); axSchedule(); return; }
      if(t.tagName==='SELECT'&&t.dataset.p){ axSet(t.dataset.p,t.value); axSchedule(); return; }
      const up=t.dataset&&t.dataset.axUpload; if(!up||!t.files||!t.files.length)return;
      if(!(window.CLOUD&&CLOUD.user())){ toast('이미지 업로드는 로그인이 필요해요'); t.value=''; return; }
      toast('업로드 중…');
      try{
        const [kind,a,b]=up.split(':');
        if(kind==='logo'){ LIB.companies[+a].logo=await CLOUD.uploadFile(t.files[0]); }
        else if(kind==='avatar'){ LIB.profile.avatar=await CLOUD.uploadFile(t.files[0]); kSet('show.home.photo',true); }
        else if(kind==='axcore'){ const c=axDoc().klio.axCore[+a]; if(c)c.img=await CLOUD.uploadFile(t.files[0]); }
        else if(kind==='work'){ const w=LIB.companies[+a].works[+b]; if(!Array.isArray(w.media))w.media=[]; for(const f of t.files){ w.media.push({id:uid(),type:'image',url:await CLOUD.uploadFile(f)}); } }
        if(typeof normalizeIds==='function')normalizeIds();
        rerender(); toast('업로드 완료 ✓');
      }catch(err){ toast('업로드 오류: '+(err.message||err)); }
      t.value='';
    });
    const pub=$('#axPublish'); if(pub)pub.onclick=()=>{ const d=axDoc(); d.updated=Date.now(); save(); const u=viewURL(d); if(navigator.clipboard)navigator.clipboard.writeText(u).then(()=>toast('발행됨 · 링크 복사: '+u)).catch(()=>toast('발행됨: '+u)); else toast('발행됨: '+u); };
    const vo=$('#axViewOpen'); if(vo)vo.onclick=()=>{ const d=axDoc(); save(); const u=viewURL(d), pu=axPvPage==='projects'&&!/[?#]/.test(u)?u.replace(/\/$/,'')+'/projects'+(axPvCard?'#p-'+encodeURIComponent(axPvCard):''):u; setTimeout(()=>window.open(pu,'_blank'),300); };
    // 미리보기 안 클릭 → 화면 전환: 타일·전체보기 = 전체 프로젝트 페이지(그 카드) / 돌아가기 = 메인 Projects / 카드 넘김 = 기억
    window.addEventListener('message',e=>{
      const f=$('#axPreview'); if(!f||e.source!==f.contentWindow)return; const m=e.data||{};
      if(m.klio==='pp') axPvSetPage('projects',{card:typeof m.id==='string'?m.id:''});
      else if(m.klio==='pp-back') axPvSetPage('main',{back:'projects'});
      else if(m.klio==='card'&&typeof m.id==='string') axPvCard=m.id;
    });
  }
  updateAXPreview();
}

/* ============ boot ============ */
(async function(){
  renderHome();
  if(window.CLOUD&&CLOUD.enabled()){
    await CLOUD.init();
    _lastUser=CLOUD.user();
    CLOUD.onAuth(onAuth);
    renderAuthBox();
    if(CLOUD.user()) await syncFromCloud();
  }else{ renderAuthBox(); }
})();
</script>
</body>
</html>
